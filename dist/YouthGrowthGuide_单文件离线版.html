<script>
window.CORPUS_DATA = [{"num":"1","tag1":"通用","tag2":"自己就能做","title":"用主动回忆自测代替反复看书画荧光笔，提取练习让长时记忆留存率翻倍","cost":"不花一分钱，拿一张白纸或遮挡卡盖住课本答案。","plain":"很多人拿荧光笔把课本画得花花绿绿、翻来覆去重读好几遍，这叫「熟练度幻觉」——看的时候觉得全懂了，合上书考试脑子一片空白。合上书在白纸上默写关键公式、考点框架，逼大脑去主动检索提取，这种“烧脑”的过程才是记忆真正固化的时刻。","benefit":"Karpicke \u0026 Roediger 2008 年《Science》经典随机试验显示，进行提取自测练习的学生一周后记忆保持率为 80%，而反复重读组仅为 34%（效应量 d=1.50）。主动提取是认知心理学公认最高效的学习策略（国际 RCT，现行有效）。","level":"A","source":"Karpicke JD, Roediger HL 3rd (2008). Science, 319(5865), 966-968. https://doi.org/10.1126/science.1152408 ；Dunlosky J 等(2013). Psychol Sci Public Interest, 14(1), 4-58. https://doi.org/10.1177/1529100612453266","remark":"每读完一节教材，花 3 分钟合上书问自己：这一节核心讲了哪三个点？逻辑推导过程是什么？","parentQuote":"","fileName":"01-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"2","tag1":"通用","tag2":"自己就能做","title":"运用艾宾浩斯间隔重复背诵与刷题，拒绝考前单次突击熬夜死记硬背","cost":"不花钱，使用普通纸质错题卡或开源免费工具 Anki。","plain":"连续花 5 个小时猛背单词，不如把这 5 个小时拆成 5 天、每天花 1 小时复习。在刚要遗忘的时间节点（第 1 天、第 2 天、第 4 天、第 7 天、第 15 天）重新复习一遍，能把知识点从脆弱的短期记忆直接锁死在长期记忆区。","benefit":"Cepeda 等 2008 年关于间隔效应（Spacing Effect）的元分析证实，相同学习总时长下，采用分散间隔复习比集中单次突击在长期保留测试中的成绩提升 20% 到 40%（国际元分析，现行有效）。","level":"A","source":"Cepeda NJ 等(2008). Psychol Bull, 134(4), 587-608. https://doi.org/10.1037/0033-2909.134.4.587","remark":"理科错题不要抄完题目就扔一边，必须按照 1-3-7 天的节奏遮住答案在草稿纸上重做一遍。","parentQuote":"","fileName":"01-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"3","tag1":"通用","tag2":"自己就能做","title":"设定「如果……那么……」执行意图，一秒击碎放学回家拖延症","cost":"每天早上用便签纸写下一句话，耗时 30 秒。","plain":"光在心里想“我今晚一定要好好写作业”通常都会以躺在沙发刷手机告终。大脑喜欢明确的条件反射。写下具体指令：“如果我晚上 6:30 吃完晚饭放下筷子，那么我立刻走进书房坐下翻开数学作业本第一页”。当具体情境出现时，行为会自动被触发。","benefit":"Gollwitzer \u0026 Sheeran 2006 年对 94 项独立研究的元分析（涉及 8000 多名参与者）显示，制定执行意图（Implementation Intentions）对目标达成的平均效应量达到中到大效应（d=0.65），能使拖延行为减少一半以上（国际元分析，现行有效）。","level":"A","source":"Gollwitzer PM, Sheeran P (2006). Adv Exp Soc Psychol, 38, 69-119. https://doi.org/10.1016/S0065-2601(06)38002-1","remark":"目标指令一定要清晰到“物理动作”，不能写“那么我开始努力”，要写“翻开书本拿起黑色水笔”。","parentQuote":"","fileName":"01-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"4","tag1":"通用","tag2":"自己就能做","title":"运用费曼技巧假装向小学三年级学生讲课，精准照出知识盲区与逻辑断层","cost":"不花一分钱，对着白墙、小玩具或同桌开口讲。","plain":"检验你是不是真正搞懂一个复杂概念（比如光合作用或楞次定律）的最简单方法：试着用最通俗白话的大白话，讲给一个完全不懂专业名词的小学生听。什么时候你在讲解中卡壳了、或者不得不搬出晦涩的术语敷衍过去，那个卡壳的地方就是你根本没吃透的致命漏洞。","benefit":"学习金字塔模型及同伴教学效应研究证实，“向他人教授/即时应用”知识的记忆平均留存率高达 90%，远高于纯听讲（5%）和纯阅读（10%）（国际教育心理学研究，现行有效）。","level":"B","source":"Fiorella L, Mayer RE (2013). Contemp Educ Psychol, 38(4), 281-288. https://doi.org/10.1016/j.cedpsych.2013.06.001","remark":"结成互助学习小组，每人轮流当小老师给对方讲解经典错题，双方提分速度都极快。","parentQuote":"","fileName":"01-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"5","tag1":"通用","tag2":"自己就能做","title":"建立错题本只摘抄核心卡点与题眼本质，绝不做低水平机械抄题手工活","cost":"剪刀、胶棒或直接在原试卷上做醒目标记，严禁用漂亮笔迹机械抄题干。","plain":"很多同学花两个小时拿彩笔把错题题目一字不差抄在昂贵笔记本上，字迹工整美观，这是最具有欺骗性的“假努力”。错题本的核心不是题目，而是你当时为什么卡住的那句话——只记“题眼逻辑盲区”和“破题第一步切入点”，省下时间多做巩固。","benefit":"元认知监控研究显示，深入分析错误成因归因策略的学生，其数学与科学学业进步速率显著高于单纯记录正确解法的对照组（p\u003c0.001）（全国教育实证研究，现行有效）。","level":"B","source":"Roebers CM 等(2014). Metacognition Learn, 9(1), 31-52. https://doi.org/10.1007/s11409-013-9109-5","remark":"试卷考完直接用剪刀剪下错题贴在活页纸上，省去 80% 抄题时间。","parentQuote":"","fileName":"01-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"6","tag1":"男孩必看","tag2":"自己就能做","title":"警惕「聪明但不努力」的自我感动陷阱，建立过程导向的成长型思维","cost":"不花一分钱，停止炫耀“考前没复习也能考不错”。","plain":"很多男生特别享受被家长老师夸“这孩子聪明就是不爱使劲”，为了维持这种“虚假的聪明光环”，他们甚至故意不努力，因为一旦努力了还没考好就证明自己不聪明。到了高中深度学习阶段，知识体量极其庞大，没有刻意练习的习惯，这种虚荣心会让你摔得粉身碎骨。","benefit":"Dweck 教授近 30 年关于成长型思维（Growth Mindset）的长期追踪研究证实，将成就归因于努力和方法（而非天赋智商）的学生，在面对高难度学业挫折时韧性显著增强，高阶复杂数理成绩持续领跑（国际经典实证，现行有效）。","level":"A","source":"Yeager DS, Dweck CS 等(2019). Nature, 573(7774), 364-369. https://doi.org/10.1038/s41586-019-1466-y","remark":"不要夸自己“聪明”，为自己“今天专注搞懂了 3 道复杂压轴题的步骤”而点赞。","parentQuote":"","fileName":"01-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"7","tag1":"通用","tag2":"自己就能做","title":"巧用番茄工作法单核专注25分钟，严格拒绝多任务并行处理","cost":"不花钱，普通厨房机械计时器约 10 元。","plain":"边听流行音乐、边看微信群聊、边写数学卷子，这不叫高效多任务，这叫持续工作记忆中断。人类大脑处理深度逻辑推理只能“单核运行”。设置 25 分钟闹钟，这 25 分钟内全世界只有眼前这一张卷子；闹钟响后彻底休息 5 分钟伸懒腰，大脑效率最高。","benefit":"斯坦福大学 Ophir 等经典研究证实，频繁在多任务间切换的个体，其过滤无关干扰刺激的能力更弱，工作记忆准确率显著下降，完成任务总耗时反而增加 40% 以上（国际实证，现行有效）。","level":"A","source":"Ophir E, Nass C, Wagner AD (2009). Proc Natl Acad Sci U S A, 106(37), 15583-15587. https://doi.org/10.1073/pnas.0903620106","remark":"写作业如果需要听声音，只能听无歌词的大自然白噪音或低频纯音，严禁听有中文/英文歌词的流行歌曲。","parentQuote":"","fileName":"01-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"8","tag1":"通用","tag2":"自己就能做","title":"理科刷题采用穿插练习而非单块集中刷题，培养中高考临场识别题型能力","cost":"不花钱，把章节综合卷或不同题型打散练习。","plain":"如果一晚上集中做 20 道立体几何题，你根本不用动脑子想“这题考什么”，做起来很顺手，但一到综合大考就傻眼。把立体几何、导数、概率打散交叉着做，虽然做题时感觉更吃力，但能逼你锻炼快速看透“这道题到底要用什么公式”的真正考场能力。","benefit":"Rohrer 等 2015 年《J Educ Psychol》初中数学随机对照试验表明，穿插练习组在 30 天后的最终综合测试中得分比集中模块刷题组高出 76%（d=0.83）（国际 RCT，现行有效）。","level":"A","source":"Rohrer D 等(2015). J Educ Psychol, 107(3), 900-908. https://doi.org/10.1037/edu0000001","remark":"平时专题巩固基础后，每周至少安排 2 次打乱知识模块的综合限时自测。","parentQuote":"","fileName":"02-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"9","tag1":"通用","tag2":"自己就能做","title":"重要大考前10分钟写下心中的焦虑与担忧，彻底释放工作记忆容量","cost":"一张草稿纸，考前 10 分钟。","plain":"一进考场就手心冒汗、心跳加速、担心考砸对不起爸妈？在发卷子前 10 分钟，拿张草稿纸把脑子里所有的害怕、焦虑和最坏打算原原本本全写下来。写在纸上就把负面情绪从工作记忆里“清空”了，脑子能腾出全部算力来专心解题。","benefit":"Ramirez \u0026 Beilock 2011 年《Science》随机对照试验表明，高焦虑学生在重大考试前进行 10 分钟表达性书写（Expressive Writing），考试成绩平均提升近一个等级分（从 B- 提升至 B+），彻底抹平了焦虑带来的发挥失常差距（国际 RCT，现行有效）。","level":"A","source":"Ramirez G, Beilock SL (2011). Science, 331(6014), 211-213. https://doi.org/10.1126/science.1199427","remark":"写完之后可以揉成团扔进垃圾桶，给大脑一个明确的“焦虑已被打包清空”的心理暗示。","parentQuote":"","fileName":"02-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"10","tag1":"通用","tag2":"自己就能做","title":"理科难题卡壳超过15分钟果断换脑休息，利用发散模式后台潜意识灵感破局","cost":"不花钱，站起来散步或接杯水 5 分钟。","plain":"解数理化大题盯着草稿纸死磕 15 分钟毫无进展时，说明你的大脑正陷入死胡同的“专注模式认知隧道”。果断放下笔，站起来去洗手间洗把脸或散步 5 分钟，让大脑进入“发散模式”。后台潜意识神经元会在全脑范围重新建立突触连接，往往在不经意间灵光一闪找出解题突破口。","benefit":"认知神经科学与顿悟（Insight）问题解决研究证实，设置孵化期（Incubation Period）暂时脱离固着任务，能显著打破定势思维，顿悟解题成功率提高 30% 以上（国际认知神经研究，现行有效）。","level":"B","source":"Sio UN, Ormerod TC (2009). Psychol Bull, 135(1), 94-120. https://doi.org/10.1037/a0014272","remark":"发散模式休息绝不是掏出手机刷短视频打游戏，短视频高频刺激会直接污染工作记忆。","parentQuote":"","fileName":"02-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"11","tag1":"女孩必看","tag2":"自己就能做","title":"坚决破除「女生学不好高中理科数理化」的伪科学性别刻板印象","cost":"不花一分钱，彻底重塑自我认知效能感。","plain":"从小听到“女孩到了初二高一就后劲不足学不好数理化”完全是社会刻板印象强加给你的心理枷锁！大脑的逻辑思维神经元结构在男女之间没有任何本质智力优劣差异。那些所谓的“后劲不足”，大多是被这种负面心理暗示摧毁了自信心、不敢提问不敢死磕导致的。","benefit":"Spencer 等 1999 年经典实验及后续荟萃证实，“刻板印象威胁”（Stereotype Threat）会人为剥夺女性在数理测试中的认知资源；当明确告知“本测试没有任何性别差异”时，女生在高等数学测试中的成绩与男生完全一致持平（国际经典 RCT，现行有效）。","level":"A","source":"Spencer SJ 等(1999). J Exp Soc Psychol, 35(1), 4-28. https://doi.org/10.1006/jesp.1998.1373 ；Hyde JS (2005). Am Psychol, 60(6), 581-592. https://doi.org/10.1037/0003-066X.60.6.581","remark":"高中选科根据自己真正的兴趣特长和未来专业规划决定，绝不受任何“文科适合女孩”传统偏见绑架。","parentQuote":"","fileName":"02-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"12","tag1":"通用","tag2":"自己就能做","title":"考试答题坚持「先易后难、遇卡果断跳过」，守住全卷基础分护城河","cost":"不花一分钱，养成答题节奏纪律。","plain":"任何中高考标准化试卷，基础题和中档题分值占比都在 70% 到 80% 以上！考场上最蠢的策略就是在一道 12 分的压轴难题上死磕 25 分钟，最后不仅压轴题没做出来，后面原本稳拿分的送分大题还没时间写。遇到卡壳 3 分钟没思路的题目，立刻打问号跳过，把全卷所有能拿的分全部入袋为安后再回来死磕。","benefit":"标准化考试测量与时间分配策略研究表明，严格遵循先易后难跳过策略的考生，卷面非智力失分率降低 65%，中高档卷面总分平均高出 12 至 18 分（全国教育考试实证，现行有效）。","level":"B","source":"教育部教育考试院(2022). 国家教育考试考务管理规范与命题评价报告.","remark":"跳题时务必在答题卡对应题号处做好醒目标记，严防答题卡涂错行倒位。","parentQuote":"","fileName":"02-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"13","tag1":"通用","tag2":"自己就能做","title":"学习时把智能手机关机并放在另一个房间，彻底消除「脑力资源损耗」","cost":"不花一分钱，走出房门把手机放在客厅柜子里。","plain":"即使你把手机静音、屏幕朝下扣在桌上，你的大脑也在潜意识里分出相当一部分精力去“忍住不去摸手机”。这种注意力分散会导致你做复杂数理化大题时经常断片、卡壳。想高效学习 1 小时，最绝的办法就是把手机关机扔到客厅另一个房间。","benefit":"Ward 等 2017 年发表于《J Assoc Consum Res》的“脑力流失”（Brain Drain）随机试验证实，只要智能手机在视线或随手可及范围内（即便静音朝下），个体的可用工作记忆容量与流体智力测试得分就会显著下降（p\u003c0.01）；手机在另一房间组测试表现最好（国际 RCT，现行有效）。","level":"A","source":"Ward AF 等(2017). J Assoc Consum Res, 2(2), 140-154. https://doi.org/10.1086/691462","remark":"写作业查字典、查公式尽量用实体工具书；如果必须上网看网课，在电脑全屏并退出所有社交聊天软件。","parentQuote":"","fileName":"03-把手机从孩子手里夺回来：物理隔离与多巴胺脱敏.md"},{"num":"14","tag1":"通用","tag2":"自己就能做","title":"主动关闭短视频平台的「个性化个性推荐」算法，打破信息茧房与多巴胺劫持","cost":"不花一分钱，在短视频 App 设置隐私里关闭开关，耗时 10 秒。","plain":"短视频算法比你自己更懂你的弱点，你多停留 2 秒它就疯狂给你推同类刺激内容，让你像小白鼠一样被困在多巴胺陷阱里一刷就是 3 个小时。关掉“个性化推荐”后，算法不会再根据你的喜好精准投喂，推荐的内容会变得很杂很无聊，你的大脑会自然而然想放下手机。","benefit":"《互联网信息服务算法推荐管理规定》明确赋予用户随时关闭算法推荐的法定权利。关闭个性化推荐后，用户单次使用时长平均下降 35% 以上，显著降低短视频成瘾与注意力碎片化（全国法规与行为实证，现行有效）。","level":"A","source":"国家互联网信息办公室等四部门(2021). 互联网信息服务算法推荐管理规定（第十七条）. http://www.cac.gov.cn","remark":"抖音/快手操作路径：我 -\u003e 设置 -\u003e 隐私设置 -\u003e 个性化推荐 -\u003e 关闭“个性化内容推荐”。","parentQuote":"","fileName":"03-把手机从孩子手里夺回来：物理隔离与多巴胺脱敏.md"},{"num":"15","tag1":"通用","tag2":"自己就能做","title":"极度抑郁绝望或有自残自杀念头时，第一时间拨打「12356」全国统一心理援助热线","cost":"国家完全免费，免电话费，每天开通至少 18 小时至 24 小时。","plain":"当你觉得痛苦得喘不过气、身边没有人能理解你、甚至脑子里全是想死的念头时，别一个人在被窝里死撑，拿起手机拨打 12356。电话那头是经过国家严格培训的专业公立医院心理医生和危机干预咨询师，他们不会批评指责你，会全程耐心地陪你度过最危险的崩溃时刻。","benefit":"系统评价证实危机干预热线能有效阻断 70% 以上的即时自杀冲动，为脱离危险争取关键窗口期。国家卫生健康委印发通知，全国自 2025 年 5 月 1 日起统一应用“12356”作为国家心理援助热线电话，实行标准化规范接听与危机联动（全国官方政策，现行有效）。","level":"A","source":"国家卫生健康委(2024). 关于应用“12356”全国统一心理援助热线电话号码的通知. 国卫医政函〔2024〕259号. https://www.gov.cn ；Zalsman G 等(2016). Lancet Psychiatry, 3(7), 646-659.","remark":"除 12356 外，共青团全国青少年权益热线「12355」也是专门为未成年人提供免费法律与心理咨询的权威官方热线。","parentQuote":"","fileName":"04-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"16","tag1":"通用","tag2":"找爸妈一起办","title":"严重抑郁或躯体化反应无法坚持上学时，依法前往三甲公立医院开具诊断并申请休学保留学籍","cost":"三甲精神专科医院专家门诊挂号及测评约 200 至 500 元。","plain":"每天一到校门口就剧烈头痛、胃痛呕吐、整夜整夜失眠，这不是“装病”或“矫情”，这是身体在大声呼救的“躯体化障碍”。如果实在扛不住，跟爸妈去正规精神专科医院确诊。教育部明确规定因病休学一次期限为一年，保留学籍，等身心彻底养好了再回来读书，人生长得很，不差这一年。","benefit":"教育部《中小学生学籍管理办法》明确规定，学生因病确需停课治疗休养占一学期总学时三分之一以上者，凭县级以上医疗机构证明，学校必须依法为其办理休学手续并保留学籍，休学期满准予复学（全国法规，现行有效）。","level":"A","source":"教育部(2013). 中小学生学籍管理办法（第十九条、第二十条）. https://www.moe.gov.cn ；中华医学会精神医学分会(2020). 中国抑郁障碍防治指南.","remark":"【直接转给爸妈看】：爸妈，我每天恶心呕吐是真的身体生病了，教育部规定可以依法休学保留学籍 1 年，先带我把病治好，留得青山在不怕没柴烧。","parentQuote":"爸妈，我每天恶心呕吐是真的身体生病了，教育部规定可以依法休学保留学籍 1 年，先带我把病治好，留得青山在不怕没柴烧。","fileName":"04-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"17","tag1":"通用","tag2":"自己就能做","title":"坚决拒绝任何非法所谓的「全封闭戒网瘾特训学校」与夏令营","cost":"黑特训营收费每月数千至上万元，带来的是非法拘禁、体罚甚至致残致死。","plain":"社会上很多打着“国学感恩”“军事化戒网瘾”“改变逆反少年”招牌的民办特训营，全是非法办学的黑窝点。他们靠没收手机、断绝与外界联系、电击关禁闭、暴力毒打来逼孩子“认错顺从”，多名青少年在里面被活活打死或逼上绝路。谁敢诱骗你上车，立刻跳车呼救或报警。","benefit":"《未成年人网络保护条例》第二十条明令规定：任何组织和个人不得通过虐待、胁迫等侵害未成年人身心健康的方式干预未成年人沉迷网络、严禁非法拘禁等违法犯罪行为（全国行政法规，现行有效）。","level":"A","source":"国务院(2024施行). 未成年人网络保护条例（第二十条）. 国令第766号. https://www.gov.cn ；最高人民检察院关于防范严惩涉非法矫正机构侵害未成年人权益典型案例.","remark":"如果发现爸妈被黑机构洗脑企图送走你，立刻向信任的公立学校班主任、亲戚甚至直接拨打 110 举报非法拘禁。","parentQuote":"","fileName":"04-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"18","tag1":"通用","tag2":"自己就能做","title":"出现严重自伤、幻听或两个月以上持续失眠，必须去精神专科医院系统评估","cost":"公立三甲精神专科医院（如安定医院、精神卫生中心）挂号及检查约 300 至 600 元，医保可报销。","plain":"如果手臂上用圆规小刀划得全是伤口、脑子里能听见有人在耳边说话骂你、或者连续两个月整夜睡不着觉，这绝不是单纯的“情绪低落”，是大脑神经递质出了严重器质性失衡。这不是心理软弱，就像感冒肺炎一样需要医学介入。及早去正规医院吃药调理，能把大脑彻底救回来。","benefit":"青少年首发精神障碍早期干预临床研究证实，未治疗期（DUP）缩短至 3 个月以内，临床完全缓解率提升 60% 以上，远期功能恢复良好率达 75%（全国精神医学临床实证，现行有效）。","level":"B","source":"国家卫生健康委(2020). 探索抑郁症防治特色服务工作方案. 国卫办疾控函〔2020〕777号. https://www.nhc.gov.cn","remark":"【直接转给爸妈看】：爸妈，我已经持续失眠自伤两个月了，脑神经生病了不是我思想问题，带我去三甲精神科看医生开药，才能彻底好起来。","parentQuote":"爸妈，我已经持续失眠自伤两个月了，脑神经生病了不是我思想问题，带我去三甲精神科看医生开药，才能彻底好起来。","fileName":"04-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"19","tag1":"通用","tag2":"自己就能做","title":"运用「4-7-8」腹式呼吸法，3分钟平息惊恐发作与剧烈心慌躯体焦虑","cost":"不花一分钱，随时随地就地进行。","plain":"当你突然感到手脚冰凉、呼吸急促、胸口发闷像喘不上气、甚至觉得自己快要窒息死掉时（典型的急性惊恐发作），闭上嘴巴用鼻子吸气数 4 秒，憋住呼吸屏息数 7 秒，再微微张开嘴缓缓呼气数 8 秒。重复循环 4 次，能强制激活副交感神经，把狂跳的心率直接拉下来。","benefit":"慢节奏呼吸训练生理学机制证实，延长呼气时间（呼气为吸气的两倍）能强效刺激迷走神经释放乙酰胆碱，显著降低心率变异性应激指数与唾液皮质醇水平，平复过度通气综合征（国际实证，现行有效）。","level":"B","source":"Zaccaro A 等(2018). Front Hum Neurosci, 12, 353. https://doi.org/10.3389/fnhum.2018.00353","remark":"如果手脚发麻抽搐，说明大口喘气把二氧化碳全吹出去了，拿个纸袋或用双手扣在口鼻处回吸自己呼出的气体。","parentQuote":"","fileName":"04-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"20","tag1":"通用","tag2":"自己就能做","title":"遇到同伴或网友情绪崩溃扬言轻生，立刻报告校方与家长，绝不私自保守秘密","cost":"不花一分钱，微信发消息给班主任或拨打 110。","plain":"如果你的好朋友或网上网友在聊天里留遗言、发割腕照片或扬言不想活了，并求你“千万别告诉别人，这是我们的秘密”。千万别讲盲目的义气！未成年人的肩膀根本扛不住一条人命的重量。打破秘密告诉老师、家长或报警，是把他从死亡悬崖边拉回来的唯一正确做法。","benefit":"心理危机干预指南证实，绝大多数轻生者在实施前都会发出言语或行为呼救信号。同伴及时通报可使校园危机干预响应时间缩短 80%，挽救成功率极大提升（国际临床共识，现行有效）。","level":"B","source":"American Association of Suicidology (AAS)(2020). School-Based Suicide Prevention Guidelines.","remark":"真正的友谊是在他坠崖时拉他一把，而不是陪着他保守跳崖的秘密。","parentQuote":"","fileName":"04-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"21","tag1":"通用","tag2":"自己就能做","title":"遭遇校园言语侮辱、肢体暴力或排挤时，立刻固定证据并保留第一现场","cost":"不花一分钱，手机录音、微信截图、拍照留存伤痕。","plain":"欺凌者最怕的就是把事情闹大和留下铁证。被骂、被威胁或被打时，不要洗掉被撕破弄脏的衣服，身上有任何淤青红肿立刻让爸妈拍照，把微信群里的辱骂记录、侮辱性小作文全部长截图并录屏备份。有了铁证，学校和公安机关才能依法严肃处理。","benefit":"最高人民法院、最高人民检察院、公安部、司法部关于依法惩治校园暴力指导意见明确指出，清晰连贯的音视频、病历、物证是界定校园欺凌和追究侵权人及监护人赔偿与行政责任的核心要件（全国司法规范，现行有效）。","level":"A","source":"最高人民法院等(2020). 关于依法惩治涉未成年人违法犯罪活动的指导意见. ；教育部等十一部门(2017). 加强中小学生欺凌综合治理方案.","remark":"如果被堵在厕所等监控盲区，尽量大声喊叫吸引走廊其他老师注意，事后第一时间找校医室或医院开具诊断证明。","parentQuote":"","fileName":"05-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"22","tag1":"通用","tag2":"找爸妈一起办","title":"对照2026年最新《治安管理处罚法》，以“学生欺凌”直接报警依法追究治安责任","cost":"不花一分钱，直接拨打 110 报警并要求出具《接报案回执》。","plain":"新修订并于 2026 年正式施行的《治安管理处罚法》有了重磅武器：专门增加了关于“学生欺凌”的处罚条款！而且满 14 周岁不满 16 周岁的未成年人只要一年内二次违反治安管理或者性质恶劣，依法可以执行行政拘留！别让欺凌者以为“未成年犯法没人管”。","benefit":"新修订《中华人民共和国治安管理处罚法》（自 2026 年 1 月 1 日起施行）明确强化了对学生欺凌等行为的法律责任追究，严格限制了对满 14 周岁未成年人违法不执行行政拘留的免责例外情形（全国法律，现行有效）。","level":"A","source":"全国人民代表大会常务委员会(2025通过, 2026施行). 中华人民共和国治安管理处罚法. https://flk.npc.gov.cn","remark":"【直接转给爸妈看】：爸妈，2026 新《治安管理处罚法》明确严惩学生欺凌，满 14 周岁性质恶劣照样拘留，我们必须立刻报警做笔录，不能由学校私下和稀泥。","parentQuote":"爸妈，2026 新《治安管理处罚法》明确严惩学生欺凌，满 14 周岁性质恶劣照样拘留，我们必须立刻报警做笔录，不能由学校私下和稀泥。","fileName":"05-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"23","tag1":"通用","tag2":"自己就能做","title":"遭遇亲友、老师或熟人性侵害或猥亵时，牢记身体自主权并保留DNA第一铁证","cost":"不花一分钱，忍住不要洗澡洗衣服。","plain":"任何触摸你隐私部位（内衣裤遮盖的地方）、或者逼你脱衣服、拍照看私处的行为，不管对方是亲戚、邻居还是德高望重的老师，全都是违法犯罪！这不是你的错，你没有做错任何事。遭遇侵害后，千万不要洗澡、不要刷牙洗脸、不要换洗衣服，把贴身衣物装进纸袋里作为证据，立刻报警求助。","benefit":"《刑法》第二百三十六条、第二百三十七条明确对负有监护、教育、救助等特殊职责的人员实施性侵猥亵从重处罚。受害人体表拭子提取的加害人 DNA、精斑是直接定罪量刑不可推翻的黄金物证（全国法律与法医规范，现行有效）。","level":"A","source":"最高人民法院、最高人民检察院、公安部、司法部(2023). 关于依法惩治性侵害未成年人犯罪的意见. https://www.court.gov.cn ；中华人民共和国刑法修正案（十一）.","remark":"全国公立医院接诊涉嫌性侵未成年人时，依法必须在第一时间启动“强制报告”制度向公安机关报案。","parentQuote":"","fileName":"05-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"24","tag1":"女孩必看","tag2":"自己就能做","title":"警惕以「恋爱、签约模特」为名的隔空网络猥亵与私密照勒索","cost":"不花一分钱，坚决不发任何隐私身体照片。","plain":"网上认识的所谓“帅气男友”或“童模星探”，在嘘寒问暖骗取信任后，哄骗你拍私密部位照片、或者视频裸聊。只要你发了一张，对方会立刻撕下伪装，威胁“如果不继续脱或者不给钱，就把裸照发给你班主任和父母”。记住：坚决不拍！如果不慎被拍，哪怕被骂也立刻告诉父母报警，对方见光就死。","benefit":"最高人民法院明确指导意见：利用网络诱骗未成年人发送裸照、视频等隔空猥亵行为，依法以猥亵儿童罪或强制猥亵罪从严追究刑事责任（入刑标准明确，现行有效）。","level":"A","source":"最高人民法院、最高人民检察院(2023). 关于办理强奸、猥亵未成年人刑事案件适用法律若干问题的解释. 法释〔2023〕4号. https://www.court.gov.cn","remark":"遇到此类勒索切忌私下转账，转账只会让敲诈者变本加厉；第一时间对聊天记录截屏留存后报案。","parentQuote":"","fileName":"05-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"25","tag1":"通用","tag2":"在校必做","title":"在校园内建立3人以上的安全同行互助圈，彻底打破欺凌者的独处落单锁定","cost":"不花一分钱，下课结伴去洗手间、食堂或放学回家。","plain":"校园欺凌者在挑选欺凌目标时，专门挑那些独来独往、性格内向、没有同伴掩护的落单学生。只要你课间去小卖部、上厕所或者放学时，始终和班上两三个靠谱的同学结伴同行，你在欺凌者眼里就会变成一块“硬骨头”，能直接避开 80% 的找茬和勒索。","benefit":"Olweus 校园欺凌防御系统追踪研究表明，拥有稳定同伴支持网络的学生遭受校园欺凌的风险降低 67%（OR 0.33, 95% CI 0.21–0.52），是学校情境中最有效的低成本微生态防护策略（国际经典研究，现行有效）。","level":"A","source":"Olweus D (2013). School-based interventions on bullying and youth violence. Annu Rev Clin Psychol, 9, 395-425. https://doi.org/10.1146/annurev-clinpsy-050212-185527","remark":"如果觉得在班里交朋友困难，加入一个自己喜欢的社团（书法、合唱、跑步），在共同兴趣圈子里结交同盟。","parentQuote":"","fileName":"05-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"26","tag1":"通用","tag2":"自己就能做","title":"遭遇老师无端当众羞辱或体罚时，理智低头不硬碰硬、事后固定录音病历追究师德","cost":"不花一分钱，保护自身安全第一。","plain":"如果遇到极个别情绪失控的老师在课堂上辱骂羞辱你、甚至动手扇巴掌体罚，在实力悬殊的现场千万不要冲动对打，避免升级为恶性伤害。保护好头脸，忍住屈辱离开教室或到办公室大声呼救。事后第一时间去医院验伤、让家长去教育局纪检组举报其违反师德红线，依法处分他。","benefit":"《中华人民共和国未成年人保护法》第二十七条明确规定：学校教职员工不得对未成年人实施体罚、变相体罚或者其他侮辱人格尊严的行为。《中小学教师违反职业道德行为处理办法》规定情节严重者直接撤销教师资格并调离教师岗位（全国法律法规，现行有效）。","level":"A","source":"全国人民代表大会常务委员会(2020修订). 中华人民共和国未成年人保护法（第二十七条）. https://flk.npc.gov.cn ；教育部(2018). 新时代中小学教师职业行为十项准则.","remark":"【直接转给爸妈看】：爸妈，今天老师在班上当众打我/严重辱骂我，法律严禁体罚学生，带我去医院开伤痕诊断，我们要向教育局纪检组举报维权。","parentQuote":"爸妈，今天老师在班上当众打我/严重辱骂我，法律严禁体罚学生，带我去医院开伤痕诊断，我们要向教育局纪检组举报维权。","fileName":"05-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"27","tag1":"通用","tag2":"找爸妈一起办","title":"算清三道刑事责任年龄红线（12-14-16岁）","cost":"0元，全家共同阅读讨论15分钟。","plain":"我国刑法年龄门槛是三道坎：**12周岁**犯故意杀人、故意伤害致人死亡或特别残忍致重残，最高检核准即可追究刑责；**14周岁**对八类重罪（杀人、重伤、强奸、抢劫、贩毒、放火、爆炸、投放危险物质）负全责；**16周岁**对所有犯罪负刑事责任。初中生不再享有“绝对豁免”，触犯严重暴力罪行一样会坐牢。","benefit":"彻底打消部分孩子“未成年犯法警察管不着”的危险侥幸心理，将恶性暴力与严重伤害防患于未然。","level":"A（全国人大常委会《中华人民共和国刑法》第十七条，2021年3月《刑法修正案（十一）》实施）。","source":"全国人大常委会公报，http://www.npc.gov.cn/","remark":"【直接转给爸妈看】：千万不要顺着孩子说“你还小警察不管”。12-14周岁犯恶性暴力案件经最高人民检察院核准直接追究刑事责任；即便不追究刑责，公安机关也可依据《预防未成年人犯罪法》送入专门学校进行专门矫治教育，人生轨迹彻底改变。\n\n---","parentQuote":"千万不要顺着孩子说“你还小警察不管”。12-14周岁犯恶性暴力案件经最高人民检察院核准直接追究刑事责任；即便不追究刑责，公安机关也可依据《预防未成年人犯罪法》送入专门学校进行专门矫治教育，人生轨迹彻底改变。\n\n---","fileName":"06-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"28","tag1":"通用","tag2":"自己就能做","title":"严禁出借出租微信、支付宝与银行卡（防帮信罪）","cost":"0元，抵制百元兼职诱惑。","plain":"任何同学或网友说“借你微信号、银行卡转一笔账，给你200块钱佣金/买皮肤”，**100%是电诈洗钱跑分**！我国刑法严厉打击“帮助信息网络犯罪活动罪（帮信罪）”。一旦把微信、支付宝、电话卡或银行卡出借给洗钱团伙，涉案金额达到标准直接构成犯罪；即使免于起诉，也会被央行纳入惩戒黑名单：5年内暂停非柜面业务、不得开新卡，微信支付宝全封禁，高考报军校、考公政审全泡汤。","benefit":"避免成为电信网络诈骗的“替罪羊”，阻断当前未成年人涉案率最高（超40%）的犯罪类型。","level":"A（最高人民法院、最高人民检察院《关于办理非法利用信息网络、帮助信息网络犯罪活动等刑事案件适用法律若干问题的解释》法释〔2019〕15号）。","source":"最高人民法院公报，https://www.court.gov.cn/","remark":"【直接转给爸妈看】：帮信罪是目前中学生、职业技术学校学生最容易糊里糊涂染上的犯罪！很多孩子觉得“我就是借卡转个账赚50块零花钱，又没偷没抢”。只要卡里进的是诈骗赃款，孩子就成了洗钱链条一环。请提醒孩子：凡是要求借卡借号转账的，哪怕是同班铁哥们，也必须一口回绝。\n\n---","parentQuote":"帮信罪是目前中学生、职业技术学校学生最容易糊里糊涂染上的犯罪！很多孩子觉得“我就是借卡转个账赚50块零花钱，又没偷没抢”。只要卡里进的是诈骗赃款，孩子就成了洗钱链条一环。请提醒孩子：凡是要求借卡借号转账的，哪怕是同班铁哥们，也必须一口回绝。\n\n---","fileName":"06-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"29","tag1":"通用","tag2":"自己就能做","title":"警惕“上头电子烟”与依托咪酯（新型毒品识别）","cost":"0元，全家学习毒品知识10分钟。","plain":"凡是宣称“合法上头”、“抽了飘飘欲仙”的电子烟，或者粉末、液体添加物，99%添加了**依托咪酯**或合成大麻素！国家已将依托咪酯列入第二类精神药品目录，**吸食依托咪酯就是吸毒，贩卖、运输依托咪酯就是贩毒**！贩毒在我国没有克数起刑点，无论数量多少一律追究刑事责任。一旦吸食，会导致癫痫抽搐、呼吸暂停，极快形成生理依赖。","benefit":"避免被所谓“潮流玩咖”圈套拉下水，从源头杜绝未成年人新型涉毒案件。","level":"A（国家药监局、公安部、国家卫健委《关于调整麻醉药品和精神药品目录的公告》2023年第120号）。","source":"中国禁毒网，http://www.nncc626.com/","remark":"【直接转给爸妈看】：依托咪酯是近年渗透未成年群体最猖獗的毒品伪装形式！常以炫彩电子烟烟弹、茶树油精油形式出现。发现孩子身上有不明怪味烟杆、突发手抖、嗜睡发呆、眼神发直，必须立即查验并寻求专业戒瘾与心理介入。\n\n---","parentQuote":"依托咪酯是近年渗透未成年群体最猖獗的毒品伪装形式！常以炫彩电子烟烟弹、茶树油精油形式出现。发现孩子身上有不明怪味烟杆、突发手抖、嗜睡发呆、眼神发直，必须立即查验并寻求专业戒瘾与心理介入。\n\n---","fileName":"06-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"30","tag1":"通用","tag2":"自己就能做","title":"坚决拒绝帮同学“约架站场子”（共同犯罪定罪）","cost":"0元，顶住人情面子。","plain":"朋友找你“去校门口站个场子，不用你动手，撑撑场面”，**绝对不能去，拔腿就跑**！在法律上，聚众斗殴、寻衅滋事属于共同犯罪。站在现场摇旗呐喊、充当声势，在司法认定中属于“积极参加者”或“同案犯”。一旦对方发生重伤、死亡，现场站场的所有人都要承担刑事连带责任并计入档案，绝不会因为“我没动手”就免责。","benefit":"避免因盲目哥们义气从围观群众沦为刑事同案犯。","level":"A（最高人民法院、最高人民检察院《关于办理寻衅滋事刑事案件适用法律若干问题的解释》法释〔2013〕18号）。","source":"最高人民检察院指导性案例，https://www.spp.gov.cn/","remark":"【直接转给爸妈看】：很多老实本分的孩子就是因为“不好意思拒绝好朋友”去站场，结果对方打红眼掏出折叠刀扎出人命，全场在场学生全被警车带走羁押。教育孩子：真正的朋友绝不会拉你去违法现场；遇到有人约架，第一时间向老师和家长汇报。\n\n---","parentQuote":"很多老实本分的孩子就是因为“不好意思拒绝好朋友”去站场，结果对方打红眼掏出折叠刀扎出人命，全场在场学生全被警车带走羁押。教育孩子：真正的朋友绝不会拉你去违法现场；遇到有人约架，第一时间向老师和家长汇报。\n\n---","fileName":"06-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"31","tag1":"通用","tag2":"自己就能做","title":"网上严禁参与“开盒挂人”与网络暴力（侵犯公民信息）","cost":"0元，克制网上宣泄与跟风冲动。","plain":"在QQ群、贴吧、微博等平台，因为网络争吵、追星饭圈矛盾，去搜集、曝光对方的真实姓名、身份证号、家庭住址、学校班级、照片并组织人身攻击，俗称“开盒挂人”。这是违法犯罪行为！情节严重的直接触犯《刑法》“侵犯公民个人信息罪”或“侮辱罪/诽谤罪”；一般情节也会依据《治安管理处罚法》处以拘留和罚款，并承担高额民事侵权赔偿责任。","benefit":"遏制网络暴民心态，保护个人网络足迹，避免留下治安处罚记录。","level":"A（最高人民法院、最高人民检察院、公安部《关于依法惩治网络暴力违法犯罪的指导意见》2023年9月）。","source":"中国政府网，http://www.gov.cn/","remark":"【直接转给爸妈看】：现在饭圈和游戏圈“开盒”门槛极低，花几块钱社工库就能查到信息。很多初中生误以为网上说话查不到IP和真人。网警调取后台数据只要几分钟。一旦立案，孩子的数字设备被扣押，还将面临名誉权官司。\n\n---","parentQuote":"现在饭圈和游戏圈“开盒”门槛极低，花几块钱社工库就能查到信息。很多初中生误以为网上说话查不到IP和真人。网警调取后台数据只要几分钟。一旦立案，孩子的数字设备被扣押，还将面临名誉权官司。\n\n---","fileName":"06-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"32","tag1":"通用","tag2":"找爸妈一起办","title":"严禁非法改装电动自行车与未成年骑行（道路交通安全红线）","cost":"0元，拒绝解限速改装。","plain":"我国法规严令：**未满16周岁不得骑电动自行车上路**！同时，将电动自行车解除限速（超过25km/h）、改装大容量锂电池（如72V/96V）、加装大电机，在法律上会被直接鉴定为**轻便摩托车或普通摩托车（机动车）**！未成年人无证驾驶改装机动车一旦发生撞人事故，保险公司一分不赔，父母承担无限连带赔偿责任；若致人死伤更直接触犯交通肇事罪。改装电池在室内充电起火致人伤亡，父母及车主承担失火罪刑事责任。","benefit":"消除青少年交通事故与火灾致残致死首要风险，避免家庭瞬间背负数百万债务。","level":"A（全国人大常委会《中华人民共和国道路交通安全法》实施条例第七十二条；公安部交管局专项整治公告）。","source":"公安部交通管理局，https://www.mps.gov.cn/","remark":"【直接转给爸妈看】：许多男孩喜欢虚荣“改车提速”。一旦改装超速超标，在法律责任上就是无牌无证驾驶机动车上路！撞伤路人赔偿往往四五十万起步，医保和第三者商业险全部拒赔，掏空一个家庭的全部积蓄。坚决杜绝买改装车和解限速。\n\n---","parentQuote":"许多男孩喜欢虚荣“改车提速”。一旦改装超速超标，在法律责任上就是无牌无证驾驶机动车上路！撞伤路人赔偿往往四五十万起步，医保和第三者商业险全部拒赔，掏空一个家庭的全部积蓄。坚决杜绝买改装车和解限速。\n\n---","fileName":"06-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"33","tag1":"通用","tag2":"找爸妈一起办","title":"了解未成年人犯罪记录封存制度（给出错孩子重生的机会）","cost":"0元，咨询法律援助或办案机关。","plain":"如果孩子在未成年时期（犯罪时不满18周岁）因一时糊涂犯错被判处**五年有期徒刑以下刑罚**，我国法律规定对相关犯罪记录实行**严格封存**！封存后，除司法机关办案或者有关单位按国家规定查询外，任何单位和个人不得查询，向有关单位求职或考学时**免除前科报告义务**。公安机关开具的“无违法犯罪记录证明”不得载明被封存记录。","benefit":"避免“一朝失足终身留污点”导致青年自暴自弃，保护孩子正常高考、上大学和就业的合法权利。","level":"A（最高人民法院、最高人民检察院、公安部、司法部《关于关于贯彻落实未成年人刑事案件犯罪记录封存制度的实施办法》2022年5月）。","source":"最高人民检察院官网，https://www.spp.gov.cn/","remark":"【直接转给爸妈看】：这项法律制度是国家给迷途青少年的“保护伞”。如果孩子曾经误入歧途受到较轻刑事处罚，家长应当知悉合法权利，在升学、入职遭遇非法歧视或单位违规索要未成年案底时，可申请检察机关依法监督，为孩子洗去社会污名。","parentQuote":"这项法律制度是国家给迷途青少年的“保护伞”。如果孩子曾经误入歧途受到较轻刑事处罚，家长应当知悉合法权利，在升学、入职遭遇非法歧视或单位违规索要未成年案底时，可申请检察机关依法监督，为孩子洗去社会污名。","fileName":"06-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"34","tag1":"通用","tag2":"找爸妈一起办","title":"拒买任何“治愈/逆转近视”仪器与针灸贴片","cost":"0元，全家统一科学认知。","plain":"任何宣称能“摘掉眼镜”、“降低近视度数”、“治愈真性近视”的眼部按摩仪、远红外眼罩、耳穴贴、训练仪、拉筋增高视力仪，**100%是虚假宣传骗局**！国家卫健委、市场监管总局等六部门早在2019年就联合发文严厉明令禁止使用“康复”、“恢复”、“近视治愈”等误导词汇。真性近视是**眼轴变长（眼球结构拉长）**，就像人长高了一样，物理结构不可逆缩短！乱用仪器不仅浪费钱，还会延误正规角膜塑形或离焦镜干预，甚至损伤角膜与眼底。","benefit":"避免单个家庭被收割3000~30000元智商税，确保孩子在正规医院视光门诊接受科学防控。","level":"A（国家卫健委、教育部、市场监管总局等六部门《关于进一步规范儿童青少年近视矫正工作切实加强监管的通知》国卫办监督发〔2019〕12号）。","source":"国家卫生健康委员会官网，http://www.nhc.gov.cn/","remark":"【直接转给爸妈看】：凡是声称“一个月降低200度”的，他们只是利用了孩子眼部睫状肌短时间放松测出来的假性近视波动，或者在视力表测试时光线、眯眼作弊！真去医院测眼轴长度（IOL-Master），眼轴根本没缩短。请把钱留着配一副正规离焦镜，或者让孩子去户外多晒太阳。\n\n---","parentQuote":"凡是声称“一个月降低200度”的，他们只是利用了孩子眼部睫状肌短时 10000）办理**紧急挂失停机**，并冻结微信、支付宝。\n\n---","fileName":"09-账号、隐私与数字防身：SIM卡PIN码与防开盒挂人.md"},{"num":"43","tag1":"通用","tag2":"自己就能做","title":"社交平台发图打码关键信息（防开源情报OSINT追踪）","cost":"0元，发朋友圈/小红书前检查1分钟。","plain":"中学生发自拍、日常动态时，**绝对不要泄露以下细节**：\n  1. **校服校徽、校门口建筑物、宿舍窗外固定地标**（很容易锁定就读学校甚至班级）；\n  2. **火车票、飞机登机牌、快递单、电影票**（二维码/条形码里包含姓名、身份证号与航班号，直接扫码就能破解隐私）；\n  3. **家门钥匙形状、家门牌号、自家阳台窗外视野**（通过楼层角度与建筑物阴影几分钟就能推算出具体小区和门牌栋数）；\n  4. 发原图前**关闭相机的地理位置标签（Exif GPS信息）**，或发送时不要勾选“发送原图”。","benefit":"避免被心怀不轨的网友、潜伏黑产人员顺藤摸瓜找到现实住址和学校实施骚扰跟踪。","level":"A（全国信息安全标准化技术委员会《信息安全技术 个人信息安全规范》GB/T 35273-2020）。","source":"国家标准化管理委员会，http://openstd.samr.gov.cn/","remark":"【直接转给爸妈看】：很多家长喜欢在朋友圈晒娃“晒录取通知书”、“晒奖状”、“晒生日聚会”，通知书上的考生号、身份证号、条形码全无遮挡！这直接给不法分子提供了完整真实的个人信息。发圈晒娃务必遮盖所有证件号、条形码和真实学校名称。\n\n---","parentQuote":"很多家长喜欢在朋友圈晒娃“晒录取通知书”、“晒奖状”、“晒生日聚会”，通知书上的考生号、身份证号、条形码全无遮挡！这直接给不法分子提供了完整真实的个人信息。发圈晒娃务必遮盖所有证件号、条形码和真实学校名称。\n\n---","fileName":"09-账号、隐私与数字防身：SIM卡PIN码与防开盒挂人.md"},{"num":"44","tag1":"通用","tag2":"找爸妈一起办","title":"遭遇网络“开盒”与网暴的处理流程（一键存证与法律反击）","cost":"0元，依法取证维权。","plain":"如果孩子在网络上遭遇他人泄露姓名、身份证、电话、照片并被骚扰（俗称被“开盒”）：\n  1. **切忌愤怒对骂或立刻注销账号**：注销会导致聊天记录和侵权网址灭失，丧失证据；\n  2. **全程录屏存证**：使用另一部手机录制屏幕，从系统时间、打开该社交平台、点开对方主页、个人UID、发表的侵权贴文、评论区恶评、私信骚扰，全流程一气呵成录下来；\n  3. **向平台投诉并要求下架**：依据《民法典》第一千一百九十五条，向平台发出“侵权通知”，平台接到有效通知未及时删除的，对扩大部分承担连带赔偿责任；\n  4. **报警受案**：带上录屏材料直接到辖区派出所报案，要求按违反《治安管理处罚法》第四十二条（公然侮辱或散布他人隐私）立案行政拘留，并可向法院提起名誉权、隐私权民事诉讼索赔精神损失费。","benefit":"以法律铁拳震慑网络恶霸，迫使侵权内容迅速删除，保护未成年人心理防线。","level":"A（最高人民法院、最高人民检察院、公安部《关于依法惩治网络暴力违法犯罪的指导意见》；《中华人民共和国民法典》第一千一百九十五条）。","source":"中国政府网，http://www.gov.cn/","remark":"【直接转给爸妈看】：被开盒的孩子通常极其恐慌、自责甚至产生轻生念头。家长此时千万不能责怪孩子“你天天上网惹是生非干什么”，而要成为孩子的坚强后盾，明确告诉孩子：“这是对方违法犯罪，爸妈带你去报警，法律会狠狠惩治他们！”及时带孩子脱离有害网络环境。\n\n---","parentQuote":"被开盒的孩子通常极其恐慌、自责甚至产生轻生念头。家长此时千万不能责怪孩子“你天天上网惹是生非干什么”，而要成为孩子的坚强后盾，明确告诉孩子：“这是对方违法犯罪，爸妈带你去报警，法律会狠狠惩治他们！”及时带孩子脱离有害网络环境。\n\n---","fileName":"09-账号、隐私与数字防身：SIM卡PIN码与防开盒挂人.md"},{"num":"45","tag1":"通用","tag2":"自己就能做","title":"严禁租售个人社交账号（微信/QQ/抖音/快手）","cost":"0元，拒绝微商或黑产租号诱惑。","plain":"网上经常有广告：“租微信号/快手号/抖音号，挂机一天给80-150元佣金，不用你管”。**绝对不能租！绝对不能卖！**黑产租用学生账号的目的，100%是用来发送色情引流信息、发布招嫖赌博广告、或者用于电信网络诈骗洗钱。一旦被腾讯、抖音风控系统捕捉或被受害人举报，你的账号会被永久封禁且无法解封；实名绑定的手机号会被运营商拉黑；情节严重帮助诈骗实施的，同样构成“帮助信息网络犯罪活动罪”。","benefit":"保护个人实名信用，防止自己多年积攒的微信好友、同学圈子沦为黑产宰割的“肉鸡”。","level":"A（公安部“净网”专项行动通报案例；《中华人民共和国反电信网络诈骗法》第三十一条）。","source":"公安部刑侦局，https://www.mps.gov.cn/","remark":"【直接转给爸妈看】：很多中学生零花钱不够用，看到同学在“租号赚钱”就盲目跟风。租出去几小时后，微信号就发了几百条虚假投资或者兼职刷单信息给通讯录里的亲戚长辈。家长应当定期查看孩子的手机应用登录设备列表，杜绝异地非常规授权。","parentQuote":"很多中学生零花钱不够用，看到同学在“租号赚钱”就盲目跟风。租出去几小时后，微信号就发了几百条虚假投资或者兼职刷单信息给通讯录里的亲戚长辈。家长应当定期查看孩子的手机应用登录设备列表，杜绝异地非常规授权。","fileName":"09-账号、隐私与数字防身：SIM卡PIN码与防开盒挂人.md"},{"num":"46","tag1":"通用","tag2":"找爸妈一起办","title":"算清中职与普高的真实出路（搞懂“3+4中本贯通”与职教高考）","cost":"0元，全家研读本地教育考试院中考招生指南。","plain":"如果中考分数离普高录取线有明显差距，**盲目花高价去上管理松散的民办差普高，不如精准填报公办优质中职的“3+4中本贯通”或“五年一贯制大专”**！","benefit":"避免普通工薪家庭因“普高执念”背负十几万教育负债却换来大专录取，利用政策洼地实现本科直通。","level":"A（教育部、财政部、人力资源社会保障部等部门关于推动现代职业教育高质量发展的实施意见；各省教育厅中职本科贯通培养指导方案）。","source":"教育部职业教育与成人教育司，http://www.moe.gov.cn/","remark":"【直接转给爸妈看】：家长最大的心病是怕职校风气差。选择职业学校切记两大铁律：1. 坚决选**公办国家级重点中专或公办高职院校的五年制**，坚决不碰营利性私立野鸡技校；2. 认准招生代码上的“中本贯通”或“单招升学班”，看学校每年的转段升学率和职教高考本科上线率，把孩子送进以升学为导向的班级。\n\n---","parentQuote":"家长最大的心病是怕职校风气差。选择职业学校切记两大铁律：1. 坚决选**公办国家级重点中专或公办高职院校的五年制**，坚决不碰营利性私立野鸡技校；2. 认准招生代码上的“中本贯通”或“单招升学班”，看学校每年的转段升学率和职教高考本科上线率，把孩子送进以升学为导向的班级。\n\n---","fileName":"10-中考分流与18岁出路：中职普高算账、3加4贯通与兵役.md"},{"num":"47","tag1":"通用","tag2":"找爸妈一起办","title":"掌握18岁兵役登记与入伍国家优待政策（退役免试专升本/考研加分）","cost":"0元，登录全国征兵网（每年1月1日至6月30日完成兵役登记）。","plain":"当年年满18周岁的男性公民依法必须进行兵役登记。对于普通家庭孩子而言，**参军入伍是一条性价比极高的发展通道**：\n  1. **学费全免与学费补偿**：本专科生每生每年最高补偿代偿16000元，研究生最高20000元（大学学费直接由国家报销）；\n  2. **优待金与安置费**：入伍两年退役，各地政府发放家庭优待金和退役补助金，经济较发达地区往往在10-25万元不等；\n  3. **升学硬核政策红利**：专科生退役后**免试入读普通本科**（免除专升本考试）；教育部设立“退役大学生士兵专项硕士研究生招生计划”（全国单独划线，竞争难度大幅降低）；考研初试总分加10分；报考公务员、消防员、事业单位设立专门定向招录岗位。","benefit":"全额解决全家读大学的学费负担，退役即获学历提升通道或体制内招录优势，锻炼刚毅体魄。","level":"A（全国人大常委会《中华人民共和国兵役法》2021年修订；财政部、教育部、退役军人事务部财教〔2021〕310号）。","source":"全国征兵网，https://www.gfbzb.gov.cn/","remark":"【直接转给爸妈看】：很多家长担心“当兵耽误读书”。实际上，**最推荐的入伍时机是“拿到大学录取通知书后保留学籍入伍”或者“大专/大学毕业当年入伍”**。在学校保留学籍当兵两年，拿着优待金回学校继续免学费读书；大专毕业生当兵退役直接保送本科，彻底解决学历提升瓶颈。\n\n---","parentQuote":"很多家长担心“当兵耽误读书”。实际上，**最推荐的入伍时机是“拿到大学录取通知书后保留学籍入伍”或者“大专/大学毕业当年入伍”**。在学校保留学籍当兵两年，拿着优待金回学校继续免学费读书；大专毕业生当兵退役直接保送本科，彻底解决学历提升瓶颈。\n\n---","fileName":"10-中考分流与18岁出路：中职普高算账、3加4贯通与兵役.md"},{"num":"48","tag1":"通用","tag2":"自己就能做","title":"高中毕业暑期兼职防坑（远离“医美贷”、“押金陷阱”与黑中介）","cost":"0元，兼职前核验劳动合同。","plain":"高考/中考结束后，准大学生和高中毕业生找兼职最容易踩三大致命坑：\n  1. **“招募平面模特/前台/主播，但需要先贷款整容/买服装”**：这是极其恶毒的“医美贷”骗局！套路是忽悠学生分期贷款几万元去指定小诊所隆鼻割双眼皮，承诺兼职收入还贷，手术一完公司立即失联，学生背负巨额高利贷；\n  2. **“先交300-500元押金、体检费、办卡费”**：我国《劳动合同法》第九条严令禁止用人单位扣押劳动者居民身份证，严禁要求劳动者提供担保或者以其他名义向劳动者收取财物。凡是入职前要交钱的，100%是黑中介；\n  3. **“高薪打字员、刷单返利、日结500元”**：全系电信诈骗或灰产引流。","benefit":"保护刚满18岁的青年免受网贷剥削，树立正规劳动法律意识。","level":"A（全国人大常委会《中华人民共和国劳动合同法》第九条、第八十四条；人社部高校毕业生求职就业防骗指南）。","source":"人力资源和社会保障部官网，http://www.mohrss.gov.cn/","remark":"【直接转给爸妈看】：高考结束的暑假是孩子接触社会的“第一课”。找兼职只认准两条安全通道：1. 正规大型连锁企业（如肯德基、麦当劳、星巴克、大型超市、顺丰等直营门店），流程规范、按工时发薪、不押身份证；2. 熟人推荐的家教或图书馆、社区志愿者岗位。切忌在58同城或QQ群随便联系“招募高薪演艺主播兼职”。","parentQuote":"高考结束的暑假是孩子接触社会的“第一课”。找兼职只认准两条安全通道：1. 正规大型连锁企业（如肯德基、麦当劳、星巴克、大型超市、顺丰等直营门店），流程规范、按工时发薪、不押身份证；2. 熟人推荐的家教或图书馆、社区志愿者岗位。切忌在58同城或QQ群随便联系“招募高薪演艺主播兼职”。","fileName":"10-中考分流与18岁出路：中职普高算账、3加4贯通与兵役.md"},{"num":"49","tag1":"通用","tag2":"找爸妈一起办","title":"申领中职全免学费与普通高中国家助学金（高中阶段零学费）","cost":"0元，凭户籍或家庭困难证明向就读学校申报。","plain":"1. **中等职业学校免学费政策**：国家对中等职业学校**全日制学历教育正式学籍一、二、三年级在校生中所有农村（含县镇）学生、城市涉农专业学生和家庭经济困难学生**免除学费（艺术类相关表演专业除外）。在许多省份，公办中职学费实现全员免除！\n  2. **中职国家助学金**：一、二年级涉农专业学生和非涉农专业家庭经济困难学生，每生每年平均资助**2000元**（特困地区覆盖面更广）。\n  3. **普通高中国家助学金**：用于资助普通高中在校生中的家庭经济困难学生，平均资助标准为每生每年**2000元**，脱贫户、低保户、特困供养、残疾学生等四类家庭学生还可直接享受**免除学杂费**政策。","benefit":"彻底打消普通农村与低收入家庭“供不起高中/中专”的顾虑，让孩子安心完成基础阶段教育。","level":"A（财政部、教育部、人社部《学生资助资金管理办法》财教〔2021〕310号）。","source":"全国学生资助管理中心，http://www.cstac.org.cn/","remark":"【直接转给爸妈看】：如果家庭遭遇重大变故（如父母重病、突发灾害、低保户），开学时直接联系班主任填写《家庭经济困难学生认定申请表》，不需要任何复杂的证明（现在全面推行告知承诺制，与民政系统直接大数据对碰），直接在学费中减免并按月发放助学金到孩子银行卡中。\n\n---","parentQuote":"如果家庭遭遇重大变故（如父母重病、突发灾害、低保户），开学时 let doneMap = {};
try {
  doneMap = JSON.parse(localStorage.getItem('YGG_DONE_ITEMS') || '{}');
} catch (e) { doneMap = {}; }

let currentFilters = { gender: 'all', actor: 'all', query: '', onlyUnfinished: false };

function saveDone() {
  try {
    localStorage.setItem('YGG_DONE_ITEMS', JSON.stringify(doneMap));
  } catch (e) {}
  updateProgress();
}

function toggleItemDone(num) {
  if (doneMap[num]) {
    delete doneMap[num];
  } else {
    doneMap[num] = true;
  }
  saveDone();
  filterItems();
}

function updateProgress() {
  const total = window.CORPUS_DATA.length;
  const done = Object.keys(doneMap).filter(k => doneMap[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('pctText').textContent = `(${pct}%)`;
  document.getElementById('progFill').style.width = pct + '%';
}

function toggleFilterDone() {
  currentFilters.onlyUnfinished = !currentFilters.onlyUnfinished;
  event.target.style.background = currentFilters.onlyUnfinished ? 'var(--primary)' : '';
  event.target.style.color = currentFilters.onlyUnfinished ? '#fff' : '';
  filterItems();
}

function resetDone() {
  if (confirm('确定要清空所有已落实打卡记录吗？')) {
    doneMap = {};
    saveDone();
    filterItems();
  }
}

function setFilter(btn) {
  const type = btn.getAttribute('data-filter');
  const val = btn.getAttribute('data-val');
  document.querySelectorAll(`.btn-tag[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilters[type] = val;
  filterItems();
}

function filterItems() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  currentFilters.query = query;

  const filtered = window.CORPUS_DATA.filter(item => {
    if (currentFilters.onlyUnfinished && doneMap[item.num]) return false;

    if (currentFilters.gender === 'boy' && item.tag1 !== '男孩必看') return false;
    if (currentFilters.gender === 'girl' && item.tag1 !== '女孩必看') return false;
    if (currentFilters.gender === 'common' && item.tag1 !== '通用') return false;

    if (currentFilters.actor === 'self' && item.tag2 !== '自己就能做') return false;
    if (currentFilters.actor === 'parent' && item.tag2 !== '找爸妈一起办') return false;

    if (query) {
      const match = item.title.toLowerCase().includes(query) ||
                    item.plain.toLowerCase().includes(query) ||
                    item.benefit.toLowerCase().includes(query) ||
                    item.cost.toLowerCase().includes(query);
      if (!match) return false;
    }
    return true;
  });

  renderItems(filtered);
}

function renderItems(items) {
  const container = document.getElementById('itemsContainer');
  document.getElementById('resultCount').textContent = `匹配到 ${items.length} 条建议`;

  if (!items.length) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted);">没有找到符合条件的建议，换个词试试？</div>`;
    return;
  }

  container.innerHTML = items.map(it => {
    let tagClass = 'all';
    if (it.tag1.includes('男')) tagClass = 'boy';
    if (it.tag1.includes('女')) tagClass = 'girl';
    const isDone = !!doneMap[it.num];

    return `
      <div class="card ${isDone ? 'done' : ''}">
        <div class="card-header">
          <div class="card-title">
            <span style="color:var(--primary);">#${it.num}</span>
            <span class="badge ${tagClass}">${it.tag1}</span>
            <span class="badge level">证据 ${it.level}级</span>
            <span>${it.title}</span>
          </div>
          <button class="check-toggle ${isDone ? 'checked' : ''}" onclick="toggleItemDone('${it.num}')">
            ${isDone ? '✓ 已落实' : '○ 标记落实'}
          </button>
        </div>
        
        <div class="plain-box">
          <strong>💡 说人话：</strong>${it.plain}
        </div>

        <div class="section-item"><strong>💰 成本：</strong>${it.cost}</div>
        <div class="section-item"><strong>📊 收益与依据：</strong>${it.benefit}</div>
        <div class="section-item"><strong>🔗 权威来源：</strong><span style="font-size:12px;color:var(--muted);">${it.source}</span></div>

        ${it.parentQuote ? `
          <div class="parent-quote">
            <span><strong>📢 直接发给爸妈看：</strong>${it.parentQuote}</span>
            <button class="copy-btn" onclick="copyText('${it.parentQuote.replace(/'/g, "\\'")}')">一键复制</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function copyText(txt) {
  navigator.clipboard.writeText(txt).then(() => {
    alert("已复制话术到剪贴板，可直接粘贴微信发给爸妈！");
  }).catch(() => {
    prompt("请手动复制以下话术：", txt);
  });
}

function init() {
  updateProgress();
  renderItems(window.CORPUS_DATA);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
