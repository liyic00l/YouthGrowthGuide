window.CORPUS_DATA = [{"num":"1","tag1":"通用","tag2":"自己就能做","title":"每天白天累计在户外自然光下活动2小时，是预防近视最有效且零成本的手段","cost":"不花一分钱，课间十分钟走出教室、放学走回家或在操场跑步。","plain":"防近视最管用的不是吃叶黄素或眼贴，而是大白天的户外自然光。哪怕在阴天树荫下，自然光照度也是室内灯光的几十倍，能刺激视网膜分泌多巴胺，阻断眼轴被动拉长。","benefit":"大样本随机对照试验显示，每天增加 40 到 80 分钟户外时间，3 年累计近视发病率下降 9.1% 到 14%。He 等 2015 年《JAMA》广州中小学生随机试验显示，每天增加 40 分钟户外活动使 3 年近视发病率由 39.5% 降至 30.4%（HR 0.77, 95% CI 0.66–0.91）；国家卫健委《儿童青少年近视防控适宜技术指南》明确要求中小学生每天日间户外活动至少 2 小时（全国，现行有效）。","level":"A","source":"He M 等(2015). JAMA, 314(11), 1142-1148. https://doi.org/10.1001/jama.2015.10803 ；国家卫生健康委(2021). 儿童青少年近视防控适宜技术指南(更新版). https://www.nhc.gov.cn","remark":"戴普通近视眼镜在户外活动同样有效，关键是环境光照强度，不要求剧烈运动。","parentQuote":"","fileName":"01-不要把眼睛搞坏：近视防控与视光避坑.md"},{"num":"2","tag1":"通用","tag2":"找爸妈一起办","title":"快速进展期近视经公立医院散瞳确诊后，遵医嘱规范使用0.01%低浓度阿托品滴眼液","cost":"公立医院开具每月约 150 至 250 元，需每 3 个月复查眼压与眼轴。","plain":"如果一年近视涨超过 75 度，市面上所谓的理疗仪都是智商税。国家药监局已正式批准低浓度阿托品眼药水，每晚睡前滴一滴，是医学界公认能有效延缓近视进展的药物。","benefit":"多中心临床随机试验显示，0.01% 阿托品滴眼液能延缓近视进展约 30% 至 50%，且停药后反弹极小、瞳孔散大与畏光副反应极低。LAMP 研究（Yam 等 2020 年《Ophthalmology》）显示 0.01% 浓度在延缓眼轴增长方面兼顾了最佳安全性与有效性（国际 RCT，现行有效）。","level":"A","source":"Yam JC 等(2020). Ophthalmology, 127(7), 910-919. https://doi.org/10.1016/j.ophtha.2019.12.011 ；国家药品监督管理局(NMPA)(2024). 硫酸阿托品滴眼液批准证明文件. https://www.nmpa.gov.cn","remark":"必须在二级以上公立医院眼科做眼压、散瞳验光等全套检查后遵医嘱使用，青光眼或眼压偏高者禁用。","parentQuote":"","fileName":"01-不要把眼睛搞坏：近视防控与视光避坑.md"},{"num":"3","tag1":"通用","tag2":"找爸妈一起办","title":"每年定期进行散瞳验光与眼轴长度测量，建立专属的儿童青少年屈光发育发育档案","cost":"公立医院眼科散瞳验光加眼轴生物测量（IOL Master）约 100 至 200 元。","plain":"很多眼镜店图省事只用电脑打一张纸条就配镜，这极易把眼睛睫状肌紧张的“假性近视”直接按真近视给配上眼镜，弄假成真。在公立医院用散瞳药水让睫状肌彻底麻痹瘫痪后测出的度数才是唯一真度数；监测眼轴（正常每年增长小于 0.2 毫米）能在近视度数涨出来之前提前 1 年发出预警。","benefit":"国家卫生健康委《儿童青少年近视防控适宜技术指南》强烈建议从 6 岁起每 6 个月进行睫状肌麻痹验光与眼轴测量。追踪眼轴年增长率对预测病理性高度近视的敏感度达 91% 以上（全国，现行有效）。","level":"A","source":"国家卫生健康委(2021). 儿童青少年近视防控适宜技术指南(更新版). https://www.nhc.gov.cn ；中华医学会眼科学分会眼视光学组(2017). 综合防控儿童青少年近视专家共识.","remark":"6—12 岁首次验光建议使用慢速散瞳药（如环戊通滴眼液），散瞳后几小时内畏光看近处模糊是正常药效反应。","parentQuote":"","fileName":"01-不要把眼睛搞坏：近视防控与视光避坑.md"},{"num":"4","tag1":"通用","tag2":"找爸妈一起办","title":"8周岁以上近视快速加深且眼轴增长过快者，严格经公立医院评估验配角膜塑形镜（OK镜）","cost":"公立医院验配国产或进口 OK 镜每副约 6000 至 12000 元（镜片寿命约 1 到 1.5 年），需严格配套护理液。","plain":"OK 镜是一种高透氧的硬性隐形眼镜，每晚睡觉时戴 8 小时，把角膜中央表面物理压平产生近视离焦，第二天白天不用戴任何眼镜就能拥有 1.0 的清晰裸眼视力，同时能延缓近视加深速度约 40% 到 60%。但每天清洗护理必须极度严谨，偷懒用自来水冲洗会导致致盲性角膜溃疡。","benefit":"Sun 等 2015 年荟萃分析纳入 7 项 RCT 研究，OK 镜延缓眼轴增长的平均效力达 45%（MD -0.27 mm, 95% CI -0.32 to -0.22）。国家卫健委明确 OK 镜属于三类医疗器械，只能在二级以上公立医院有资质眼视光专科验配（国际元分析，现行有效）。","level":"A","source":"Sun Y 等(2015). PLoS One, 10(4), e0124535. https://doi.org/10.1371/journal.pone.0124535 ；国家卫生健康委(2018). 近视防治指南.","remark":"如果眼睛发红、疼痛、怕光流泪，立刻停戴并冲向医院眼科急诊，严禁强忍佩戴。","parentQuote":"","fileName":"01-不要把眼睛搞坏：近视防控与视光避坑.md"},{"num":"5","tag1":"通用","tag2":"自己就能做","title":"读写遵守「20-20-20」法则与一尺一拳一寸，避免躺着看手机","cost":"不花钱，只需设置定时器或养成抬头习惯。","plain":"看书写字或看手机 20 分钟，就抬头看 6 米（20 英尺）以外的远处至少 20 秒，让眼睛肌肉彻底放松。胸口离桌一拳、眼离书本一尺、握笔指尖离笔尖一寸。","benefit":"持续近距离用眼是导致调节痉挛和眼轴加速变长的直接推手。遵守 20-20-20 原则可使视疲劳发生率降低 38% 以上。美国眼科学会（AAO）临床指南证实间歇远眺能有效阻断睫状肌持续痉挛（国际指南，现行有效）。","level":"B","source":"American Academy of Ophthalmology (AAO)(2020). Computers, Digital Devices and Eye Strain. https://www.aao.org","remark":"晚上躺在被窝里看手机会因为双眼物距不等和暗适应瞳孔放大诱发严重屈光参差与视疲劳，严禁睡前熄灯看手机。","parentQuote":"","fileName":"01-不要把眼睛搞坏：近视防控与视光避坑.md"},{"num":"6","tag1":"通用","tag2":"自己就能做","title":"读写台灯严格认准「国AA级照度」与「Rg0无蓝光危害」，色温调节至4000K暖白光","cost":"合格的国标 AA 级护眼台灯仅约 100 至 200 元（不要买上千元所谓全光谱智商税）。","plain":"写作业时桌面灯光太暗或刺眼闪烁，睫状肌要疯狂收缩聚焦，眼睛一小时就累得充血。买台灯翻到底部铭牌看三点：必须写有“国 AA 级照度”（照度均匀防局部死黑）、“蓝光危害 RG0 豁免级”（不伤视网膜）、色温在 4000K 左右（柔和微黄暖白光最护眼），且写字时房间顶灯必须同时打开！","benefit":"国家市场监督管理总局国家标准 GB/T 9473-2022《读写作业台灯性能要求》强制规范照度与遮光性。临床人因工程实验证实，均匀柔和的双重背景光可使视疲劳指数降低 42%（国家强制标准，现行有效）。","level":"A","source":"国家市场监督管理总局, 国家标准化管理委员会(2022). 读写作业台灯性能要求(GB/T 9473-2022). https://openstd.samr.gov.cn","remark":"只开台灯不开房间大灯会导致大范围明暗反差强对比，是中小学生用眼疲劳的主要诱因，严禁摸黑学习。","parentQuote":"","fileName":"01-不要把眼睛搞坏：近视防控与视光避坑.md"},{"num":"7","tag1":"通用","tag2":"找爸妈一起办","title":"6到14岁在第一、第二恒磨牙萌出后，尽快去公立口腔医院做窝沟封闭","cost":"多地公立小学有政府免费公共卫生项目；自费在公立医院每颗牙仅约 50 至 100 元。","plain":"后槽牙表面有很多像火山口一样又深又细的缝隙，牙刷毛根本刷不进去，九成中小学生的烂牙都烂在这里。窝沟封闭是用安全的树脂把裂缝填平，食物残渣进不去，牙齿一辈子受益。","benefit":"Cochrane 系统评价纳入 38 项试验共 7924 名儿童，封闭剂在 2 至 3 年内使磨牙咬合面龋齿减少 76%，9 年随访仍减少 65%（RR 0.35, 95% CI 0.19–0.63）。中华口腔医学会与国家疾控局《健康口腔行动方案》重点推荐适龄儿童窝沟封闭（全国，现行有效）。","level":"A","source":"Ahovuo-Saloranta A 等(2017). Cochrane Database Syst Rev, 7(7), CD001830. https://doi.org/10.1002/14651858.CD001830.pub5 ；国家卫生健康委(2019). 健康口腔行动方案（2019—2025年）. https://www.nhc.gov.cn","remark":"6—8 岁封闭第一恒磨牙（六龄齿），11—14 岁封闭第二恒磨牙。做完后每年口腔检查顺便看是否有脱落。","parentQuote":"","fileName":"02-守住一口好牙：窝沟封闭、补牙与拔智齿.md"},{"num":"8","tag1":"通用","tag2":"找爸妈一起办","title":"每年定期洗牙并做全口涂氟，发现浅龋浅洞立刻补牙别拖成根管治疗","cost":"普通补牙每颗 150 至 300 元（医保可报销部分），拖成牙髓炎根管治疗加牙冠需 1500 至 4000 元。","plain":"牙齿表面有一点黑点不疼不痒时，补牙只要几百块、半小时搞定；一旦烂到神经半夜牙疼要命，就得抽神经杀髓做根管治疗，花几千块还得受大罪。每年洗一次牙是预防牙龈出血牙周炎的关键。","benefit":"定期口腔检查早期充填浅龋可保留 95% 以上牙髓活力，避免不可逆牙髓坏死。中华口腔医学会临床指南明确指出牙石是牙周病始动因素，洗牙不会损伤牙釉质（全国，现行有效）。","level":"B","source":"中华口腔医学会牙周病学组(2017). 牙周病诊疗指南. 人民卫生出版社","remark":"【直接转给爸妈看】：爸妈，我牙齿咬合面有黑线/塞牙疼，趁现在只是小洞去公立医院花两百块补上，拖到杀神经做牙套要几千块。","parentQuote":"爸妈，我牙齿咬合面有黑线/塞牙疼，趁现在只是小洞去公立医院花两百块补上，拖到杀神经做牙套要几千块。","fileName":"02-守住一口好牙：窝沟封闭、补牙与拔智齿.md"},{"num":"9","tag1":"通用","tag2":"自己就能做","title":"每天早晚用含氟牙膏规范巴氏刷牙法刷满2分钟，每晚使用牙线清洁牙缝","cost":"含氟牙膏 10 元/支，牙线 15 元/盒，每年花费不足 50 元。","plain":"牙刷毛倾斜 45 度对着牙齿和牙龈交界处，轻轻画圈颤动刷，外面、里面、咬合面都要刷到。牙刷只能刷干净牙齿三个面，两个牙齿挨着的牙缝必须靠牙线，牙线不会把牙缝变大。","benefit":"Cochrane 系统评价包含 96 项研究涉及 6.5 万人，每天用 1000–1500 ppm 含氟牙膏刷牙使恒牙龋齿指数（DMFT）降低 23%（95% CI 19%–27%）。中华口腔医学会指南证实使用牙线能使牙龈炎发生率降低 40% 以上（全国，现行有效）。","level":"A","source":"Walsh T 等(2019). Cochrane Database Syst Rev, 3(3), CD007868. https://doi.org/10.1002/14651858.CD007868.pub3 ；中华口腔医学会(2020). 中国居民口腔健康指南.","remark":"含氟量在 0.1% 至 0.15% 之间的普通含氟牙膏即可，千万别买昂贵的抗幽门螺杆菌或美白牙膏。","parentQuote":"","fileName":"02-守住一口好牙：窝沟封闭、补牙与拔智齿.md"},{"num":"10","tag1":"通用","tag2":"找爸妈一起办","title":"每年去公立口腔医院进行一次全口氟化泡沫或氟保护漆涂氟，巩固牙齿抗酸脱矿能力","cost":"公立医院全口涂氟一次约 50 至 120 元（部分地区为学校免费公卫筛查项目）。","plain":"牙齿表面坚硬的牙釉质每天都在被口腔里的细菌酸液腐蚀“脱矿”。专业口腔涂氟就像给牙齿全身刷上一层超强防弹衣涂层，让牙齿表面的羟基磷灰石转变成耐酸能力强十倍的氟磷灰石，抑制细菌产酸腐蚀。涂完后半小时不喝水漱口即可。","benefit":"Cochrane 系统评价纳入多项随机试验，适龄儿童每年进行 2 至 4 次专业涂氟，可使恒牙龋齿新发率下降 43%（95% CI 30%–57%），是世界卫生组织重点推荐的防龋公共卫生适宜技术（国际元分析，现行有效）。","level":"A","source":"Marinho VC 等(2013). Cochrane Database Syst Rev, 7(7), CD002279. https://doi.org/10.1002/14651858.CD002279.pub2 ；中华口腔医学会儿童口腔医学专业委员会(2021). 局部使用氟化物防龋专家共识.","remark":"涂氟由专业医生操作，氟摄入量严格受控，完全不会发生氟中毒，与日常使用含氟牙膏相辅相成。","parentQuote":"","fileName":"02-守住一口好牙：窝沟封闭、补牙与拔智齿.md"},{"num":"11","tag1":"通用","tag2":"找爸妈一起办","title":"满16岁后拍摄全口曲面体层片（全景牙片），及早评估下颌阻生智齿预防挤歪前牙与冠周炎","cost":"全口曲面体层 X 光片约 60 至 100 元，医保可报销。","plain":"人类进化到现在下巴骨头越来越窄，最后长出来的智齿（第三磨牙）绝大部分空间不够，像斜插的树根一样横着顶在旁边好牙的腰上（阻生智齿）。不仅容易卡食物残渣导致前面的恒牙烂穿神经，还会引起半夜脸肿嘴巴张不开的发烧冠周炎。16 岁拍片看清走势，趁着高三或大一暑假尽早拔掉省大祸。","benefit":"中华口腔医学会牙颌面创伤与正畸多学科专家共识指出，下颌阻生智齿引起邻牙第二恒磨牙远中面龋坏及牙根吸收率达 30% 到 50%，在牙根未完全形成期早期预防性拔除并发症率最低（全国临床指南，现行有效）。","level":"B","source":"中华口腔医学会口腔颌面外科专业委员会(2020). 阻生牙拔除临床路径指南. 中华口腔医学杂志","remark":"女孩子在准备高考冲刺前更要排查智齿，一旦在大考期间智齿盲袋突发急性冠周炎，疼痛发烧会导致考试严重发挥失常。","parentQuote":"","fileName":"02-守住一口好牙：窝沟封闭、补牙与拔智齿.md"},{"num":"12","tag1":"男孩必看","tag2":"找爸妈一起办","title":"运动冲撞或打球时佩戴定制运动护齿器，防牙齿脱落折断","cost":"网购自塑形护齿牙套约 30 至 60 元，公立口腔医院定制约 300 至 500 元。","plain":"男生打篮球、踢足球、练散打或玩滑板时，经常被手肘或膝盖撞到嘴巴导致门牙直接被砸断或撞飞。一旦恒门牙连根掉了，补牙或 18 岁后种植牙一颗要花近万元，戴个护齿牙套能抗住大部分冲撞。","benefit":"Knapik 等 2019 年《Sports Med》系统综述与荟萃分析证实，佩戴护齿套使口腔颌面部及牙齿损伤风险显著降低 69% 至 82%（RR 0.27, 95% CI 0.17–0.44）（国际荟萃分析，现行有效）。","level":"A","source":"Knapik JJ 等(2019). Sports Med, 49(8), 1217-1232. https://doi.org/10.1007/s40279-019-01121-w","remark":"若门牙意外完全撞脱落，切记手捏牙冠、绝对别擦拭牙根，立刻泡在冷纯牛奶或含在舌下 30 分钟内送医再植。","parentQuote":"","fileName":"02-守住一口好牙：窝沟封闭、补牙与拔智齿.md"},{"num":"13","tag1":"通用","tag2":"找爸妈一起办","title":"青春期快速蹿个阶段，每学期用亚当斯前屈试验自查脊柱侧弯","cost":"不花钱，在家脱上衣光脚站立，弯腰 90 度让爸妈在正后方观察 1 分钟。","plain":"双脚并拢站直，双膝伸直，两手合十自然下垂往前弯腰 90 度。让爸妈从正后方平视你的后背，看两边背部、腰部有没有一高一低「剃刀背」。如果一边高一边低，必须立刻去医院拍脊柱全长 X 光片。","benefit":"特发性脊柱侧弯在 10—16 岁青春发育期进展最猛。在骨龄闭合前早期发现轻度侧弯（Cobb 角 20—40 度）进行支具矫正，成功率达 72%，能完全避免开刀动手术融合脊柱。Weinstein 等 2013 年《NEJM》多中心 RCT 证实佩戴支具使侧弯进展至需手术的风险显著降低（OR 0.28, 95% CI 0.12–0.66）（国际 RCT，现行有效）。","level":"A","source":"Weinstein SL 等(2013). N Engl J Med, 369(16), 1512-1521. https://doi.org/10.1056/NEJMoa1307337 ；国家卫生健康委(2021). 儿童青少年脊柱弯曲异常防控技术指南. https://www.nhc.gov.cn","remark":"女孩脊柱侧弯发病率及进展为重度的概率比男孩高约 4 到 7 倍，初潮前后一年是重点自查窗口期。","parentQuote":"","fileName":"03-骨头、体态与长高：脊柱侧弯与增高针打假.md"},{"num":"14","tag1":"通用","tag2":"自己就能做","title":"丢掉十字矫姿带与背背佳，每天靠墙站立加引体向上锻炼核心肌群","cost":"不花一分钱，单杠引体向上或靠墙静态站立每天 5 到 10 分钟。","plain":"网上热卖的「背背佳」「矫正带」靠外力硬捆把背拉直，反而会让自身的背部肌肉失去力量变得更废，一脱下来驼得更厉害。挺拔体态必须靠自己练出强健的背部和核心肌肉。","benefit":"系统评价显示被动束身带无法重建姿势反射，停用后驼背复发率 100%，且长期捆扎限制胸廓运动导致肺活量下降。主动抗阻与核心肌群训练使胸椎后凸角平均改善 5 至 8 度（国际系统评价，现行有效）。","level":"B","source":"Bansal S 等(2014). Osteoporos Int, 25(6), 1715-1725. https://doi.org/10.1007/s00198-014-2661-2","remark":"日常看书做作业把桌椅高度调好，大腿水平、小腿垂直地面，背部自然靠紧椅背。","parentQuote":"","fileName":"03-骨头、体态与长高：脊柱侧弯与增高针打假.md"},{"num":"15","tag1":"女孩必看","tag2":"找爸妈一起办","title":"女孩骨龄通常在初潮后1至2年闭合，盲目使用增高针可能催化骨骺早闭","cost":"普通医院骨龄片仅 80 至 120 元；所谓私立机构“生长激素增高”每月开销 3000 至 8000 元且暗藏巨大风险。","plain":"女孩一般在初潮前一年生长速度最快，来月经后骨骺通常会在 1 到 2 年内彻底闭合，骨缝闭合后无论吃什么药都不可能再长高。市面上没有生长激素缺乏指征就乱打“增高针”，不仅浪费几万块，还可能引起颅内高压和股骨头滑脱。","benefit":"中华医学会儿科学分会《基因重组人生长激素儿科临床规范应用指南》明确指出生长激素有极严格适应症，非缺乏者用药并不能显著增加最终成年身高，反而可能诱发骨骺提前愈合及内分泌紊乱（全国，现行有效）。","level":"B","source":"中华医学会儿科学分会内分泌遗传代谢学组(2013). 中华儿科杂志, 51(6), 426-432.","remark":"【直接转给爸妈看】：爸妈，女孩初潮后骨骺很快闭合，去公立医院花 100 块拍个左手骨龄正位片就能看骨骺线闭没闭合，千万别信任何私立增高门诊。","parentQuote":"爸妈，女孩初潮后骨骺很快闭合，去公立医院花 100 块拍个左手骨龄正位片就能看骨骺线闭没闭合，千万别信任何私立增高门诊。","fileName":"03-骨头、体态与长高：脊柱侧弯与增高针打假.md"},{"num":"16","tag1":"通用","tag2":"自己就能做","title":"严禁用尖锐金属耳勺挖耳，耵聍具有自洁保护功能无需频繁清理","cost":"不花一分钱，停止购买发光采耳勺或金属挖耳勺。","plain":"耳朵里的耳屎（耵聍）不是脏东西，它能粘住灰尘小虫、保护耳道皮肤。平时说话咀嚼它会自动掉出来。用铁勺或棉签掏，极易把耳屎捅得更深堵死耳道，或者不小心戳穿鼓膜导致耳聋。","benefit":"美国耳鼻咽喉头颈外科学会（AAO-HNS）临床指南指出耳道具有自然排异机制，棉签和耳勺是造成耳道损伤、外耳道真菌感染和创伤性鼓膜穿孔的最主要诱因（国际临床指南，现行有效）。","level":"B","source":"Schwartz SR 等(2017). Otolaryngol Head Neck Surg, 156(1_suppl), S1-S29. https://doi.org/10.1177/0194599816671491","remark":"如果洗头进水后耳屎膨胀听不清，直接去医院耳鼻喉科挂号，医生用碳酸氢钠滴耳液软化后几分钟就能无痛冲洗干净。","parentQuote":"","fileName":"03-骨头、体态与长高：脊柱侧弯与增高针打假.md"},{"num":"17","tag1":"通用","tag2":"自己就能做","title":"不去水库河沟野泳，看见同伴落水绝不手拉手或下水救人","cost":"不花钱，远离水库、野塘和施工深坑。","plain":"溺水是中国中小学生意外死亡第一杀手，很多悲剧都是几个孩子手拉手下水救同伴引发连环溺亡。岸上呼救和抛投漂浮物才是未成年人唯一安全的帮法。","benefit":"溺水者求生本能会死死抱住施救者把两人一起拖入水底。正确做法是立刻大声呼救、打 110 和 120，并把竹竿、绳子或空塑料桶扔过去。 国家卫健委与教育部《儿童青少年溺水预防与急救指南》明确指出，发现同伴溺水时未成年人严禁盲目下水施救或手拉手施救，应立即大声呼救寻求成人帮助、拨打 110/120，并利用竹竿、衣物、空塑料瓶等漂浮物在岸上施救（全国，现行有效）。","level":"B","source":"国家卫生健康委办公厅, 教育部办公厅(2021). 儿童青少年溺水预防与急救指南. https://www.nhc.gov.cn","remark":"游泳只去有救生员值守的正规游泳馆，哪怕水性再好也绝不游野泳。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"18","tag1":"通用","tag2":"自己就能做","title":"未满12岁不骑自行车上路、未满16岁不骑电动自行车，骑车全程扣紧头盔系带","cost":"合规电动自行车头盔约 50 至 150 元，出门扣紧卡扣只需 5 秒。","plain":"骑车出车祸最致命的就是脑袋直接撞击地面。头盔只扣在头顶不系下巴带子，撞击瞬间头盔会先飞出去，必须把系带调紧到只能塞进一两根手指。","benefit":"规范佩戴带 CCC 认证的头盔并扣紧下巴系带。能使严重头部受伤风险降低近七成，致死性头部受伤风险降低六成以上。 Olivier 等 2017 年《Int J Epidemiol》荟萃分析纳入 40 项研究，骑行戴头盔使头部受伤比值比 OR 0.49（95% CI 0.42–0.57），严重头部受伤比值比 OR 0.31（95% CI 0.25–0.37），致死性头部受伤比值比 OR 0.35（95% CI 0.14–0.88）（国际荟萃分析，现行有效）。","level":"A","source":"Olivier J, Creighton P (2017). Int J Epidemiol, 46(1), 278-292. https://doi.org/10.1093/ije/dyw153 ；国务院(2017修订). 道路交通安全法实施条例（第七十二条）. https://flk.npc.gov.cn","remark":"骑车时绝对不要单手扶把、戴降噪耳机听歌或边骑车边看手机。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"19","tag1":"通用","tag2":"自己就能做","title":"看见有人突然倒地没呼吸，4分钟内拨打120、取用AED并用力按压胸口正中","cost":"不花钱，学校红十字急救培训或地铁站演示 15 分钟即可掌握。","plain":"我国超七成院外心脏骤停发生在家里，学心肺复苏首先是为了在关键时刻救自己家人。AED 只要打开电源就会全程语音指挥你贴电极片，谁都能用。","benefit":"立刻拨打 120 开免提，让人去取最近的 AED 自动体外除颤器。自己双手交叠按压两乳头连线正中（深 5—6 厘米，每分钟 100—120 次）。 国家心血管病中心《中国心脏骤停与心肺复苏报告》显示我国超七成院外心脏骤停发生于家庭场所，4 分钟内启动高质量胸外按压配合 AED 除颤可使生存率提高 2 至 3 倍。《民法典》第一百八十四条明确自愿实施紧急救助造成受助人损害的救助人不担责（全国，现行有效）。","level":"A","source":"国家心血管病中心(2023). 中国心脏骤停与心肺复苏报告. 人民卫生出版社 ；Panchal AR 等(2020). Circulation, 142(16_suppl_2), S366-S468. https://doi.org/10.1161/CIR.0000000000000916","remark":"按压节奏跟着《最炫民族风》或《小苹果》的节拍按，每分钟正好 110 次左右。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"20","tag1":"通用","tag2":"自己就能做","title":"吃东西卡住气管说不出话时，立刻用海姆立克法向内上方冲击上腹部","cost":"不花钱，看一遍规范教学视频 5 分钟即可学会。","plain":"气管完全堵死后 3 到 5 分钟就会大脑缺氧死亡，等救护车根本来不及。如果自己一个人卡住，马上把上腹部顶在椅背或桌角上用力向下猛压。","benefit":"立刻站在对方身后环抱其腰部，一手握拳拇指侧顶住肚脐上方两横指。另一手包住拳头快速向内上方冲击，直到异物吐出。 欧洲复苏委员会（ERC）及美国红十字会急救指南指出，意识清醒的 1 岁以上儿童及成人发生完全性气道异物梗阻时，腹部冲击法（海姆立克手法）是首选现场解除梗阻动作（国际指南，现行有效）。","level":"B","source":"Olasveengen TM 等(2021). Resuscitation, 161, 98-114. https://doi.org/10.1016/j.resuscitation.2021.02.009","remark":"如果对方还能大声咳嗽和说话，说明气管没完全堵死，鼓励他用力咳，千万别拍背。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"21","tag1":"通用","tag2":"自己就能做","title":"打球或跑步撞到头后出现头晕恶心，当天立刻下场停止比赛和剧烈运动","cost":"不花钱，忍住「不想拖累班级比赛」的冲动立刻下场。","plain":"撞头后只要出现头晕、恶心、看东西重影或记不清刚才比分。就是脑震荡信号，当天必须停止一切运动并让家长观察 24 小时。","benefit":"绝对不能接着上场。当天立刻退场停止所有比赛和剧烈运动。撞头后继续上场恢复时间翻倍，再撞一次可能引发致命二次冲击综合征。 Elbin 等 2016 年《Pediatrics》研究显示青少年脑震荡后继续上场平均需 44.4 天恢复，而当天立刻下场仅需 22.0 天；2023 年阿姆斯特丹运动脑震荡国际共识明确规定怀疑脑震荡必须立即退场且当天不得重返赛场（国际共识，现行有效）。","level":"B","source":"Elbin RJ 等(2016). Pediatrics, 138(3), e20160910. https://doi.org/10.1542/peds.2016-0910 ；Patricios JS 等(2023). Br J Sports Med, 57(11), 695-711. https://doi.org/10.1136/bjsports-2023-106898","remark":"撞头后 24 小时内若出现剧烈头痛加重、喷射性呕吐或叫不醒，立刻去急诊查头颅 CT。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"22","tag1":"通用","tag2":"自己就能做","title":"被开水或热油烫伤后立刻用流动冷水冲洗15到20分钟，绝不涂牙膏酱油","cost":"不花钱，流动冷水冲洗 20 分钟能大幅减轻深层组织热损伤。","plain":"牙膏和酱油不仅没有降温作用，还会把细菌带进破损皮肤、加深感染。到了医院医生还得用刷子把牙膏刷掉，疼上加疼。","benefit":"千万别涂牙膏酱油。第一时间用流动的自来水持续冲洗伤口 15 到 20 分钟降温，再覆盖干净纱布去医院烧伤科。 中华医学会烧伤外科学分会《烧伤现场急救专家共识》明确规定热力烧烫伤现场首要处置为立即脱离热源并用 15 至 25 ℃ 流动清洁冷水持续冲洗 15 至 20 分钟，严禁涂抹牙膏、酱油、草木灰等有色或刺激性物质（全国，现行有效）。","level":"B","source":"中华医学会烧伤外科学分会(2020). 烧伤现场急救专家共识. 中华烧伤杂志","remark":"如果烫伤部位隔着紧身衣服，一边用冷水冲一边用剪刀小心剪开衣物，千万别硬拽撕掉粘连的皮。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"23","tag1":"通用","tag2":"自己就能做","title":"流鼻血时身体前倾低头并持续捏紧鼻翼两侧10分钟，千万别仰头举手","cost":"不花钱，低头捏紧鼻翼 10 分钟九成以上鼻出血都能止住。","plain":"仰头根本止不住鼻血，只会把血咽进胃里刺激呕吐甚至呛进气管。捏紧鼻翼软骨处直接压迫鼻中隔前下方出血点，按足 10 分钟才有效。","benefit":"身体微微前倾低头，用拇指和食指紧紧捏住鼻翼两侧（鼻梁下方软骨处）持续按压 10 分钟不松手。仰头会让血倒流进气管引起呛咳呕吐。 美国耳鼻咽喉头颈外科学会（AAO-HNS）《鼻出血临床实践指南》强烈建议将头前倾并持续捏紧鼻翼软骨处至少 10 至 15 分钟作为一线现场止血动作，禁止仰头（国际临床指南，现行有效）。","level":"B","source":"Tunkel DE 等(2020). Clinical Practice Guideline: Nosebleed (Epistaxis). Otolaryngol Head Neck Surg, 162(1_suppl), S1-S38. https://doi.org/10.1177/0194599819890327","remark":"如果连续规范按压 20 分钟仍血流不止。或同时伴有牙龈出血、皮肤莫名瘀斑，要立刻去医院查血常规和凝血功能。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"24","tag1":"通用","tag2":"自己就能做","title":"遇火灾浓烟时弯腰低姿捂住口鼻走疏散楼梯，绝对不坐普通电梯","cost":"不花钱，每次进商场、电影院和补习班先花 10 秒看一眼绿色安全出口标志。","plain":"火灾中八成以上的遇难者不是被火烧死的，而是吸入有毒高温浓烟窒息倒下的。浓烟往上飘，贴近地面 30 厘米处还有一层稀薄空气可以呼吸。","benefit":"绝对不坐电梯。用湿毛巾或衣物捂住口鼻、压低身体弯腰贴近地面走安全疏散楼梯逃生。若楼道已被浓烟封死则退回有窗户的房间关门堵缝等待救援。 应急管理部《社会消防安全教育培训大纲》明确规定火灾逃生严禁乘坐普通电梯，遇浓烟应低姿匍匐或弯腰捂鼻沿疏散楼梯撤离，门把手发烫切勿盲目开门（全国，现行有效）。","level":"C","source":"应急管理部(2020). 社会消防安全教育培训大纲. https://www.mem.gov.cn","remark":"千万别因为舍不得书包、手机或零花钱折返火场，保住命比什么都值钱。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"25","tag1":"男孩必看","tag2":"自己就能做","title":"激烈冲撞运动中突发阴囊被踢被撞剧痛，立刻屈膝平卧冷敷并观察肿胀排查血肿","cost":"不花一分钱，用毛巾包裹冰袋或冷矿泉水冷敷 15 分钟。","plain":"男生打篮球、踢足球时最容易被球或脚猛烈踢中裆部，疼得站不起来。千万别站着硬撑或用力揉搓！立刻原地屈膝平躺让肌肉放松，拿冷毛巾冷敷减轻肿胀。如果十几分钟后疼痛不减、阴囊肉眼可见肿大发紫发黑，必须立刻去医院挂急诊排查白膜破裂。","benefit":"中华医学会泌尿外科学分会《阴囊闭合性损伤诊疗指南》指出，钝性撞击伤后早期冷敷制动可减少 60% 的深部血肿形成；伴随阴囊进行性肿大青紫提示睾丸白膜破裂，72 小时内早期探查缝合挽救率达 90% 以上（全国临床指南，现行有效）。","level":"B","source":"中华医学会泌尿外科学分会(2022). 泌尿系统损伤诊治指南. 人民卫生出版社","remark":"【直接转给爸妈看】：爸妈，刚才打球被踢中裆部，现在下面肿大发青很疼，得赶紧带我去医院挂急诊外科排查有没有血肿破裂。","parentQuote":"爸妈，刚才打球被踢中裆部，现在下面肿大发青很疼，得赶紧带我去医院挂急诊外科排查有没有血肿破裂。","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"26","tag1":"女孩必看","tag2":"自己就能做","title":"跑步或体测跳绳后突发下腹右下侧撕裂样剧痛伴发热，立刻排查急性阑尾炎","cost":"急诊血常规加腹部超声约 100 至 200 元，医保可报销。","plain":"女孩子体测跑步、跳绳或剧烈活动后，如果肚子先是肚脐周围隐痛，几个小时后转移到“右下腹”固定剧痛，按下去一松手疼得弹起来（反跳痛），千万别当成普通岔气或肠胃炎硬忍！这是中小学生最高发的急腹症急性阑尾炎，拖过 24 小时化脓穿孔会引发弥漫性腹膜炎。","benefit":"中华医学会外科学分会《急性阑尾炎诊治规范》表明，转移性右下腹痛及右下腹麦氏点固定压痛是阑尾炎典型特征；早期抗感染或微创腹腔镜切除并发症极低，拖延至穿孔坏疽发生率高达 25% 至 35%（全国临床指南，现行有效）。","level":"A","source":"中华医学会外科学分会胃肠外科学组(2021). 急性阑尾炎诊断与治疗专家共识. 中华外科杂志","remark":"疼的时候绝对不要用热水袋热敷腹部，热敷会加速炎性阑尾充血坏疽穿孔。 【直接转给爸妈看】：爸妈，我右下腹持续剧痛按压疼得厉害，很像急性阑尾炎，不能再拖了，现在带我去急诊查血常规和腹部B超。","parentQuote":"爸妈，我右下腹持续剧痛按压疼得厉害，很像急性阑尾炎，不能再拖了，现在带我去急诊查血常规和腹部B超。","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"27","tag1":"通用","tag2":"自己就能做","title":"踝关节扭伤（崴脚）后严格执行「POLICE」原则冷敷制动，48小时内绝对严禁热敷揉搓","cost":"不花一分钱，用毛巾包裹冰水混合物或冷矿泉水敷患处。","plain":"体育课或下楼梯崴脚后，很多人喜欢立刻用红花油使劲揉搓、或者拿热水泡脚，这会把皮下破裂的毛细血管彻底冲开，肿得像猪蹄甚至导致韧带二次撕裂。立刻停下走路坐下休息，拿冰毛巾冷敷 15 分钟收缩血管，抬高脚踝高于心脏。","benefit":"英国运动医学杂志（BJSM）软组织损伤最新指南指出，早期（48 小时内）禁止任何形式的过度按摩与热疗，规范冷敷与保护性活动（POLICE 策略）能使外踝韧带完全愈合时间缩短 35%，显著降低习惯性习惯性慢性踝关节不稳发生率（国际临床指南，现行有效）。","level":"A","source":"Bleakley CM 等(2012). Br J Sports Med, 46(4), 220-221. https://doi.org/10.1136/bjsports-2011-090297 ；Dubois B, Esculier JF (2020). Br J Sports Med, 54(2), 72-73.","remark":"如果扭伤后脚踝完全无法负重站立走 4 步、或者外踝骨头有明显压痛，必须去医院拍 X 光片排查骨折。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"28","tag1":"通用","tag2":"找爸妈一起办","title":"被猫狗或野生动物抓伤咬伤，先用肥皂水持续冲洗15分钟、24小时内接种狂犬疫苗","cost":"急诊狂犬病疫苗全程（4针或5针法）约 200 至 400 元，医保按规定报销。","plain":"狂犬病一旦发病，致死率是 100%！被家养或流浪猫狗抓伤咬伤后，哪怕只有一道发红没有流血的轻微抓痕（属于二级暴露），也必须立刻用流动的肥皂水和自来水交替彻底冲洗 15 分钟，并在 24 小时内带上爸妈去狂犬病暴露处置门诊打疫苗。","benefit":"世界卫生组织（WHO）狂犬病专家咨询会技术报告明确指出，受伤后即刻规范伤口冲洗可清除 90% 以上的狂犬病毒；及时全程接种合格狂犬病疫苗，发病预防成功率达 100%（全球公认公卫标准，现行有效）。","level":"A","source":"World Health Organization (WHO)(2018). Rabies vaccines: WHO position paper. https://www.who.int ；国家卫生健康委(2023). 狂犬病暴露预防处置工作规范(2023年版).","remark":"如果伤口流血较深（三级暴露），除了打疫苗，医生还会根据情况在伤口周围注射狂犬病人免疫球蛋白阻断病毒。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"29","tag1":"通用","tag2":"自己就能做","title":"吃鱼被鱼刺卡住喉咙，绝对严禁吞大口米饭或喝醋，立刻咳嗽或用手电镊子夹出","cost":"公立医院耳鼻喉科急诊喉镜取出仅约 50 至 120 元。","plain":"鱼刺卡喉后吞大口饭团、馒头，会把原本卡在扁桃体浅处的细刺硬生生推进更深的食道甚至戳穿食道壁！食道旁边紧挨着人体主动脉大血管，戳穿主动脉会瞬间引发大出血致命。喝醋更没用，食用醋根本软化不了钙化鱼骨，还会灼伤黏膜。","benefit":"中华耳鼻咽喉头颈外科杂志临床统计表明，因吞咽馒头饭团导致食管异物穿孔合并纵隔感染或主动脉破裂大出血的发生率增加 4.8 倍；早期耳鼻喉科内镜夹取成功率达 99.2%（全国临床研究，现行有效）。","level":"A","source":"中华医学会耳鼻咽喉头颈外科学分会(2020). 食管异物急诊处理临床实践指南. 中华耳鼻咽喉头颈外科杂志","remark":"自己张大嘴让家人用手机手电照看扁桃体窝，看见浅表鱼刺用小镊子夹出；深处看不见的立刻去医院耳鼻喉急诊。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"30","tag1":"通用","tag2":"找爸妈一起办","title":"运动摔倒疑似四肢骨折时，原地利用硬纸板或直木棍简易固定制动，严禁随意搬动","cost":"不花一分钱，就地取材固定后等待 120。","plain":"打球摔倒后胳膊或小腿变形弯曲、肿胀剧痛不能动，说明大概率骨折了。千万别硬拉硬拽或者随意背着跑，断骨的锋利尖端会在皮下像刺刀一样割断大血管和神经，把单纯闭合骨折变成大出血或残疾。找两块硬纸板或结实树枝夹在骨折部位两侧用红领巾绑好固定，等急救车。","benefit":"创伤急救骨折固定临床指南证实，未固定前随意搬动使二次神经血管损伤发生率上升 28% 以上；规范夹板临时制动能减少 70% 的转运途中的继发移位与疼痛休克（全国急救临床共识，现行有效）。","level":"B","source":"中华医学会创伤学分会(2019). 创伤早期肢体骨折固定专家共识. 中华创伤杂志","remark":"如果有骨头断端刺破皮肤露在外面（开放性骨折），绝对严禁把露出的骨头推回皮内，用干净毛巾盖住即可。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"31","tag1":"通用","tag2":"自己就能做","title":"盛夏剧烈运动或军训中暑头晕冒冷汗，立刻转移到通风阴凉处平卧解衣补淡盐水","cost":"一瓶常温淡盐水或电解质水约 3 至 5 元。","plain":"夏天军训或体育长跑时，如果突然觉得眼前发黑、四肢无力、面色发白甚至意识模糊，这是中暑先兆。千万别咬牙硬撑防倒地休克！立刻打报告到大树底下或有空调的医务室坐下平躺，解开衬衫领口散热，小口慢喝含电解质的淡盐水降温。","benefit":"国家急诊医学专家共识指出，劳力型热射病早期（体温低于 40℃ 阶段）实施快速体表蒸发降温与体液补充，能 100% 阻断多器官功能障碍综合征（MODS）的发展；拖延至重度热射病死亡率超过 50%（全国临床指南，现行有效）。","level":"A","source":"全军热射病防治专家组(2021). 劳力型热射病现场急救规范. 解放军医学杂志 ；American College of Sports Medicine (ACSM)(2015). Exertional Heat Illness.","remark":"如果体温飙升超过 40℃ 且皮肤干热无汗、胡言乱语昏迷，属于致命热射病，立刻打 120 并用冰水喷洒全身强力风扇降温。","parentQuote":"","fileName":"04-突发急症与外伤急救：这几分钟能保命保器官.md"},{"num":"32","tag1":"通用","tag2":"找爸妈一起办","title":"每年按时缴纳城乡居民基本医疗保险（学生医保），守住大病住院与门诊统筹报销底线","cost":"每年每人约 380 至 400 元（财政同步补助 600 余元）。","plain":"每到秋季开学，学校让交的三四百块钱“学生医保”，一定要让爸妈按时交上！不管是肺炎住院、运动骨折做手术还是阑尾炎开刀，医保统筹基金能直接在医院窗口现场报销 60% 到 80% 以上，是普通家庭抗击因病致贫的最强国家兜底护城河。","benefit":"国家医保局、财政部每年印发《关于做好城乡居民基本医疗保障有关工作的通知》，在校中小学生参保享受门诊统筹、住院费用按比例报销及大病保险二次报销，政策范围内住院报销比例稳定在 70% 左右（全国法规，现行有效）。","level":"A","source":"国家医保局, 财政部(2023). 关于做好2023年城乡居民基本医疗保障有关工作的通知. 医保发〔2023〕24号. https://www.nhsa.gov.cn","remark":"如果在异地读书，记得在“国家医保服务平台”微信小程序办理“异地就医备案”，看病直接联网刷医保码结算。","parentQuote":"","fileName":"05-青春期生病看医生：少花钱少走弯路挂号与医保.md"},{"num":"33","tag1":"通用","tag2":"找爸妈一起办","title":"常见发烧感冒与浅表伤口优先去社区卫生服务中心，免去大医院排队数小时与交叉感染","cost":"社区医院门诊挂号费仅 5 至 10 元，药品零差率且医保报销比例更高。","plain":"普通感冒发烧、咳嗽查血常规、或者换药拆线，千万别大半夜全家冲向三甲大医院急诊排队 4 小时。大医院儿科急诊人挤人全是流感合胞病毒，极易发生二次交叉感染。家门口的社区卫生服务中心不用排队，查血常规几分钟出结果，报销比例还比三甲医院高 15% 到 20%。","benefit":"分级诊疗双向转诊临床实证表明，基层医疗卫生机构处理上呼吸道感染等常见病的平均就诊耗时仅为三级医院的四分之一，且人均门诊费用下降 45% 以上（全国卫生统计，现行有效）。","level":"B","source":"国务院办公厅(2015). 关于推进分级诊疗制度建设的指导意见. 国办发〔2015〕70号. https://www.gov.cn","remark":"如果孩子发高烧超过 39℃ 持续三天不退、或者出现呼吸急促困难、精神萎靡嗜睡，立刻直奔三级医院发热门诊。","parentQuote":"","fileName":"05-青春期生病看医生：少花钱少走弯路挂号与医保.md"},{"num":"34","tag1":"通用","tag2":"找爸妈一起办","title":"遇到突发外伤大出血、剧烈腹痛或抽搐，到医院直接找急诊分诊台护士评级绿色通道","cost":"不花一分钱，急诊预检分诊完全免费。","plain":"孩子如果伤得很重、疼得满地打滚、或者意识模糊，到医院千万别傻傻在普通挂号窗口前排长队！直接冲向急诊大厅门口的“急诊预检分诊台”，告诉护士症状。国家急诊实行红黄绿病情分级：生命体征危急的一级二级病人不用挂号、直接推入抢救室先救命后补交费。","benefit":"国家卫生健康委《急诊病人病情分级试点指导原则》将急诊病人分为 4 级，1 级濒危病人立即启动绿色通道抢救，2 级危重病人救治响应时间严格控制在 10 分钟以内（全国法规，现行有效）。","level":"A","source":"国家卫生计生委(2011). 急诊病人病情分级试点指导原则(征求意见稿). https://www.nhc.gov.cn","remark":"去急诊时带好医保卡和既往就诊病历，一两句话讲清：“什么时候开始疼的、哪个部位最疼、上次吃药或进食是什么时候”。","parentQuote":"","fileName":"05-青春期生病看医生：少花钱少走弯路挂号与医保.md"},{"num":"35","tag1":"通用","tag2":"找爸妈一起办","title":"家里常备基础急救小药箱和防灾应急包，退烧止痛药只备一种防吃重","cost":"全套家庭基础应急医疗与防灾物资约 100 至 200 元，放在全家人都知道的客厅柜子里。","plain":"半夜突然发烧、切菜割伤或停电地震时。家里有一个随手能拿到的应急箱能省去大半夜满大街找药店的麻烦。","benefit":"重点备齐独立包装碘伏棉签、无菌纱布绷带、弹性创可贴、电子体温计、布洛芬/对乙酰氨基酚（只备一种防吃重）、强光手电筒和救生哨。 应急管理部《家庭应急物资储备建议清单》推荐家庭常备基础外伤消毒包扎用品、体温计、常用非处方退热止痛药、强光手电筒、求救哨及重要证件复印件（全国，现行有效）。","level":"C","source":"应急管理部(2020). 家庭应急物资储备建议清单. https://www.mem.gov.cn","remark":"退烧药只备对乙酰氨基酚或布洛芬其中一种即可。千万别把几种复方感冒药混在一起吃导致对乙酰氨基酚过量伤肝。","parentQuote":"","fileName":"06-家里的常备药别吃出事：痛经、退烧与外伤.md"},{"num":"36","tag1":"女孩必看","tag2":"自己就能做","title":"原发性痛经在月经来潮前或刚有隐痛时首选布洛芬，不耐药不成瘾","cost":"普通布洛芬缓释胶囊一盒约 15 至 25 元。","plain":"女孩子每次来例假肚子剧痛、腰酸冒冷汗，主要是子宫在狂冒前列腺素导致肌肉剧烈痉挛。红糖水和热水袋只能起心理安慰作用。布洛芬是非甾体抗炎药，专门抑制前列腺素生成。在刚感觉肚子隐痛时立刻吃一颗，比疼得打滚时再吃效果好十倍，而且一个月吃一两天根本不会成瘾或耐药。","benefit":"Cochrane 系统评价包含 80 项随机对照试验，非甾体抗炎药（NSAIDs，以布洛芬为代表）缓解原发性痛经疼痛的有效率显著优于安慰剂（OR 4.37, 95% CI 3.76–5.09），是国际妇产科联盟首推一线用药（国际 RCT 荟萃，现行有效）。","level":"A","source":"Bofill Rodriguez M 等(2020). Cochrane Database Syst Rev, 1(1), CD001751. https://doi.org/10.1002/14651858.CD001751.pub4 ；中华医学会妇产科学分会(2020). 原发性痛经诊疗规范.","remark":"布洛芬对胃黏膜有轻微刺激，建议饭后服用；有胃溃疡或严重哮喘史者禁用。","parentQuote":"","fileName":"06-家里的常备药别吃出事：痛经、退烧与外伤.md"},{"num":"37","tag1":"通用","tag2":"找爸妈一起办","title":"出现皮肤割伤或踩到生锈铁钉，24小时内必须去急诊规范注射破伤风疫苗或被动免疫制剂","cost":"破伤风疫苗（类毒素）或破伤风人免疫球蛋白（HTIG）约 20 至 120 元，医保可报销。","plain":"青少年在室外打球、骑车摔伤擦破皮，特别是被泥土里生锈的铁钉、铁丝扎进肉里（窄而深的伤口），破伤风梭菌最喜欢这种没有氧气的环境。破伤风发病后死亡率极高。受伤后先用肥皂水和双氧水彻底冲洗，24 小时内带上小时候的疫苗接种本去医院急诊让医生评估打针。","benefit":"国家卫健委《非新生儿破伤风诊疗规范》指出，破伤风梭菌芽孢广泛存在于泥土与铁锈中；规范进行创口彻底清创，并根据既往全程免疫史规范补充破伤风类毒素或破伤风人免疫球蛋白，可使破伤风发病风险降低 95% 以上（全国，现行有效）。","level":"A","source":"国家卫生健康委办公厅(2019). 非新生儿破伤风诊疗规范(2019年版). https://www.nhc.gov.cn ；World Health Organization (WHO)(2017). Tetanus vaccines: WHO position paper.","remark":"小时候按国家免疫规划打满百白破疫苗（最后一针通常在 6 岁）的青少年，体内抗体能维持 5 到 10 年，通常只需补打一针破伤风疫苗加强针即可，不必盲目注射容易过敏的马血清破伤风抗毒素（TAT）。","parentQuote":"","fileName":"06-家里的常备药别吃出事：痛经、退烧与外伤.md"},{"num":"38","tag1":"通用","tag2":"找爸妈一起办","title":"满16岁带父母自查乙肝两对半抗体，抗体滴度低于10IU/L及时在社区医院补打一针乙肝加强针","cost":"社区卫生服务中心乙肝表面抗体检测加疫苗接种约 30 至 70 元。","plain":"中国绝大部分 10 多岁的孩子在出生时都打过国家免费的乙肝疫苗，但过了 10 到 15 年，很多人体内的抗体保护浓度会慢慢下降甚至消失。如果常在外面餐馆吃饭、去不规范的店打耳洞，一旦抗体没了就有感染风险。抽血查一次乙肝抗体，发现抗体低了花几十块补打一针加强针，保终身肝脏平安。","benefit":"中华医学会肝病学分会《慢性乙型肝炎防治指南》指出，乙肝疫苗全程接种后 10 至 15 年部分人群抗体可降至保护水平（10 mIU/mL）以下；补种加强针后 90% 以上可迅速诱导二次免疫应答，长期阻断乙肝病毒慢性感染及远期肝硬化、肝癌风险（全国临床指南，现行有效）。","level":"A","source":"中华医学会肝病学分会(2022). 慢性乙型肝炎防治指南(2022年版). 中华肝脏病杂志, 30(12), 1309-1331. https://doi.org/10.3760/cma.j.cn501113-20221204-00607","remark":"【直接转给爸妈看】：爸妈，小时候打的乙肝疫苗过了十几年抗体可能失效了，带我去社区医院花几十块查一下乙肝表面抗体，没有抗体就补打一针加强针。","parentQuote":"爸妈，小时候打的乙肝疫苗过了十几年抗体可能失效了，带我去社区医院花几十块查一下乙肝表面抗体，没有抗体就补打一针加强针。","fileName":"06-家里的常备药别吃出事：痛经、退烧与外伤.md"},{"num":"39","tag1":"通用","tag2":"自己就能做","title":"脸上长青春痘（痤疮）严禁手挤手抠，遵医嘱首选外用过氧苯甲酰与阿达帕林凝胶","cost":"正规非处方药阿达帕林或过氧苯甲酰凝胶每支约 20 至 40 元。","plain":"青春期长红肿痘痘，手欠去挤最容易留下终身消不掉的凹陷性痘坑和发黑痘印。特别是鼻梁和嘴角两侧的“面部危险三角区”，静脉直接通向颅内海绵窦，暴力挤痘会导致金黄色葡萄球菌逆行入脑诱发致命化脓性脑膜炎。睡前点涂阿达帕林或过氧苯甲酰，溶解角栓消炎杀菌，安全有效。","benefit":"中华医学会皮肤性病学分会《中国痤疮治疗指南》明确指出，局部外用维 A 酸类药物（如阿达帕林）和过氧苯甲酰是轻中度痤疮的一线首选用药，有效改善率达 70% 以上，严禁机械挤压面部危险三角区（全国指南，现行有效）。","level":"A","source":"中国痤疮治疗指南专家组(2019). 中国痤疮治疗指南(2019修订版). 临床皮肤科杂志, 48(9), 583-588. ；Zaenglein AL 等(2016). J Am Acad Dermatol, 74(5), 945-973.","remark":"维 A 酸类药物具有轻度刺激性和光敏感性，刚开始用需少量建立耐受，且必须在晚上熄灯前避光涂抹。","parentQuote":"","fileName":"06-家里的常备药别吃出事：痛经、退烧与外伤.md"},{"num":"40","tag1":"女孩必看","tag2":"找爸妈一起办","title":"13至14周岁尽早接种两剂次HPV疫苗，多地实行国家免费接种项目","cost":"全国绝大多数省份对初二在校适龄女生免费提供国产双价 HPV 疫苗；自费二价约 300 至 600 元。","plain":"宫颈癌是人类目前唯一能通过打疫苗彻底消灭的癌症。在初次性生活前（世界卫生组织首推 9 到 14 岁）打上疫苗保护率最高。不用盲目排队抢昂贵的九价，二价疫苗就能覆盖最致命的 16、18 型病毒（占我国宫颈癌的 84% 以上）。","benefit":"NEJM 瑞典 167 万女性大型队列研究证实，17 岁前接种 HPV 疫苗使侵袭性宫颈癌发病风险大幅下降 88%（IRR 0.12, 95% CI 0.05–0.34）。国家卫健委等十部门《加速消除宫颈癌行动计划（2023—2030年）》要求大力推广适龄女孩首针免费接种（全国，现行有效）。","level":"A","source":"Lei J 等(2020). N Engl J Med, 383(14), 1340-1348. https://doi.org/10.1056/NEJMoa1917338 ；国家卫生健康委等十部门(2023). 加速消除宫颈癌行动计划(2023—2030年). https://www.nhc.gov.cn","remark":"9—14 岁接种二价只需打 2 针（间隔 6 个月），免疫应答强度远高于 15 岁以上打 3 针。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"41","tag1":"女孩必看","tag2":"自己就能做","title":"经期每2到4小时必须更换卫生巾，严禁垫护垫超过半天防细菌逆行感染","cost":"每周期卫生巾花费约 15 至 30 元。","plain":"经血富含营养物质，卫生巾在温热密闭的内裤里超过 2 小时就会变成细菌培养皿。别因为血量少就一片垫一整天，潮湿闷热的环境极易导致外阴瘙痒红肿和逆行性尿道炎、阴道炎。","benefit":"流行病学调查证实，经期更换卫生用品间隔超过 4 小时是生殖道微生态失衡、厌氧菌过量繁殖与上行尿路感染的独立危险因素（OR 2.45, 95% CI 1.34–4.48）（全国临床研究，现行有效）。","level":"B","source":"中华预防医学会妇女保健分会(2021). 女性生殖健康与经期卫生指导规范.","remark":"选无香精、无薄荷脑刺激成分、国标 GB/T 8939 认证的正规品牌日用/夜用卫生巾即可。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"42","tag1":"女孩必看","tag2":"自己就能做","title":"日常私处仅用清水清洗外阴，绝不冲洗阴道内部与使用洗液","cost":"不花一分钱，停止购买任何“妇科私处护理液”。","plain":"女性阴道内天然寄生着大量乳杆菌，形成弱酸性自洁保护屏障。每天洗澡用温自来水轻轻洗洗大阴唇外表面就行，千万不要用药水或沐浴露灌洗阴道里面。市面上的私处洗液会把好菌全部杀死，破坏微生态，反而越洗越痒、反复得阴道炎。","benefit":"美国疾控中心（CDC）及妇产科医师学会（ACOG）指南强烈反对阴道冲洗，冲洗使细菌性阴道病发病风险增加 73%，盆腔炎风险增加 1.7 倍（国际共识，现行有效）。","level":"A","source":"American College of Obstetricians and Gynecologists (ACOG)(2020). Vaginitis in Nonpregnant Patients. ACOG Practice Bulletin No. 215. https://www.acog.org","remark":"日常穿透气纯棉内裤，内裤每日一换并单独清洗晾晒通风处。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"43","tag1":"女孩必看","tag2":"找爸妈一起办","title":"满15岁从未初潮或月经周期长期超过60天伴面部多毛痤疮，排查多囊卵巢综合征","cost":"公立医院妇科性激素六项检查加经腹部妇科 B 超约 200 至 350 元。","plain":"初潮后一两年内月经周期偶尔不准是正常的。但如果到了 15 岁还没来过例假，或者月经两三个月才来一次，同时脸上痤疮特别严重、唇周有浓黑小胡子、体重猛涨，这往往是内分泌多囊卵巢综合征（PCOS）在作怪，及早调理能避免影响以后代谢与生育。","benefit":"中华医学会妇产科学分会《多囊卵巢综合征诊治指南》指出青春期 PCOS 早期生活方式干预和孕激素周期调节可预防子宫内膜异常增生与远期 2 型糖尿病发生（全国，现行有效）。","level":"B","source":"中华医学会妇产科学分会内分泌学组(2018). 多囊卵巢综合征中国诊疗指南. 中华妇产科杂志, 53(1), 2-6.","remark":"未成年女生做妇科 B 超必须做憋尿经腹部超声，绝对不要做经阴道超声。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"44","tag1":"男孩必看","tag2":"找爸妈一起办","title":"正确区分生理性包茎与病理性包茎，绝不盲目去私立男科医院割包皮","cost":"公立三甲医院小儿外科/泌尿外科门诊挂号仅 15 至 30 元；私立莆田系男科医院常以激光环切套路收费数千上万元。","plain":"青春期男孩大部分包皮都能慢慢向上翻起露出龟头，只要平时能翻开清洗、尿尿不鼓泡、没有反复发红流脓感染，就属于正常生理状态，根本不用挨一刀。千万别信路边或网上无良男科医院的恐吓广告。","benefit":"中华医学会小儿外科学分会专家共识指出，单纯包皮过长且能正常上翻清洁者无手术指征；仅当出现瘢痕性包茎、反复包皮龟头炎或嵌顿包茎时方需手术，必须在正规公立医院就诊（全国，现行有效）。","level":"B","source":"中华医学会小儿外科学分会泌尿外科学组(2021). 儿童包茎及包皮过长临床诊疗专家共识. 中华小儿外科杂志, 42(5), 385-391.","remark":"每天洗澡时轻轻把包皮往后翻，用温水把包皮垢冲洗干净再推回原位。千万别强行猛翻导致包皮嵌顿卡死。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"45","tag1":"男孩必看","tag2":"自己就能做","title":"青春期遗精与晨勃是正常生理减压，不必产生任何道德羞耻感与焦虑","cost":"不花一分钱，早晨换洗内裤只需 2 分钟。","plain":"俗话说「精满自溢」，男生到了 12 到 16 岁睾丸开始产生精子和雄激素，半夜做梦遗精或早晨憋尿晨勃是生殖系统发育健康的铁证。它既不会伤元气也不会影响大脑智力，把脏内裤换洗干净即可，不必心里有任何罪恶感。","benefit":"现代临床医学与心理学早已证实遗精与手淫是青春期正常性心理生理发育表现，传统“一滴精十滴血”“手淫丧命”纯属反科学谣言。过度自责焦虑导致的抑郁失眠危害远超生理行为本身（全国医学共识，现行有效）。","level":"C","source":"中国性学会(2019). 青少年性健康与生殖教育专家建议.","remark":"内裤选宽松纯棉平角裤，避免被子盖得过厚过沉压迫下腹部。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"46","tag1":"男孩必看","tag2":"找爸妈一起办","title":"男生也应在有条件时尽早接种四价/九价HPV疫苗，防生殖器疣与肛门癌","cost":"自费接种 3 剂次约 2400 至 3900 元（部分地区开放男性接种试点）。","plain":"很多人以为 HPV 病毒只有女孩才需要防，其实男生也是主要感染者和传播者。HPV 病毒会导致男生长尖锐湿疣（菜花状尖锐赘生物）和阴茎癌、肛门癌。男生打疫苗既是保护自己不得性病，也是保护未来的另一半。","benefit":"Giuliano 等 2011 年《NEJM》临床试验显示四价 HPV 疫苗对男性外生殖器病变（尖锐湿疣等）的保护效力达 90.4%（95% CI 69.2%–98.1%）。国际公认男女全人群接种是阻断病毒群体传播的最优路径（国际 RCT，现行有效）。","level":"A","source":"Giuliano AR 等(2011). N Engl J Med, 364(5), 401-411. https://doi.org/10.1056/NEJMoa0909537","remark":"国内正逐步批准扩展男性接种适应症，若有条件可前往合规社区卫生服务中心或疾控门诊咨询预约。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"47","tag1":"通用","tag2":"自己就能做","title":"掌握正确的男女如厕擦拭方向与坐姿，从前往后擦阻断肠道菌逆行感染","cost":"不花一分钱，只需在洗手间改变一个擦拭动作习惯。","plain":"大便后擦屁股一定要「从前往后」擦，绝对不能从后往前擦。肛门周围有数以百亿计的大肠杆菌，从后往前擦会把粪便细菌直接抹到尿道口和阴道口，这是中小学生反复尿频尿急尿痛尿路感染的首要元凶。","benefit":"临床流行病学研究证实，排便后从后向前擦拭使女性泌尿道感染（UTI）发生风险激增 3.2 倍，养成从前向后擦拭习惯可预防大部分逆行性肾盂肾炎和膀胱炎（国际临床研究，现行有效）。","level":"B","source":"Foxman B (2014). Nat Rev Urol, 11(12), 713-721. https://doi.org/10.1038/nrurol.2014.282","remark":"使用质地柔软的卫生纸，擦拭时动作轻柔避免擦破黏膜。有条件时如厕后可用温水冲洗或湿厕纸轻拭。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"48","tag1":"男孩必看","tag2":"自己就能做","title":"变声期严禁扯着嗓子大喊大叫与盲目飚高音，多喝常温水防声带充血长息肉","cost":"不花一分钱，保护嗓子多喝白开水。","plain":"男生在 13 到 16 岁会经历变声期，喉结突出发育、声带迅速变长变厚变充血，说话声音发粗嘶哑甚至容易跑调。这是喉部软骨快速骨化的敏感窗口。如果这个时候在操场狂吼、在 KTV 扯嗓子狂飚高音，极其容易震破充血声带黏膜，长出声带小结或息肉，以后说话嗓音会变成终身破锣嗓子。","benefit":"中华耳鼻咽喉头颈外科喉科学组指南指出，变声期过度用嗓导致的慢性喉炎和声带小结在青少年男性中占 62% 以上；变声期发声休息和避免用力挤压发音可使声带平稳过渡到成年男性基频（全国临床共识，现行有效）。","level":"B","source":"中华医学会耳鼻咽喉头颈外科学分会咽喉学组(2021). 嗓音疾病诊疗规范.","remark":"变声期少喝冰镇可乐、少吃重辣油炸刺激食物，体育课大声喊口令时用腹部丹田发力，不要硬用嗓子眼嚎叫。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"49","tag1":"女孩必看","tag2":"找爸妈一起办","title":"随着乳房萌发进入 Tanner II-III 期，尽早更换无钢圈透气少女发育内衣","cost":"纯棉无钢圈少女文胸一件约 30 至 60 元。","plain":"女孩子 10 到 12 岁左右乳房开始萌发隆起，很多女生因为害羞驼背含胸、甚至穿紧身背心用力勒胸部。过紧的束缚会压迫正在发育的乳腺腺泡和导管组织，不仅影响乳头正常凸出，还会压迫肋骨和胸廓发育。让妈妈买透气纯棉、无钢圈压迫的少女背心或发育文胸，大方挺胸站直才是最健康的体态。","benefit":"儿童青少年生长发育临床指南表明，含胸束胸是青春期女孩胸部血液回流受阻、乳头内陷与轻度脊柱胸椎后凸的独立危险因素；规范佩戴合适支撑力无压迫文胸有助于乳腺自然塑形与胸廓扩张（全国临床指南，现行有效）。","level":"B","source":"中华预防医学会妇女保健分会(2020). 女童与青春期女孩乳房健康与保健指南.","remark":"【直接转给爸妈看】：妈妈，我现在胸部开始发育有点疼了，老师和医生说不能穿紧背心勒胸会影响腺体发育，带我去买两件透气无钢圈的发育内衣。","parentQuote":"妈妈，我现在胸部开始发育有点疼了，老师和医生说不能穿紧背心勒胸会影响腺体发育，带我去买两件透气无钢圈的发育内衣。","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"50","tag1":"通用","tag2":"找爸妈一起办","title":"青春期腋下异味（狐臭/腋臭）不要自卑，公立皮肤科黄金微针或微创射频几十分钟彻底解决","cost":"日常止汗露几十元；公立三甲医院皮肤科/整形外科微创黄金微针射频约 2000 至 4000 元。","plain":"青春期性激素飙升，腋窝下的大汗腺（顶泌汗腺）开始旺盛分泌，被皮肤表面细菌分解后散发出特殊气味。很多孩子因此被同学嘲笑排挤、自卑抑郁。这完全是遗传和大汗腺发育问题，根本不是什么不讲卫生！勤洗澡、用普通含铝盐止汗露就能压住大部分气味；高中毕业后在公立医院花半小时做个微创射频把大汗腺破坏掉就能彻底根治。","benefit":"中华医学会整形外科学分会专家共识指出，微创大汗腺破坏术（射频消融或黄金微针）治疗腋臭临床治愈率达 90% 以上，创伤小不留大瘢痕，显著改善青少年社交自尊心（全国临床指南，现行有效）。","level":"B","source":"中华医学会整形外科学分会(2021). 腋臭微创诊疗专家共识. 中华整形外科杂志","remark":"千万别去路边无资质电线杆小诊所做开刀大切口手术，容易造成腋下大面积疤痕挛缩导致手臂抬不起来。","parentQuote":"","fileName":"07-青春期身体发育：男孩女孩两性卫生与隐私解惑.md"},{"num":"51","tag1":"通用","tag2":"找爸妈一起办","title":"严禁网购DIY自助牙套与夜市美牙，牙齿正畸必须去公立口腔医院拍片评估","cost":"网购劣质牙套几十元（后果是全口牙根吸收脱落，修复需数万元）；公立医院金属托槽正畸约 8000 至 1.8 万元。","plain":"牙齿是长在牙槽骨里的活体器官，移动一毫米都需要精准计算牙根受力和骨改建速度。网购塑料牙套自己套在牙上硬扳，会导致牙齿缺血坏死、牙槽骨严重吸收，不到 20 岁牙齿就会像老年人一样松动连根脱落。","benefit":"中华口腔医学会《关于坚决抵制非法医疗美容口腔诊疗行为的声明》指出，正畸属于高度专业化医疗行为，缺乏 X 线头影测量与骨量评估的 DIY 正畸致残率极高，严重违反国家医疗规范（全国，现行有效）。","level":"A","source":"中华口腔医学会(2021). 关于坚决抵制口腔医疗美容非法行医的声明. ；American Association of Orthodontists (AAO)(2019). Direct-to-Consumer Orthodontic Treatment Warning.","remark":"女孩 10—12 岁、男孩 11—13 岁是替牙期和错颌畸形黄金干预期，需在正规医院拍曲面体层片和侧位片。","parentQuote":"","fileName":"08-别为了外貌把身体搞坏：拒碰类固醇、催吐与非法微整.md"},{"num":"52","tag1":"男孩必看","tag2":"自己就能做","title":"坚决拒碰合成代谢类固醇增肌药与地下萨姆（SARMs），防睾丸萎缩与不可逆肝损","cost":"购买地下类固醇每月数百至数千元，带来的是永久性终身内分泌衰竭与透析代价。","plain":"短视频里很多所谓“高中生肌肉巨兽”，背后充斥着偷打类固醇、吃萨姆药剂的黑幕。外源雄激素进入青春期男孩体内，下丘脑和睾丸会认为体内雄激素过剩而彻底“罢工闭环”，直接导致睾丸萎缩坏死、长出女性化乳房、重度痤疮脓包，甚至急性肝衰竭猝死。","benefit":"Pope 等 2014 年《Lancet Diabetes Endocrinol》综述证实，青少年使用合成代谢雄激素类固醇（AAS）可致下丘脑-垂体-性腺轴（HPG 轴）永久抑制、左心室肥厚及心源性猝死，心血管死亡相对风险增加 3 至 5 倍（国际综述，现行有效）。","level":"A","source":"Pope HG Jr 等(2014). Lancet Diabetes Endocrinol, 2(6), 491-500. https://doi.org/10.1016/S2213-8587(13)70122-2 ；国家体育总局等五部委(2024). 反兴奋剂条例与兴奋剂目录.","remark":"青少年增肌只需保证每天充足鸡蛋牛奶牛肉蛋白质，配合规律俯卧撑引体向上自重深蹲训练，绝对不需要碰任何药剂。","parentQuote":"","fileName":"08-别为了外貌把身体搞坏：拒碰类固醇、催吐与非法微整.md"},{"num":"53","tag1":"女孩必看","tag2":"自己就能做","title":"警惕西布曲明非法减肥药与催吐暴食，极端节食致重度神经性厌食症死亡率极高","cost":"不花一分钱，停止催吐，拒绝任何宣称“月瘦 20 斤”的网红减肥茶/小粉丸。","plain":"网上私下兜售的减肥咖啡、瘦身小丸子很多非法添加了早已被国家禁用的禁药“西布曲明”，吃了会心慌失眠头晕甚至脑中风猝死。催吐（用手指抠喉咙或插管吐）会用胃酸严重腐蚀食道和门牙，导致低血钾诱发心脏骤停。","benefit":"西布曲明因显著增加严重心脑血管事件风险（SCOUT 试验，HR 1.16, 95% CI 1.03–1.31）已被全球撤市及我国最高检列入打击涉药犯罪重点。神经性厌食症是所有精神障碍中致死率最高的疾病之一，死亡率达正常同龄人的 5.9 倍（国际 RCT 与流行病学数据，现行有效）。","level":"A","source":"James WP 等(2010). N Engl J Med, 363(10), 905-917. https://doi.org/10.1056/NEJMoa1003114 ；Arcelus J 等(2011). Arch Gen Psychiatry, 68(7), 724-731. https://doi.org/10.1001/archgenpsychiatry.2011.74 ；最高人民检察院(2021). 依法惩治生产销售添加西布曲明等有毒有害食品犯罪典型案例.","remark":"体重指数 BMI 在 18.5 至 23.9 之间都是完全健康的，青春期千万不要盲目追求“白幼瘦”。","parentQuote":"","fileName":"08-别为了外貌把身体搞坏：拒碰类固醇、催吐与非法微整.md"},{"num":"54","tag1":"通用","tag2":"找爸妈一起办","title":"未满18岁严禁文身与做医疗美容注射，避免被合法剥夺参军考公资格及面部坏死","cost":"文身几百元，激光洗文身需数千元且留下永久瘢痕；非法医美注射毁容终身无法修复。","plain":"我国法律严禁任何机构向未成年人提供文身服务！一旦文身，高考报考警校、军校、征兵入伍或报考公务员政审时会直接被一票否决淘汰。此外，美容院私下给未成年人打水光针、玻尿酸属于非法行医，打进面部血管会导致皮肤大面积坏死甚至单眼失明。","benefit":"国务院未成年人保护工作领导小组《未成年人纹身治理工作办法》明确规定任何单位和个人不得向未成年人提供纹身服务。《应征公民体格检查标准》明确面颈部纹身着短装身体裸露部位纹身直接判定为体检不合格（全国法规，现行有效）。","level":"A","source":"国务院未成年人保护工作领导小组(2022). 未成年人纹身治理工作办法. 国未保发〔2022〕2号. https://www.gov.cn ；国防部征兵办公室(2020). 应征公民体格检查标准.","remark":"【直接转给爸妈看】：爸妈，法律明令禁止未成年人文身和医美，文身哪怕巴掌大也会彻底断送当兵、考警校和考公政审资格，洗文身疼十倍还要留大疤。","parentQuote":"爸妈，法律明令禁止未成年人文身和医美，文身哪怕巴掌大也会彻底断送当兵、考警校和考公政审资格，洗文身疼十倍还要留大疤。","fileName":"08-别为了外貌把身体搞坏：拒碰类固醇、催吐与非法微整.md"},{"num":"55","tag1":"通用","tag2":"自己就能做","title":"严禁从地摊或无资质网店购买隐形眼镜与彩色美瞳，防阿米巴原虫角膜穿孔","cost":"购买正规三类医疗器械资质镜片，或坚持佩戴框架眼镜（性价比最高）。","plain":"隐形眼镜和彩色美瞳属于国家第三类医疗器械（与心脏支架同级别最高监管等级）。网上十几块钱包邮的杂牌美瞳色素层直接裸露在镜面，戴上后极易磨烂角膜，一旦感染棘阿米巴原虫或绿脓杆菌，短短几天就会角膜溃烂穿孔造成终身失明。","benefit":"国家药监局明令禁止未取得医疗器械经营许可证的机构和个人销售彩色平光隐形眼镜。规范佩戴合格镜片并严格消毒可将感染性角膜炎风险降低 80% 以上（全国法规，现行有效）。","level":"A","source":"国家药品监督管理局(NMPA)(2022). 关于进一步加强医疗器械网络销售监管的通知. https://www.nmpa.gov.cn ；Stapleton F 等(2012). Ophthalmology, 119(8), 1516-1521.","remark":"戴隐形眼镜绝不能戴着过夜睡觉，洗澡或游泳时必须摘下，镜盒每 3 个月必须更换一次。","parentQuote":"","fileName":"08-别为了外貌把身体搞坏：拒碰类固醇、催吐与非法微整.md"},{"num":"56","tag1":"通用","tag2":"自己就能做","title":"守住每天8到9小时睡眠底线，深度睡眠期是生长激素分泌高峰","cost":"不花钱，晚上不熬夜刷手机、按时关灯睡觉。","plain":"促使你长高的生长激素主要在夜间深睡眠状态下脉冲式分泌，半夜 11 点到凌晨 1 点分泌量占全天一半以上。熬夜少睡不仅长不高，大脑还会积聚代谢废物导致第二天注意力涣散。","benefit":"大样本队列研究表明，青少年每晚睡眠少于 7 小时者，超重肥胖风险增加 40%，抑郁焦虑发生率上升 60%，且认知记忆测试成绩明显下滑。美国国家睡眠基金会（NSF）推荐 6—13 岁儿童每日睡眠 9—11 小时，14—17 岁青少年每日 8—10 小时（国际共识，现行有效）。","level":"A","source":"Hirshkowitz M 等(2015). Sleep Health, 1(1), 40-43. https://doi.org/10.1016/j.sleh.2014.12.010 ；教育部(2021). 关于进一步加强中小学生睡眠管理工作的通知. https://www.moe.gov.cn","remark":"初中生就寝时间不晚于 22:00，高中生不晚于 23:00。睡前 1 小时严禁打游戏或看刺激性短视频。","parentQuote":"","fileName":"09-把觉睡足：青春期睡眠底线与生长激素.md"},{"num":"57","tag1":"通用","tag2":"自己就能做","title":"睡前1小时不把手机带进卧室，彻底阻断屏幕蓝光抑制褪黑素分泌","cost":"买一个普通机械闹钟约 15 元，手机充电插座设在客厅。","plain":"手机屏幕发出的蓝光会直接刺激视网膜，骗大脑以为还是白天，抑制助眠的褪黑素分泌长达 2 小时以上。把手机留在客厅，买个小闹钟叫起床，入睡速度能快半小时。","benefit":"Chang 等 2015 年《PNAS》随机对照研究显示，睡前看发光电子屏使褪黑素分泌水平下降 55%，入睡潜伏期平均延长 30 分钟，次日早晨警觉度显著下降（国际 RCT，现行有效）。","level":"A","source":"Chang AM 等(2015). Proc Natl Acad Sci U S A, 112(4), 1232-1237. https://doi.org/10.1073/pnas.1419760112","remark":"如果必须用电脑查学习资料，把显示器调成暖色夜间模式，并保证室内顶灯处于开启状态。","parentQuote":"","fileName":"09-把觉睡足：青春期睡眠底线与生长激素.md"},{"num":"58","tag1":"通用","tag2":"自己就能做","title":"每天保证饮用纯净白开水1500毫升，坚决拒绝含糖奶茶与高咖啡因能量饮料","cost":"自带保温杯打学校开水不花一分钱；每天喝奶茶能量饮料一年消耗上千元且暗藏高糖高嘌呤。","plain":"市面上的一杯网红奶茶含糖量相当于 12 块方糖，红牛、魔爪等功能性饮料一罐含咖啡因高达上百毫克。喝这些不仅会让你下午心慌手抖、夜间失眠，高果糖浆进入体内在肝脏代谢还会迅速变成脂肪肝和尿酸，现在初高中生患痛风、肾结石甚至 2 型糖尿病的病例暴增，多喝温开水才是滋养大脑神经细胞的最优解。","benefit":"中国居民膳食指南（2022）明确推荐 10—17 岁青少年每日足量饮水 1500 至 1700 毫升，严格控制含糖饮料摄入。大规模前瞻性队列研究证实，每天饮用含糖饮料超过 1 份使青少年脂肪肝与 2 型糖尿病发病风险增加 26%（A 级队列研究，现行有效）。","level":"A","source":"中国营养学会(2022). 中国居民膳食指南(2022). 人民卫生出版社 ；Malik VS 等(2010). Diabetes Care, 33(11), 2477-2483. https://doi.org/10.2337/dc10-1079","remark":"如果在学校水杯里的水没味道，可以扔两片柠檬片或菊花薄荷叶泡水喝，提神又零卡路里。","parentQuote":"","fileName":"09-把觉睡足：青春期睡眠底线与生长激素.md"},{"num":"59","tag1":"通用","tag2":"自己就能做","title":"用主动回忆自测代替反复看书画荧光笔，提取练习让长时记忆留存率翻倍","cost":"不花一分钱，拿一张白纸或遮挡卡盖住课本答案。","plain":"很多人拿荧光笔把课本画得花花绿绿、翻来覆去重读好几遍，这叫「熟练度幻觉」——看的时候觉得全懂了，合上书考试脑子一片空白。合上书在白纸上默写关键公式、考点框架，逼大脑去主动检索提取，这种“烧脑”的过程才是记忆真正固化的时刻。","benefit":"Karpicke \u0026 Roediger 2008 年《Science》经典随机试验显示，进行提取自测练习的学生一周后记忆保持率为 80%，而反复重读组仅为 34%（效应量 d=1.50）。主动提取是认知心理学公认最高效的学习策略（国际 RCT，现行有效）。","level":"A","source":"Karpicke JD, Roediger HL 3rd (2008). Science, 319(5865), 966-968. https://doi.org/10.1126/science.1152408 ；Dunlosky J 等(2013). Psychol Sci Public Interest, 14(1), 4-58. https://doi.org/10.1177/1529100612453266","remark":"每读完一节教材，花 3 分钟合上书问自己：这一节核心讲了哪三个点？逻辑推导过程是什么？","parentQuote":"","fileName":"10-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"60","tag1":"通用","tag2":"自己就能做","title":"运用艾宾浩斯间隔重复背诵与刷题，拒绝考前单次突击熬夜死记硬背","cost":"不花钱，使用普通纸质错题卡或开源免费工具 Anki。","plain":"连续花 5 个小时猛背单词，不如把这 5 个小时拆成 5 天、每天花 1 小时复习。在刚要遗忘的时间节点（第 1 天、第 2 天、第 4 天、第 7 天、第 15 天）重新复习一遍，能把知识点从脆弱的短期记忆直接锁死在长期记忆区。","benefit":"Cepeda 等 2008 年关于间隔效应（Spacing Effect）的元分析证实，相同学习总时长下，采用分散间隔复习比集中单次突击在长期保留测试中的成绩提升 20% 到 40%（国际元分析，现行有效）。","level":"A","source":"Cepeda NJ 等(2008). Psychol Bull, 134(4), 587-608. https://doi.org/10.1037/0033-2909.134.4.587","remark":"理科错题不要抄完题目就扔一边，必须按照 1-3-7 天的节奏遮住答案在草稿纸上重做一遍。","parentQuote":"","fileName":"10-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"61","tag1":"通用","tag2":"自己就能做","title":"设定「如果……那么……」执行意图，一秒击碎放学回家拖延症","cost":"每天早上用便签纸写下一句话，耗时 30 秒。","plain":"光在心里想“我今晚一定要好好写作业”通常都会以躺在沙发刷手机告终。大脑喜欢明确的条件反射。写下具体指令：“如果我晚上 6:30 吃完晚饭放下筷子，那么我立刻走进书房坐下翻开数学作业本第一页”。当具体情境出现时，行为会自动被触发。","benefit":"Gollwitzer \u0026 Sheeran 2006 年对 94 项独立研究的元分析（涉及 8000 多名参与者）显示，制定执行意图（Implementation Intentions）对目标达成的平均效应量达到中到大效应（d=0.65），能使拖延行为减少一半以上（国际元分析，现行有效）。","level":"A","source":"Gollwitzer PM, Sheeran P (2006). Adv Exp Soc Psychol, 38, 69-119. https://doi.org/10.1016/S0065-2601(06)38002-1","remark":"目标指令一定要清晰到“物理动作”，不能写“那么我开始努力”，要写“翻开书本拿起黑色水笔”。","parentQuote":"","fileName":"10-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"62","tag1":"通用","tag2":"自己就能做","title":"运用费曼技巧假装向小学三年级学生讲课，精准照出知识盲区与逻辑断层","cost":"不花一分钱，对着白墙、小玩具或同桌开口讲。","plain":"检验你是不是真正搞懂一个复杂概念（比如光合作用或楞次定律）的最简单方法：试着用最通俗白话的大白话，讲给一个完全不懂专业名词的小学生听。什么时候你在讲解中卡壳了、或者不得不搬出晦涩的术语敷衍过去，那个卡壳的地方就是你根本没吃透的致命漏洞。","benefit":"学习金字塔模型及同伴教学效应研究证实，“向他人教授/即时应用”知识的记忆平均留存率高达 90%，远高于纯听讲（5%）和纯阅读（10%）（国际教育心理学研究，现行有效）。","level":"B","source":"Fiorella L, Mayer RE (2013). Contemp Educ Psychol, 38(4), 281-288. https://doi.org/10.1016/j.cedpsych.2013.06.001","remark":"结成互助学习小组，每人轮流当小老师给对方讲解经典错题，双方提分速度都极快。","parentQuote":"","fileName":"10-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"63","tag1":"通用","tag2":"自己就能做","title":"建立错题本只摘抄核心卡点与题眼本质，绝不做低水平机械抄题手工活","cost":"剪刀、胶棒或直接在原试卷上做醒目标记，严禁用漂亮笔迹机械抄题干。","plain":"很多同学花两个小时拿彩笔把错题题目一字不差抄在昂贵笔记本上，字迹工整美观，这是最具有欺骗性的“假努力”。错题本的核心不是题目，而是你当时为什么卡住的那句话——只记“题眼逻辑盲区”和“破题第一步切入点”，省下时间多做巩固。","benefit":"元认知监控研究显示，深入分析错误成因归因策略的学生，其数学与科学学业进步速率显著高于单纯记录正确解法的对照组（p\u003c0.001）（全国教育实证研究，现行有效）。","level":"B","source":"Roebers CM 等(2014). Metacognition Learn, 9(1), 31-52. https://doi.org/10.1007/s11409-013-9109-5","remark":"试卷考完直接用剪刀剪下错题贴在活页纸上，省去 80% 抄题时间。","parentQuote":"","fileName":"10-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"64","tag1":"男孩必看","tag2":"自己就能做","title":"警惕「聪明但不努力」的自我感动陷阱，建立过程导向的成长型思维","cost":"不花一分钱，停止炫耀“考前没复习也能考不错”。","plain":"很多男生特别享受被家长老师夸“这孩子聪明就是不爱使劲”，为了维持这种“虚假的聪明光环”，他们甚至故意不努力，因为一旦努力了还没考好就证明自己不聪明。到了高中深度学习阶段，知识体量极其庞大，没有刻意练习的习惯，这种虚荣心会让你摔得粉身碎骨。","benefit":"Dweck 教授近 30 年关于成长型思维（Growth Mindset）的长期追踪研究证实，将成就归因于努力和方法（而非天赋智商）的学生，在面对高难度学业挫折时韧性显著增强，高阶复杂数理成绩持续领跑（国际经典实证，现行有效）。","level":"A","source":"Yeager DS, Dweck CS 等(2019). Nature, 573(7774), 364-369. https://doi.org/10.1038/s41586-019-1466-y","remark":"不要夸自己“聪明”，为自己“今天专注搞懂了 3 道复杂压轴题的步骤”而点赞。","parentQuote":"","fileName":"10-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"65","tag1":"通用","tag2":"自己就能做","title":"巧用番茄工作法单核专注25分钟，严格拒绝多任务并行处理","cost":"不花钱，普通厨房机械计时器约 10 元。","plain":"边听流行音乐、边看微信群聊、边写数学卷子，这不叫高效多任务，这叫持续工作记忆中断。人类大脑处理深度逻辑推理只能“单核运行”。设置 25 分钟闹钟，这 25 分钟内全世界只有眼前这一张卷子；闹钟响后彻底休息 5 分钟伸懒腰，大脑效率最高。","benefit":"斯坦福大学 Ophir 等经典研究证实，频繁在多任务间切换的个体，其过滤无关干扰刺激的能力更弱，工作记忆准确率显著下降，完成任务总耗时反而增加 40% 以上（国际实证，现行有效）。","level":"A","source":"Ophir E, Nass C, Wagner AD (2009). Proc Natl Acad Sci U S A, 106(37), 15583-15587. https://doi.org/10.1073/pnas.0903620106","remark":"写作业如果需要听声音，只能听无歌词的大自然白噪音或低频纯音，严禁听有中文/英文歌词的流行歌曲。","parentQuote":"","fileName":"10-怎么学习最省力：认知科学高效提分与记忆固化.md"},{"num":"66","tag1":"通用","tag2":"自己就能做","title":"理科刷题采用穿插练习而非单块集中刷题，培养中高考临场识别题型能力","cost":"不花钱，把章节综合卷或不同题型打散练习。","plain":"如果一晚上集中做 20 道立体几何题，你根本不用动脑子想“这题考什么”，做起来很顺手，但一到综合大考就傻眼。把立体几何、导数、概率打散交叉着做，虽然做题时感觉更吃力，但能逼你锻炼快速看透“这道题到底要用什么公式”的真正考场能力。","benefit":"Rohrer 等 2015 年《J Educ Psychol》初中数学随机对照试验表明，穿插练习组在 30 天后的最终综合测试中得分比集中模块刷题组高出 76%（d=0.83）（国际 RCT，现行有效）。","level":"A","source":"Rohrer D 等(2015). J Educ Psychol, 107(3), 900-908. https://doi.org/10.1037/edu0000001","remark":"平时专题巩固基础后，每周至少安排 2 次打乱知识模块的综合限时自测。","parentQuote":"","fileName":"11-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"67","tag1":"通用","tag2":"自己就能做","title":"重要大考前10分钟写下心中的焦虑与担忧，彻底释放工作记忆容量","cost":"一张草稿纸，考前 10 分钟。","plain":"一进考场就手心冒汗、心跳加速、担心考砸对不起爸妈？在发卷子前 10 分钟，拿张草稿纸把脑子里所有的害怕、焦虑和最坏打算原原本本全写下来。写在纸上就把负面情绪从工作记忆里“清空”了，脑子能腾出全部算力来专心解题。","benefit":"Ramirez \u0026 Beilock 2011 年《Science》随机对照试验表明，高焦虑学生在重大考试前进行 10 分钟表达性书写（Expressive Writing），考试成绩平均提升近一个等级分（从 B- 提升至 B+），彻底抹平了焦虑带来的发挥失常差距（国际 RCT，现行有效）。","level":"A","source":"Ramirez G, Beilock SL (2011). Science, 331(6014), 211-213. https://doi.org/10.1126/science.1199427","remark":"写完之后可以揉成团扔进垃圾桶，给大脑一个明确的“焦虑已被打包清空”的心理暗示。","parentQuote":"","fileName":"11-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"68","tag1":"通用","tag2":"自己就能做","title":"理科难题卡壳超过15分钟果断换脑休息，利用发散模式后台潜意识灵感破局","cost":"不花钱，站起来散步或接杯水 5 分钟。","plain":"解数理化大题盯着草稿纸死磕 15 分钟毫无进展时，说明你的大脑正陷入死胡同的“专注模式认知隧道”。果断放下笔，站起来去洗手间洗把脸或散步 5 分钟，让大脑进入“发散模式”。后台潜意识神经元会在全脑范围重新建立突触连接，往往在不经意间灵光一闪找出解题突破口。","benefit":"认知神经科学与顿悟（Insight）问题解决研究证实，设置孵化期（Incubation Period）暂时脱离固着任务，能显著打破定势思维，顿悟解题成功率提高 30% 以上（国际认知神经研究，现行有效）。","level":"B","source":"Sio UN, Ormerod TC (2009). Psychol Bull, 135(1), 94-120. https://doi.org/10.1037/a0014272","remark":"发散模式休息绝不是掏出手机刷短视频打游戏，短视频高频刺激会直接污染工作记忆。","parentQuote":"","fileName":"11-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"69","tag1":"女孩必看","tag2":"自己就能做","title":"坚决破除「女生学不好高中理科数理化」的伪科学性别刻板印象","cost":"不花一分钱，彻底重塑自我认知效能感。","plain":"从小听到“女孩到了初二高一就后劲不足学不好数理化”完全是社会刻板印象强加给你的心理枷锁！大脑的逻辑思维神经元结构在男女之间没有任何本质智力优劣差异。那些所谓的“后劲不足”，大多是被这种负面心理暗示摧毁了自信心、不敢提问不敢死磕导致的。","benefit":"Spencer 等 1999 年经典实验及后续荟萃证实，“刻板印象威胁”（Stereotype Threat）会人为剥夺女性在数理测试中的认知资源；当明确告知“本测试没有任何性别差异”时，女生在高等数学测试中的成绩与男生完全一致持平（国际经典 RCT，现行有效）。","level":"A","source":"Spencer SJ 等(1999). J Exp Soc Psychol, 35(1), 4-28. https://doi.org/10.1006/jesp.1998.1373 ；Hyde JS (2005). Am Psychol, 60(6), 581-592. https://doi.org/10.1037/0003-066X.60.6.581","remark":"高中选科根据自己真正的兴趣特长和未来专业规划决定，绝不受任何“文科适合女孩”传统偏见绑架。","parentQuote":"","fileName":"11-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"70","tag1":"通用","tag2":"自己就能做","title":"考试答题坚持「先易后难、遇卡果断跳过」，守住全卷基础分护城河","cost":"不花一分钱，养成答题节奏纪律。","plain":"任何中高考标准化试卷，基础题和中档题分值占比都在 70% 到 80% 以上！考场上最蠢的策略就是在一道 12 分的压轴难题上死磕 25 分钟，最后不仅压轴题没做出来，后面原本稳拿分的送分大题还没时间写。遇到卡壳 3 分钟没思路的题目，立刻打问号跳过，把全卷所有能拿的分全部入袋为安后再回来死磕。","benefit":"标准化考试测量与时间分配策略研究表明，严格遵循先易后难跳过策略的考生，卷面非智力失分率降低 65%，中高档卷面总分平均高出 12 至 18 分（全国教育考试实证，现行有效）。","level":"B","source":"教育部教育考试院(2022). 国家教育考试考务管理规范与命题评价报告.","remark":"跳题时务必在答题卡对应题号处做好醒目标记，严防答题卡涂错行倒位。","parentQuote":"","fileName":"11-数理化怎么开窍：穿插刷题与破除理科刻板印象.md"},{"num":"71","tag1":"通用","tag2":"自己就能做","title":"学习时把智能手机关机并放在另一个房间，彻底消除「脑力资源损耗」","cost":"不花一分钱，走出房门把手机放在客厅柜子里。","plain":"即使你把手机静音、屏幕朝下扣在桌上，你的大脑也在潜意识里分出相当一部分精力去“忍住不去摸手机”。这种注意力分散会导致你做复杂数理化大题时经常断片、卡壳。想高效学习 1 小时，最绝的办法就是把手机关机扔到客厅另一个房间。","benefit":"Ward 等 2017 年发表于《J Assoc Consum Res》的“脑力流失”（Brain Drain）随机试验证实，只要智能手机在视线或随手可及范围内（即便静音朝下），个体的可用工作记忆容量与流体智力测试得分就会显著下降（p\u003c0.01）；手机在另一房间组测试表现最好（国际 RCT，现行有效）。","level":"A","source":"Ward AF 等(2017). J Assoc Consum Res, 2(2), 140-154. https://doi.org/10.1086/691462","remark":"写作业查字典、查公式尽量用实体工具书；如果必须上网看网课，在电脑全屏并退出所有社交聊天软件。","parentQuote":"","fileName":"12-把手机从孩子手里夺回来：物理隔离与多巴胺脱敏.md"},{"num":"72","tag1":"通用","tag2":"自己就能做","title":"主动关闭短视频平台的「个性化个性推荐」算法，打破信息茧房与多巴胺劫持","cost":"不花一分钱，在短视频 App 设置隐私里关闭开关，耗时 10 秒。","plain":"短视频算法比你自己更懂你的弱点，你多停留 2 秒它就疯狂给你推同类刺激内容，让你像小白鼠一样被困在多巴胺陷阱里一刷就是 3 个小时。关掉“个性化推荐”后，算法不会再根据你的喜好精准投喂，推荐的内容会变得很杂很无聊，你的大脑会自然而然想放下手机。","benefit":"《互联网信息服务算法推荐管理规定》明确赋予用户随时关闭算法推荐的法定权利。关闭个性化推荐后，用户单次使用时长平均下降 35% 以上，显著降低短视频成瘾与注意力碎片化（全国法规与行为实证，现行有效）。","level":"A","source":"国家互联网信息办公室等四部门(2021). 互联网信息服务算法推荐管理规定（第十七条）. http://www.cac.gov.cn","remark":"抖音/快手操作路径：我 -\u003e 设置 -\u003e 隐私设置 -\u003e 个性化推荐 -\u003e 关闭“个性化内容推荐”。","parentQuote":"","fileName":"12-把手机从孩子手里夺回来：物理隔离与多巴胺脱敏.md"},{"num":"73","tag1":"通用","tag2":"自己就能做","title":"极度抑郁绝望或有自残自杀念头时，第一时间拨打「12356」全国统一心理援助热线","cost":"国家完全免费，免电话费，每天开通至少 18 小时至 24 小时。","plain":"当你觉得痛苦得喘不过气、身边没有人能理解你、甚至脑子里全是想死的念头时，别一个人在被窝里死撑，拿起手机拨打 12356。电话那头是经过国家严格培训的专业公立医院心理医生和危机干预咨询师，他们不会批评指责你，会全程耐心地陪你度过最危险的崩溃时刻。","benefit":"系统评价证实危机干预热线能有效阻断 70% 以上的即时自杀冲动，为脱离危险争取关键窗口期。国家卫生健康委印发通知，全国自 2025 年 5 月 1 日起统一应用“12356”作为国家心理援助热线电话，实行标准化规范接听与危机联动（全国官方政策，现行有效）。","level":"A","source":"国家卫生健康委(2024). 关于应用“12356”全国统一心理援助热线电话号码的通知. 国卫医政函〔2024〕259号. https://www.gov.cn ；Zalsman G 等(2016). Lancet Psychiatry, 3(7), 646-659.","remark":"除 12356 外，共青团全国青少年权益热线「12355」也是专门为未成年人提供免费法律与心理咨询的权威官方热线。","parentQuote":"","fileName":"13-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"74","tag1":"通用","tag2":"找爸妈一起办","title":"严重抑郁或躯体化反应无法坚持上学时，依法前往三甲公立医院开具诊断并申请休学保留学籍","cost":"三甲精神专科医院专家门诊挂号及测评约 200 至 500 元。","plain":"每天一到校门口就剧烈头痛、胃痛呕吐、整夜整夜失眠，这不是“装病”或“矫情”，这是身体在大声呼救的“躯体化障碍”。如果实在扛不住，跟爸妈去正规精神专科医院确诊。教育部明确规定因病休学一次期限为一年，保留学籍，等身心彻底养好了再回来读书，人生长得很，不差这一年。","benefit":"教育部《中小学生学籍管理办法》明确规定，学生因病确需停课治疗休养占一学期总学时三分之一以上者，凭县级以上医疗机构证明，学校必须依法为其办理休学手续并保留学籍，休学期满准予复学（全国法规，现行有效）。","level":"A","source":"教育部(2013). 中小学生学籍管理办法（第十九条、第二十条）. https://www.moe.gov.cn ；中华医学会精神医学分会(2020). 中国抑郁障碍防治指南.","remark":"【直接转给爸妈看】：爸妈，我每天恶心呕吐是真的身体生病了，教育部规定可以依法休学保留学籍 1 年，先带我把病治好，留得青山在不怕没柴烧。","parentQuote":"爸妈，我每天恶心呕吐是真的身体生病了，教育部规定可以依法休学保留学籍 1 年，先带我把病治好，留得青山在不怕没柴烧。","fileName":"13-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"75","tag1":"通用","tag2":"自己就能做","title":"坚决拒绝任何非法所谓的「全封闭戒网瘾特训学校」与夏令营","cost":"黑特训营收费每月数千至上万元，带来的是非法拘禁、体罚甚至致残致死。","plain":"社会上很多打着“国学感恩”“军事化戒网瘾”“改变逆反少年”招牌的民办特训营，全是非法办学的黑窝点。他们靠没收手机、断绝与外界联系、电击关禁闭、暴力毒打来逼孩子“认错顺从”，多名青少年在里面被活活打死或逼上绝路。谁敢诱骗你上车，立刻跳车呼救或报警。","benefit":"《未成年人网络保护条例》第二十条明令规定：任何组织和个人不得通过虐待、胁迫等侵害未成年人身心健康的方式干预未成年人沉迷网络、严禁非法拘禁等违法犯罪行为（全国行政法规，现行有效）。","level":"A","source":"国务院(2024施行). 未成年人网络保护条例（第二十条）. 国令第766号. https://www.gov.cn ；最高人民检察院关于防范严惩涉非法矫正机构侵害未成年人权益典型案例.","remark":"如果发现爸妈被黑机构洗脑企图送走你，立刻向信任的公立学校班主任、亲戚甚至直接拨打 110 举报非法拘禁。","parentQuote":"","fileName":"13-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"76","tag1":"通用","tag2":"自己就能做","title":"出现严重自伤、幻听或两个月以上持续失眠，必须去精神专科医院系统评估","cost":"公立三甲精神专科医院（如安定医院、精神卫生中心）挂号及检查约 300 至 600 元，医保可报销。","plain":"如果手臂上用圆规小刀划得全是伤口、脑子里能听见有人在耳边说话骂你、或者连续两个月整夜睡不着觉，这绝不是单纯的“情绪低落”，是大脑神经递质出了严重器质性失衡。这不是心理软弱，就像感冒肺炎一样需要医学介入。及早去正规医院吃药调理，能把大脑彻底救回来。","benefit":"青少年首发精神障碍早期干预临床研究证实，未治疗期（DUP）缩短至 3 个月以内，临床完全缓解率提升 60% 以上，远期功能恢复良好率达 75%（全国精神医学临床实证，现行有效）。","level":"B","source":"国家卫生健康委(2020). 探索抑郁症防治特色服务工作方案. 国卫办疾控函〔2020〕777号. https://www.nhc.gov.cn","remark":"【直接转给爸妈看】：爸妈，我已经持续失眠自伤两个月了，脑神经生病了不是我思想问题，带我去三甲精神科看医生开药，才能彻底好起来。","parentQuote":"爸妈，我已经持续失眠自伤两个月了，脑神经生病了不是我思想问题，带我去三甲精神科看医生开药，才能彻底好起来。","fileName":"13-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"77","tag1":"通用","tag2":"自己就能做","title":"运用「4-7-8」腹式呼吸法，3分钟平息惊恐发作与剧烈心慌躯体焦虑","cost":"不花一分钱，随时随地就地进行。","plain":"当你突然感到手脚冰凉、呼吸急促、胸口发闷像喘不上气、甚至觉得自己快要窒息死掉时（典型的急性惊恐发作），闭上嘴巴用鼻子吸气数 4 秒，憋住呼吸屏息数 7 秒，再微微张开嘴缓缓呼气数 8 秒。重复循环 4 次，能强制激活副交感神经，把狂跳的心率直接拉下来。","benefit":"慢节奏呼吸训练生理学机制证实，延长呼气时间（呼气为吸气的两倍）能强效刺激迷走神经释放乙酰胆碱，显著降低心率变异性应激指数与唾液皮质醇水平，平复过度通气综合征（国际实证，现行有效）。","level":"B","source":"Zaccaro A 等(2018). Front Hum Neurosci, 12, 353. https://doi.org/10.3389/fnhum.2018.00353","remark":"如果手脚发麻抽搐，说明大口喘气把二氧化碳全吹出去了，拿个纸袋或用双手扣在口鼻处回吸自己呼出的气体。","parentQuote":"","fileName":"13-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"78","tag1":"通用","tag2":"自己就能做","title":"遇到同伴或网友情绪崩溃扬言轻生，立刻报告校方与家长，绝不私自保守秘密","cost":"不花一分钱，微信发消息给班主任或拨打 110。","plain":"如果你的好朋友或网上网友在聊天里留遗言、发割腕照片或扬言不想活了，并求你“千万别告诉别人，这是我们的秘密”。千万别讲盲目的义气！未成年人的肩膀根本扛不住一条人命的重量。打破秘密告诉老师、家长或报警，是把他从死亡悬崖边拉回来的唯一正确做法。","benefit":"心理危机干预指南证实，绝大多数轻生者在实施前都会发出言语或行为呼救信号。同伴及时通报可使校园危机干预响应时间缩短 80%，挽救成功率极大提升（国际临床共识，现行有效）。","level":"B","source":"American Association of Suicidology (AAS)(2020). School-Based Suicide Prevention Guidelines.","remark":"真正的友谊是在他坠崖时拉他一把，而不是陪着他保守跳崖的秘密。","parentQuote":"","fileName":"13-孩子不想上学躯体化：心理危机、12356与合法休学.md"},{"num":"79","tag1":"通用","tag2":"自己就能做","title":"遭遇校园言语侮辱、肢体暴力或排挤时，立刻固定证据并保留第一现场","cost":"不花一分钱，手机录音、微信截图、拍照留存伤痕。","plain":"欺凌者最怕的就是把事情闹大和留下铁证。被骂、被威胁或被打时，不要洗掉被撕破弄脏的衣服，身上有任何淤青红肿立刻让爸妈拍照，把微信群里的辱骂记录、侮辱性小作文全部长截图并录屏备份。有了铁证，学校和公安机关才能依法严肃处理。","benefit":"最高人民法院、最高人民检察院、公安部、司法部关于依法惩治校园暴力指导意见明确指出，清晰连贯的音视频、病历、物证是界定校园欺凌和追究侵权人及监护人赔偿与行政责任的核心要件（全国司法规范，现行有效）。","level":"A","source":"最高人民法院等(2020). 关于依法惩治涉未成年人违法犯罪活动的指导意见. ；教育部等十一部门(2017). 加强中小学生欺凌综合治理方案.","remark":"如果被堵在厕所等监控盲区，尽量大声喊叫吸引走廊其他老师注意，事后第一时间找校医室或医院开具诊断证明。","parentQuote":"","fileName":"14-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"80","tag1":"通用","tag2":"找爸妈一起办","title":"对照2026年最新《治安管理处罚法》，以“学生欺凌”直接报警依法追究治安责任","cost":"不花一分钱，直接拨打 110 报警并要求出具《接报案回执》。","plain":"新修订并于 2026 年正式施行的《治安管理处罚法》有了重磅武器：专门增加了关于“学生欺凌”的处罚条款！而且满 14 周岁不满 16 周岁的未成年人只要一年内二次违反治安管理或者性质恶劣，依法可以执行行政拘留！别让欺凌者以为“未成年犯法没人管”。","benefit":"新修订《中华人民共和国治安管理处罚法》（自 2026 年 1 月 1 日起施行）明确强化了对学生欺凌等行为的法律责任追究，严格限制了对满 14 周岁未成年人违法不执行行政拘留的免责例外情形（全国法律，现行有效）。","level":"A","source":"全国人民代表大会常务委员会(2025通过, 2026施行). 中华人民共和国治安管理处罚法. https://flk.npc.gov.cn","remark":"【直接转给爸妈看】：爸妈，2026 新《治安管理处罚法》明确严惩学生欺凌，满 14 周岁性质恶劣照样拘留，我们必须立刻报警做笔录，不能由学校私下和稀泥。","parentQuote":"爸妈，2026 新《治安管理处罚法》明确严惩学生欺凌，满 14 周岁性质恶劣照样拘留，我们必须立刻报警做笔录，不能由学校私下和稀泥。","fileName":"14-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"81","tag1":"通用","tag2":"自己就能做","title":"遭遇亲友、老师或熟人性侵害或猥亵时，牢记身体自主权并保留DNA第一铁证","cost":"不花一分钱，忍住不要洗澡洗衣服。","plain":"任何触摸你隐私部位（内衣裤遮盖的地方）、或者逼你脱衣服、拍照看私处的行为，不管对方是亲戚、邻居还是德高望重的老师，全都是违法犯罪！这不是你的错，你没有做错任何事。遭遇侵害后，千万不要洗澡、不要刷牙洗脸、不要换洗衣服，把贴身衣物装进纸袋里作为证据，立刻报警求助。","benefit":"《刑法》第二百三十六条、第二百三十七条明确对负有监护、教育、救助等特殊职责的人员实施性侵猥亵从重处罚。受害人体表拭子提取的加害人 DNA、精斑是直接定罪量刑不可推翻的黄金物证（全国法律与法医规范，现行有效）。","level":"A","source":"最高人民法院、最高人民检察院、公安部、司法部(2023). 关于依法惩治性侵害未成年人犯罪的意见. https://www.court.gov.cn ；中华人民共和国刑法修正案（十一）.","remark":"全国公立医院接诊涉嫌性侵未成年人时，依法必须在第一时间启动“强制报告”制度向公安机关报案。","parentQuote":"","fileName":"14-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"82","tag1":"女孩必看","tag2":"自己就能做","title":"警惕以「恋爱、签约模特」为名的隔空网络猥亵与私密照勒索","cost":"不花一分钱，坚决不发任何隐私身体照片。","plain":"网上认识的所谓“帅气男友”或“童模星探”，在嘘寒问暖骗取信任后，哄骗你拍私密部位照片、或者视频裸聊。只要你发了一张，对方会立刻撕下伪装，威胁“如果不继续脱或者不给钱，就把裸照发给你班主任和父母”。记住：坚决不拍！如果不慎被拍，哪怕被骂也立刻告诉父母报警，对方见光就死。","benefit":"最高人民法院明确指导意见：利用网络诱骗未成年人发送裸照、视频等隔空猥亵行为，依法以猥亵儿童罪或强制猥亵罪从严追究刑事责任（入刑标准明确，现行有效）。","level":"A","source":"最高人民法院、最高人民检察院(2023). 关于办理强奸、猥亵未成年人刑事案件适用法律若干问题的解释. 法释〔2023〕4号. https://www.court.gov.cn","remark":"遇到此类勒索切忌私下转账，转账只会让敲诈者变本加厉；第一时间对聊天记录截屏留存后报案。","parentQuote":"","fileName":"14-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"83","tag1":"通用","tag2":"在校必做","title":"在校园内建立3人以上的安全同行互助圈，彻底打破欺凌者的独处落单锁定","cost":"不花一分钱，下课结伴去洗手间、食堂或放学回家。","plain":"校园欺凌者在挑选欺凌目标时，专门挑那些独来独往、性格内向、没有同伴掩护的落单学生。只要你课间去小卖部、上厕所或者放学时，始终和班上两三个靠谱的同学结伴同行，你在欺凌者眼里就会变成一块“硬骨头”，能直接避开 80% 的找茬和勒索。","benefit":"Olweus 校园欺凌防御系统追踪研究表明，拥有稳定同伴支持网络的学生遭受校园欺凌的风险降低 67%（OR 0.33, 95% CI 0.21–0.52），是学校情境中最有效的低成本微生态防护策略（国际经典研究，现行有效）。","level":"A","source":"Olweus D (2013). School-based interventions on bullying and youth violence. Annu Rev Clin Psychol, 9, 395-425. https://doi.org/10.1146/annurev-clinpsy-050212-185527","remark":"如果觉得在班里交朋友困难，加入一个自己喜欢的社团（书法、合唱、跑步），在共同兴趣圈子里结交同盟。","parentQuote":"","fileName":"14-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"84","tag1":"通用","tag2":"自己就能做","title":"遭遇老师无端当众羞辱或体罚时，理智低头不硬碰硬、事后固定录音病历追究师德","cost":"不花一分钱，保护自身安全第一。","plain":"如果遇到极个别情绪失控的老师在课堂上辱骂羞辱你、甚至动手扇巴掌体罚，在实力悬殊的现场千万不要冲动对打，避免升级为恶性伤害。保护好头脸，忍住屈辱离开教室或到办公室大声呼救。事后第一时间去医院验伤、让家长去教育局纪检组举报其违反师德红线，依法处分他。","benefit":"《中华人民共和国未成年人保护法》第二十七条明确规定：学校教职员工不得对未成年人实施体罚、变相体罚或者其他侮辱人格尊严的行为。《中小学教师违反职业道德行为处理办法》规定情节严重者直接撤销教师资格并调离教师岗位（全国法律法规，现行有效）。","level":"A","source":"全国人民代表大会常务委员会(2020修订). 中华人民共和国未成年人保护法（第二十七条）. https://flk.npc.gov.cn ；教育部(2018). 新时代中小学教师职业行为十项准则.","remark":"【直接转给爸妈看】：爸妈，今天老师在班上当众打我/严重辱骂我，法律严禁体罚学生，带我去医院开伤痕诊断，我们要向教育局纪检组举报维权。","parentQuote":"爸妈，今天老师在班上当众打我/严重辱骂我，法律严禁体罚学生，带我去医院开伤痕诊断，我们要向教育局纪检组举报维权。","fileName":"14-遇到校园欺凌怎么维权：2026新治安法与固定第一铁证.md"},{"num":"85","tag1":"通用","tag2":"找爸妈一起办","title":"算清三道刑事责任年龄红线（12-14-16岁）","cost":"0元，全家共同阅读讨论15分钟。","plain":"我国刑法年龄门槛是三道坎：**12周岁**犯故意杀人、故意伤害致人死亡或特别残忍致重残，最高检核准即可追究刑责；**14周岁**对八类重罪（杀人、重伤、强奸、抢劫、贩毒、放火、爆炸、投放危险物质）负全责；**16周岁**对所有犯罪负刑事责任。初中生不再享有“绝对豁免”，触犯严重暴力罪行一样会坐牢。","benefit":"彻底打消部分孩子“未成年犯法警察管不着”的危险侥幸心理，将恶性暴力与严重伤害防患于未然。","level":"A（全国人大常委会《中华人民共和国刑法》第十七条，2021年3月《刑法修正案（十一）》实施）。","source":"全国人大常委会公报，http://www.npc.gov.cn/","remark":"【直接转给爸妈看】：千万不要顺着孩子说“你还小警察不管”。12-14周岁犯恶性暴力案件经最高人民检察院核准直接追究刑事责任；即便不追究刑责，公安机关也可依据《预防未成年人犯罪法》送入专门学校进行专门矫治教育，人生轨迹彻底改变。\n\n---","parentQuote":"千万不要顺着孩子说“你还小警察不管”。12-14周岁犯恶性暴力案件经最高人民检察院核准直接追究刑事责任；即便不追究刑责，公安机关也可依据《预防未成年人犯罪法》送入专门学校进行专门矫治教育，人生轨迹彻底改变。\n\n---","fileName":"15-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"86","tag1":"通用","tag2":"自己就能做","title":"严禁出借出租微信、支付宝与银行卡（防帮信罪）","cost":"0元，抵制百元兼职诱惑。","plain":"任何同学或网友说“借你微信号、银行卡转一笔账，给你200块钱佣金/买皮肤”，**100%是电诈洗钱跑分**！我国刑法严厉打击“帮助信息网络犯罪活动罪（帮信罪）”。一旦把微信、支付宝、电话卡或银行卡出借给洗钱团伙，涉案金额达到标准直接构成犯罪；即使免于起诉，也会被央行纳入惩戒黑名单：5年内暂停非柜面业务、不得开新卡，微信支付宝全封禁，高考报军校、考公政审全泡汤。","benefit":"避免成为电信网络诈骗的“替罪羊”，阻断当前未成年人涉案率最高（超40%）的犯罪类型。","level":"A（最高人民法院、最高人民检察院《关于办理非法利用信息网络、帮助信息网络犯罪活动等刑事案件适用法律若干问题的解释》法释〔2019〕15号）。","source":"最高人民法院公报，https://www.court.gov.cn/","remark":"【直接转给爸妈看】：帮信罪是目前中学生、职业技术学校学生最容易糊里糊涂染上的犯罪！很多孩子觉得“我就是借卡转个账赚50块零花钱，又没偷没抢”。只要卡里进的是诈骗赃款，孩子就成了洗钱链条一环。请提醒孩子：凡是要求借卡借号转账的，哪怕是同班铁哥们，也必须一口回绝。\n\n---","parentQuote":"帮信罪是目前中学生、职业技术学校学生最容易糊里糊涂染上的犯罪！很多孩子觉得“我就是借卡转个账赚50块零花钱，又没偷没抢”。只要卡里进的是诈骗赃款，孩子就成了洗钱链条一环。请提醒孩子：凡是要求借卡借号转账的，哪怕是同班铁哥们，也必须一口回绝。\n\n---","fileName":"15-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"87","tag1":"通用","tag2":"自己就能做","title":"警惕“上头电子烟”与依托咪酯（新型毒品识别）","cost":"0元，全家学习毒品知识10分钟。","plain":"凡是宣称“合法上头”、“抽了飘飘欲仙”的电子烟，或者粉末、液体添加物，99%添加了**依托咪酯**或合成大麻素！国家已将依托咪酯列入第二类精神药品目录，**吸食依托咪酯就是吸毒，贩卖、运输依托咪酯就是贩毒**！贩毒在我国没有克数起刑点，无论数量多少一律追究刑事责任。一旦吸食，会导致癫痫抽搐、呼吸暂停，极快形成生理依赖。","benefit":"避免被所谓“潮流玩咖”圈套拉下水，从源头杜绝未成年人新型涉毒案件。","level":"A（国家药监局、公安部、国家卫健委《关于调整麻醉药品和精神药品目录的公告》2023年第120号）。","source":"中国禁毒网，http://www.nncc626.com/","remark":"【直接转给爸妈看】：依托咪酯是近年渗透未成年群体最猖獗的毒品伪装形式！常以炫彩电子烟烟弹、茶树油精油形式出现。发现孩子身上有不明怪味烟杆、突发手抖、嗜睡发呆、眼神发直，必须立即查验并寻求专业戒瘾与心理介入。\n\n---","parentQuote":"依托咪酯是近年渗透未成年群体最猖獗的毒品伪装形式！常以炫彩电子烟烟弹、茶树油精油形式出现。发现孩子身上有不明怪味烟杆、突发手抖、嗜睡发呆、眼神发直，必须立即查验并寻求专业戒瘾与心理介入。\n\n---","fileName":"15-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"88","tag1":"通用","tag2":"自己就能做","title":"坚决拒绝帮同学“约架站场子”（共同犯罪定罪）","cost":"0元，顶住人情面子。","plain":"朋友找你“去校门口站个场子，不用你动手，撑撑场面”，**绝对不能去，拔腿就跑**！在法律上，聚众斗殴、寻衅滋事属于共同犯罪。站在现场摇旗呐喊、充当声势，在司法认定中属于“积极参加者”或“同案犯”。一旦对方发生重伤、死亡，现场站场的所有人都要承担刑事连带责任并计入档案，绝不会因为“我没动手”就免责。","benefit":"避免因盲目哥们义气从围观群众沦为刑事同案犯。","level":"A（最高人民法院、最高人民检察院《关于办理寻衅滋事刑事案件适用法律若干问题的解释》法释〔2013〕18号）。","source":"最高人民检察院指导性案例，https://www.spp.gov.cn/","remark":"【直接转给爸妈看】：很多老实本分的孩子就是因为“不好意思拒绝好朋友”去站场，结果对方打红眼掏出折叠刀扎出人命，全场在场学生全被警车带走羁押。教育孩子：真正的朋友绝不会拉你去违法现场；遇到有人约架，第一时间向老师和家长汇报。\n\n---","parentQuote":"很多老实本分的孩子就是因为“不好意思拒绝好朋友”去站场，结果对方打红眼掏出折叠刀扎出人命，全场在场学生全被警车带走羁押。教育孩子：真正的朋友绝不会拉你去违法现场；遇到有人约架，第一时间向老师和家长汇报。\n\n---","fileName":"15-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"89","tag1":"通用","tag2":"自己就能做","title":"网上严禁参与“开盒挂人”与网络暴力（侵犯公民信息）","cost":"0元，克制网上宣泄与跟风冲动。","plain":"在QQ群、贴吧、微博等平台，因为网络争吵、追星饭圈矛盾，去搜集、曝光对方的真实姓名、身份证号、家庭住址、学校班级、照片并组织人身攻击，俗称“开盒挂人”。这是违法犯罪行为！情节严重的直接触犯《刑法》“侵犯公民个人信息罪”或“侮辱罪/诽谤罪”；一般情节也会依据《治安管理处罚法》处以拘留和罚款，并承担高额民事侵权赔偿责任。","benefit":"遏制网络暴民心态，保护个人网络足迹，避免留下治安处罚记录。","level":"A（最高人民法院、最高人民检察院、公安部《关于依法惩治网络暴力违法犯罪的指导意见》2023年9月）。","source":"中国政府网，http://www.gov.cn/","remark":"【直接转给爸妈看】：现在饭圈和游戏圈“开盒”门槛极低，花几块钱社工库就能查到信息。很多初中生误以为网上说话查不到IP和真人。网警调取后台数据只要几分钟。一旦立案，孩子的数字设备被扣押，还将面临名誉权官司。\n\n---","parentQuote":"现在饭圈和游戏圈“开盒”门槛极低，花几块钱社工库就能查到信息。很多初中生误以为网上说话查不到IP和真人。网警调取后台数据只要几分钟。一旦立案，孩子的数字设备被扣押，还将面临名誉权官司。\n\n---","fileName":"15-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"90","tag1":"通用","tag2":"找爸妈一起办","title":"严禁非法改装电动自行车与未成年骑行（道路交通安全红线）","cost":"0元，拒绝解限速改装。","plain":"我国法规严令：**未满16周岁不得骑电动自行车上路**！同时，将电动自行车解除限速（超过25km/h）、改装大容量锂电池（如72V/96V）、加装大电机，在法律上会被直接鉴定为**轻便摩托车或普通摩托车（机动车）**！未成年人无证驾驶改装机动车一旦发生撞人事故，保险公司一分不赔，父母承担无限连带赔偿责任；若致人死伤更直接触犯交通肇事罪。改装电池在室内充电起火致人伤亡，父母及车主承担失火罪刑事责任。","benefit":"消除青少年交通事故与火灾致残致死首要风险，避免家庭瞬间背负数百万债务。","level":"A（全国人大常委会《中华人民共和国道路交通安全法》实施条例第七十二条；公安部交管局专项整治公告）。","source":"公安部交通管理局，https://www.mps.gov.cn/","remark":"【直接转给爸妈看】：许多男孩喜欢虚荣“改车提速”。一旦改装超速超标，在法律责任上就是无牌无证驾驶机动车上路！撞伤路人赔偿往往四五十万起步，医保和第三者商业险全部拒赔，掏空一个家庭的全部积蓄。坚决杜绝买改装车和解限速。\n\n---","parentQuote":"许多男孩喜欢虚荣“改车提速”。一旦改装超速超标，在法律责任上就是无牌无证驾驶机动车上路！撞伤路人赔偿往往四五十万起步，医保和第三者商业险全部拒赔，掏空一个家庭的全部积蓄。坚决杜绝买改装车和解限速。\n\n---","fileName":"15-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"91","tag1":"通用","tag2":"找爸妈一起办","title":"了解未成年人犯罪记录封存制度（给出错孩子重生的机会）","cost":"0元，咨询法律援助或办案机关。","plain":"如果孩子在未成年时期（犯罪时不满18周岁）因一时糊涂犯错被判处**五年有期徒刑以下刑罚**，我国法律规定对相关犯罪记录实行**严格封存**！封存后，除司法机关办案或者有关单位按国家规定查询外，任何单位和个人不得查询，向有关单位求职或考学时**免除前科报告义务**。公安机关开具的“无违法犯罪记录证明”不得载明被封存记录。","benefit":"避免“一朝失足终身留污点”导致青年自暴自弃，保护孩子正常高考、上大学和就业的合法权利。","level":"A（最高人民法院、最高人民检察院、公安部、司法部《关于关于贯彻落实未成年人刑事案件犯罪记录封存制度的实施办法》2022年5月）。","source":"最高人民检察院官网，https://www.spp.gov.cn/","remark":"【直接转给爸妈看】：这项法律制度是国家给迷途青少年的“保护伞”。如果孩子曾经误入歧途受到较轻刑事处罚，家长应当知悉合法权利，在升学、入职遭遇非法歧视或单位违规索要未成年案底时，可申请检察机关依法监督，为孩子洗去社会污名。","parentQuote":"这项法律制度是国家给迷途青少年的“保护伞”。如果孩子曾经误入歧途受到较轻刑事处罚，家长应当知悉合法权利，在升学、入职遭遇非法歧视或单位违规索要未成年案底时，可申请检察机关依法监督，为孩子洗去社会污名。","fileName":"15-别让孩子糊里糊涂进局子：12-14-16刑责线与帮信罪.md"},{"num":"92","tag1":"通用","tag2":"找爸妈一起办","title":"拒买任何“治愈/逆转近视”仪器与针灸贴片","cost":"0元，全家统一科学认知。","plain":"任何宣称能“摘掉眼镜”、“降低近视度数”、“治愈真性近视”的眼部按摩仪、远红外眼罩、耳穴贴、训练仪、拉筋增高视力仪，**100%是虚假宣传骗局**！国家卫健委、市场监管总局等六部门早在2019年就联合发文严厉明令禁止使用“康复”、“恢复”、“近视治愈”等误导词汇。真性近视是**眼轴变长（眼球结构拉长）**，就像人长高了一样，物理结构不可逆缩短！乱用仪器不仅浪费钱，还会延误正规角膜塑形或离焦镜干预，甚至损伤角膜与眼底。","benefit":"避免单个家庭被收割3000~30000元智商税，确保孩子在正规医院视光门诊接受科学防控。","level":"A（国家卫健委、教育部、市场监管总局等六部门《关于进一步规范儿童青少年近视矫正工作切实加强监管的通知》国卫办监督发〔2019〕12号）。","source":"国家卫生健康委员会官网，http://www.nhc.gov.cn 人都应该立即开启SIM卡PIN码。万一手机不慎丢失，家长第一时间用另一部手机拨打运营商电话（移动10086、联通10010、电信10000）办理**紧急挂失停机**，并冻结微信、支付宝。\n\n---","parentQuote":"这是全网最高效且零成本的资金安全动作！全家人都应该立即开启SIM卡PIN码。万一手机不慎丢失，家长第一时间用另一部手机拨打运营商电话（移动10086、联通10010、电信10000）办理**紧急挂失停机**，并冻结微信、支付宝。\n\n---","fileName":"18-账号、隐私与数字防身：SIM卡PIN码与防开盒挂人.md"},{"num":"101","tag1":"通用","tag2":"自己就能做","title":"社交平台发图打码关键信息（防开源情报OSINT追踪）","cost":"0元，发朋友圈/小红书前检查1分钟。","plain":"中学生发自拍、日常动态时，**绝对不要泄露以下细节**：\n  1. **校服校徽、校门口建筑物、宿舍窗外固定地标**（很容易锁定就读学校甚至班级）；\n  2. **火车票、飞机登机牌、快递单、电影票**（二维码/条形码里包含姓名、身份证号与航班号，直接扫码就能破解隐私）；\n  3. **家门钥匙形状、家门牌号、自家阳台窗外视野**（通过楼层角度与建筑物阴影几分钟就能推算出具体小区和门牌栋数）；\n  4. 发原图前**关闭相机的地理位置标签（Exif GPS信息）**，或发送时不要勾选“发送原图”。","benefit":"避免被心怀不轨的网友、潜伏黑产人员顺藤摸瓜找到现实住址和学校实施骚扰跟踪。","level":"A（全国信息安全标准化技术委员会《信息安全技术 个人信息安全规范》GB/T 35273-2020）。","source":"国家标准化管理委员会，http://openstd.samr.gov.cn/","remark":"【直接转给爸妈看】：很多家长喜欢在朋友圈晒娃“晒录取通知书”、“晒奖状”、“晒生日聚会”，通知书上的考生号、身份证号、条形码全无遮挡！这直接给不法分子提供了完整真实的个人信息。发圈晒娃务必遮盖所有证件号、条形码和真实学校名称。\n\n---","parentQuote":"很多家长喜欢在朋友圈晒娃“晒录取通知书”、“晒奖状”、“晒生日聚会”，通知书上的考生号、身份证号、条形码全无遮挡！这直接给不法分子提供了完整真实的个人信息。发圈晒娃务必遮盖所有证件号、条形码和真实学校名称。\n\n---","fileName":"18-账号、隐私与数字防身：SIM卡PIN码与防开盒挂人.md"},{"num":"102","tag1":"通用","tag2":"找爸妈一起办","title":"遭遇网络“开盒”与网暴的处理流程（一键存证与法律反击）","cost":"0元，依法取证维权。","plain":"如果孩子在网络上遭遇他人泄露姓名、身份证、电话、照片并被骚扰（俗称被“开盒”）：\n  1. **切忌愤怒对骂或立刻注销账号**：注销会导致聊天记录和侵权网址灭失，丧失证据；\n  2. **全程录屏存证**：使用另一部手机录制屏幕，从系统时间、打开该社交平台、点开对方主页、个人UID、发表的侵权贴文、评论区恶评、私信骚扰，全流程一气呵成录下来；\n  3. **向平台投诉并要求下架**：依据《民法典》第一千一百九十五条，向平台发出“侵权通知”，平台接到有效通知未及时删除的，对扩大部分承担连带赔偿责任；\n  4. **报警受案**：带上录屏材料直接到辖区派出所报案，要求按违反《治安管理处罚法》第四十二条（公然侮辱或散布他人隐私）立案行政拘留，并可向法院提起名誉权、隐私权民事诉讼索赔精神损失费。","benefit":"以法律铁拳震慑网络恶霸，迫使侵权内容迅速删除，保护未成年人心理防线。","level":"A（最高人民法院、最高人民检察院、公安部《关于依法惩治网络暴力违法犯罪的指导意见》；《中华人民共和国民法典》第一千一百九十五条）。","source":"中国政府网，http://www.gov.cn/","remark":"【直接转给爸妈看】：被开盒的孩子通常极其恐慌、自责甚至产生轻生念头。家长此时千万不能责怪孩子“你天天上网惹是生非干什么”，而要成为孩子的坚强后盾，明确告诉孩子：“这是对方违法犯罪，爸妈带你去报警，法律会狠狠惩治他们！”及时带孩子脱离有害网络环境。\n\n---","parentQuote":"被开盒的孩子通常极其恐慌、自责甚至产生轻生念头。家长此时千万不能责怪孩子“你天天上网惹是生非干什么”，而要成为孩子的坚强后盾，明确告诉孩子：“这是对方违法犯罪，爸妈带你去报警，法律会狠狠惩治他们！”及时带孩子脱离有害网络环境。\n\n---","fileName":"18-账号、隐私与数字防身：SIM卡PIN码与防开盒挂人.md"},{"num":"103","tag1":"通用","tag2":"自己就能做","title":"严禁租售个人社交账号（微信/QQ/抖音/快手）","cost":"0元，拒绝微商或黑产租号诱惑。","plain":"网上经常有广告：“租微信号/快手号/抖音号，挂机一天给80-150元佣金，不用你管”。**绝对不能租！绝对不能卖！**黑产租用学生账号的目的，100%是用来发送色情引流信息、发布招嫖赌博广告、或者用于电信网络诈骗洗钱。一旦被腾讯、抖音风控系统捕捉或被受害人举报，你的账号会被永久封禁且无法解封；实名绑定的手机号会被运营商拉黑；情节严重帮助诈骗实施的，同样构成“帮助信息网络犯罪活动罪”。","benefit":"保护个人实名信用，防止自己多年积攒的微信好友、同学圈子沦为黑产宰割的“肉鸡”。","level":"A（公安部“净网”专项行动通报案例；《中华人民共和国反电信网络诈骗法》第三十一条）。","source":"公安部刑侦局，https://www.mps.gov.cn/","remark":"【直接转给爸妈看】：很多中学生零花钱不够用，看到同学在“租号赚钱”就盲目跟风。租出去几小时后，微信号就发了几百条虚假投资或者兼职刷单信息给通讯录里的亲戚长辈。家长应当定期查看孩子的手机应用登录设备列表，杜绝异地非常规授权。","parentQuote":"很多中学生零花钱不够用，看到同学在“租号赚钱”就盲目跟风。租出去几小时后，微信号就发了几百条虚假投资或者兼职刷单信息给通讯录里的亲戚长辈。家长应当定期查看孩子的手机应用登录设备列表，杜绝异地非常规授权。","fileName":"18-账号、隐私与数字防身：SIM卡PIN码与防开盒挂人.md"},{"num":"104","tag1":"通用","tag2":"找爸妈一起办","title":"算清中职与普高的真实出路（搞懂“3+4中本贯通”与职教高考）","cost":"0元，全家研读本地教育考试院中考招生指南。","plain":"如果中考分数离普高录取线有明显差距，**盲目花高价去上管理松散的民办差普高，不如精准填报公办优质中职的“3+4中本贯通”或“五年一贯制大专”**！","benefit":"避免普通工薪家庭因“普高执念”背负十几万教育负债却换来大专录取，利用政策洼地实现本科直通。","level":"A（教育部、财政部、人力资源社会保障部等部门关于推动现代职业教育高质量发展的实施意见；各省教育厅中职本科贯通培养指导方案）。","source":"教育部职业教育与成人教育司，http://www.moe.gov.cn/","remark":"【直接转给爸妈看】：家长最大的心病是怕职校风气差。选择职业学校切记两大铁律：1. 坚决选**公办国家级重点中专或公办高职院校的五年制**，坚决不碰营利性私立野鸡技校；2. 认准招生代码上的“中本贯通”或“单招升学班”，看学校每年的转段升学率和职教高考本科上线率，把孩子送进以升学为导向的班级。\n\n---","parentQuote":"家长最大的心病是怕职校风气差。选择职业学校切记两大铁律：1. 坚决选**公办国家级重点中专或公办高职院校的五年制**，坚决不碰营利性私立野鸡技校；2. 认准招生代码上的“中本贯通”或“单招升学班”，看学校每年的转段升学率和职教高考本科上线率，把孩子送进以升学为导向的班级。\n\n---","fileName":"19-中考分流与18岁出路：中职普高算账、3加4贯通与兵役.md"},{"num":"105","tag1":"通用","tag2":"找爸妈一起办","title":"掌握18岁兵役登记与入伍国家优待政策（退役免试专升本/考研加分）","cost":"0元，登录全国征兵网（每年1月1日至6月30日完成兵役登记）。","plain":"当年年满18周岁的男性公民依法必须进行兵役登记。对于普通家庭孩子而言，**参军入伍是一条性价比极高的发展通道**：\n  1. **学费全免与学费补偿**：本专科生每生每年最高补偿代偿16000元，研究生最高20000元（大学学费直接由国家报销）；\n  2. **优待金与安置费**：入伍两年退役，各地政府发放家庭优待金和退役补助金，经济较发达地区往往在10-25万元不等；\n  3. **升学硬核政策红利**：专科生退役后**免试入读普通本科**（免除专升本考试）；教育部设立“退役大学生士兵专项硕士研究生招生计划”（全国单独划线，竞争难度大幅降低）；考研初试总分加10分；报考公务员、消防员、事业单位设立专门定向招录岗位。","benefit":"全额解决全家读大学的学费负担，退役即获学历提升通道或体制内招录优势，锻炼刚毅体魄。","level":"A（全国人大常委会《中华人民共和国兵役法》2021年修订；财政部、教育部、退役军人事务部财教〔2021〕310号）。","source":"全国征兵网，https://www.gfbzb.gov.cn/","remark":"【直接转给爸妈看】：很多家长担心“当兵耽误读书”。实际上，**最推荐的入伍时机是“拿到大学录取通知书后保留学籍入伍”或者“大专/大学毕业当年入伍”**。在学校保留学籍当兵两年，拿着优待金回学校继续免学费读书；大专毕业生当兵退役直接保送本科，彻底解决学历提升瓶颈。\n\n---","parentQuote":"很多家长担心“当兵耽误读书”。实际上，**最推荐的入伍时机是“拿到大学录取通知书后保留学籍入伍”或者“大专/大学毕业当年入伍”**。在学校保留学籍当兵两年，拿着优待金回学校继续免学费读书；大专毕业生当兵退役直接保送本科，彻底解决学历提升瓶颈。\n\n---","fileName":"19-中考分流与18岁出路：中职普高算账、3加4贯通与兵役.md"},{"num":"106","tag1":"通用","tag2":"自己就能做","title":"高中毕业暑期兼职防坑（远离“医美贷”、“押金陷阱”与黑中介）","cost":"0元，兼职前核验劳动合同。","plain":"高考/中考结束后，准大学生和高中毕业生找兼职最容易踩三大致命坑：\n  1. **“招募平面模特/前台/主播，但需要先贷款整容/买服装”**：这是极其恶毒的“医美贷”骗局！套路是忽悠学生分期贷款几万元去指定小诊所隆鼻割双眼皮，承诺兼职收入还贷，手术一完公司立即失联，学生背负巨额高利贷；\n  2. **“先交300-500元押金、体检费、办卡费”**：我国《劳动合同法》第九条严令禁止用人单位扣押劳动者居民身份证，严禁要求劳动者提供担保或者以其他名义向劳动者收取财物。凡是入职前要交钱的，100%是黑中介；\n  3. **“高薪打字员、刷单返利、日结500元”**：全系电信诈骗或灰产引流。","benefit":"保护刚满18岁的青年免受网贷剥削，树立正规劳动法律意识。","level":"A（全国人大常委会《中华人民共和国劳动合同法》第九条、第八十四条；人社部高校毕业生求职就业防骗指南）。","source":"人力资源和社会保障部官网，http://www.mohrss.gov.cn/","remark":"【直接转给爸妈看】：高考结束的暑假是孩子接触社会的“第一课”。找兼职只认准两条安全通道：1. 正规大型连锁企业（如肯德基、麦当劳、星巴克、大型超市、顺丰等直营门店），流程规范、按工时发薪、不押身份证；2. 熟人推荐的家教或图书馆、社区志愿者岗位。切忌在58同城或QQ群随便联系“招募高薪演艺主播兼职”。","parentQuote":"高考结束的暑假是孩子接触社会的“第一课”。找兼职只认准两条安全通道：1. 正规大型连锁企业（如肯德基、麦当劳、星巴克、大型超市、顺丰等直营门店），流程规范、按工时发薪、不押身份证；2. 熟人推荐的家教或图书馆、社区志愿者岗位。切忌在58同城或QQ群随便联系“招募高薪演艺主播兼职”。","fileName":"19-中考分流与18岁出路：中职普高算账、3加4贯通与兵役.md"},{"num":"107","tag1":"通用","tag2":"找爸妈一起办","title":"申领中职全免学费与普通高中国家助学金（高中阶段零学费）","cost":"0元，凭户籍或家庭困难证明向就读学校申报。","plain":"1. **中等职业学校免学费政策**：国家对中等职业学校**全日制学历教育正式学籍一、二、三年级在校生中所有农村（含县镇）学生、城市涉农专业学生和家庭经济困难学生**免除学费（艺术类相关表演专业除外）。在许多省份，公办中职学费实现全员免除！\n  2. **中职国家助学金**：一、二年级涉农专业学生和非涉农专业家庭经济困难学生，每生每年平均资助**2000元**（特困地区覆盖面更广）。\n  3. **普通高中国家助学金**：用于资助普通高中在校生中的家庭经济困难学生，平均资助标准为每生每年**2000元**，脱贫户、低保户、特困供养、残疾学生等四类家庭学生还可直接享受**免除学杂费**政策。","benefit":"彻底打消普通农村与低收入家庭“供不起高中/中专”的顾虑，让孩子安心完成基础阶段教育。","level":"A（财政部、教育部、人社部《学生资助资金管理办法》财教〔2021〕310号）。","source":"全国学生资助管理中心，http:// let doneMap = {};
try {
  doneMap = JSON.parse(localStorage.getItem('YGG_DONE_ITEMS') || '{}');
} catch (e) { doneMap = {}; }

let currentFilters = { gender: 'all', actor: 'all', query: '', onlyUnfinished: false };

function saveDone() {
  try {
    localStorage.setItem('YGG_DONE_ITEMS', JSON.stringify(doneMap));
  } catch (e) {}
  updateProgress();
}

function toggleItemDone(num) {
  if (doneMap[num]) {
    delete doneMap[num];
  } else {
    doneMap[num] = true;
  }
  saveDone();
  filterItems();
}

function updateProgress() {
  const total = window.CORPUS_DATA.length;
  const done = Object.keys(doneMap).filter(k => doneMap[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('pctText').textContent = `(${pct}%)`;
  document.getElementById('progFill').style.width = pct + '%';
}

function toggleFilterDone() {
  currentFilters.onlyUnfinished = !currentFilters.onlyUnfinished;
  event.target.style.background = currentFilters.onlyUnfinished ? 'var(--primary)' : '';
  event.target.style.color = currentFilters.onlyUnfinished ? '#fff' : '';
  filterItems();
}

function resetDone() {
  if (confirm('确定要清空所有已落实打卡记录吗？')) {
    doneMap = {};
    saveDone();
    filterItems();
  }
}

function setFilter(btn) {
  const type = btn.getAttribute('data-filter');
  const val = btn.getAttribute('data-val');
  document.querySelectorAll(`.btn-tag[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilters[type] = val;
  filterItems();
}

function filterItems() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  currentFilters.query = query;

  const filtered = window.CORPUS_DATA.filter(item => {
    if (currentFilters.onlyUnfinished && doneMap[item.num]) return false;

    if (currentFilters.gender === 'boy' && item.tag1 !== '男孩必看') return false;
    if (currentFilters.gender === 'girl' && item.tag1 !== '女孩必看') return false;
    if (currentFilters.gender === 'common' && item.tag1 !== '通用') return false;

    if (currentFilters.actor === 'self' && item.tag2 !== '自己就能做') return false;
    if (currentFilters.actor === 'parent' && item.tag2 !== '找爸妈一起办') return false;

    if (query) {
      const match = item.title.toLowerCase().includes(query) ||
                    item.plain.toLowerCase().includes(query) ||
                    item.benefit.toLowerCase().includes(query) ||
                    item.cost.toLowerCase().includes(query);
      if (!match) return false;
    }
    return true;
  });

  renderItems(filtered);
}

function renderItems(items) {
  const container = document.getElementById('itemsContainer');
  document.getElementById('resultCount').textContent = `匹配到 ${items.length} 条建议`;

  if (!items.length) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted);">没有找到符合条件的建议，换个词试试？</div>`;
    return;
  }

  container.innerHTML = items.map(it => {
    let tagClass = 'all';
    if (it.tag1.includes('男')) tagClass = 'boy';
    if (it.tag1.includes('女')) tagClass = 'girl';
    const isDone = !!doneMap[it.num];

    return `
      <div class="card ${isDone ? 'done' : ''}">
        <div class="card-header">
          <div class="card-title">
            <span style="color:var(--primary);">#${it.num}</span>
            <span class="badge ${tagClass}">${it.tag1}</span>
            <span class="badge level">证据 ${it.level}级</span>
            <span>${it.title}</span>
          </div>
          <button class="check-toggle ${isDone ? 'checked' : ''}" onclick="toggleItemDone('${it.num}')">
            ${isDone ? '✓ 已落实' : '○ 标记落实'}
          </button>
        </div>
        
        <div class="plain-box">
          <strong>💡 说人话：</strong>${it.plain}
        </div>

        <div class="section-item"><strong>💰 成本：</strong>${it.cost}</div>
        <div class="section-item"><strong>📊 收益与依据：</strong>${it.benefit}</div>
        <div class="section-item"><strong>🔗 权威来源：</strong><span style="font-size:12px;color:var(--muted);">${it.source}</span></div>

        ${it.parentQuote ? `
          <div class="parent-quote">
            <span><strong>📢 直接发给爸妈看：</strong>${it.parentQuote}</span>
            <button class="copy-btn" onclick="copyText('${it.parentQuote.replace(/'/g, "\\'")}')">一键复制</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function copyText(txt) {
  navigator.clipboard.writeText(txt).then(() => {
    alert("已复制话术到剪贴板，可直接粘贴微信发给爸妈！");
  }).catch(() => {
    prompt("请手动复制以下话术：", txt);
  });
}

function init() {
  updateProgress();
  renderItems(window.CORPUS_DATA);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
